<script>
/**
 * App.html — all client JavaScript.
 *
 * The permissions received here are a UI HINT ONLY. THIENTAN-API re-checks every
 * call. Nothing in this file is a security boundary.
 */
(function () {
  'use strict';

  var session = null;
  var activeView = 'home';
  var appUrl = '';
  var logoutUrl = 'https://accounts.google.com/Logout';

  /* ---------------- server bridge ---------------- */

  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    var tCall = Date.now();
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            // Milestone 2.5 / P1: closes the loop on the browser ⇄ google.script.run
            // leg, which the server-side numbers below can't see on their own.
            if (res.data && res.data._ms) {
              res.data._ms.script = Math.max(0, Date.now() - tCall -
                (res.data._ms.total || 0) - (res.data._ms.transport || 0));
              renderTiming(res.data._ms);
            }
            resolve(res.data);
          }
          else reject(new Error((res && res.error) || 'Đã xảy ra lỗi. Vui lòng thử lại.'));
        })
        .withFailureHandler(function (err) {
          reject(new Error((err && err.message) ||
            'Không kết nối được máy chủ. Kiểm tra kết nối mạng.'));
        })[fnName].apply(null, args);
    });
  }

  /* ---------------- helpers ---------------- */

  function el(id) { return document.getElementById(id); }

  function can(name) {
    return !!(session && session.permissions && session.permissions[name] === true);
  }

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatVnd(n) {
    return Math.round(Number(n) || 0).toLocaleString('vi-VN') + ' ₫';
  }

  function formatDate(value) {
    if (!value) return '';
    var d = (value instanceof Date) ? value : new Date(value);
    if (isNaN(d.getTime())) return String(value);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function toast(message, isError) {
    var node = document.createElement('div');
    node.className = 'toast' + (isError ? ' err' : '');
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(function () { node.remove(); }, 3600);
  }

  /**
   * The bridge the view modules (ui/Views*.html) use. `config` and `session` are
   * read through functions, not captured once: a view built before the session
   * arrived would otherwise hold an empty object forever.
   */
  window.TT = {
    call: call, can: can, esc: esc, formatVnd: formatVnd,
    formatDate: formatDate, toast: toast, confirm: confirm_,
    config: function () { return (session && session.config) || {}; },
    session: function () { return session; }
  };

  /* ---------------- navigation ---------------- */

  var VIEWS = [
    { id: 'home',       label: 'Trang chủ',  permission: null },
    { id: 'orders',     label: 'Đơn hàng',   permission: 'view_orders' },
    { id: 'statistics', label: 'Thống kê',   permission: 'view_statistics' },
    { id: 'inventory',  label: 'Kho hàng',   permission: 'manage_inventory' },
    { id: 'users',      label: 'Người dùng', permission: 'manage_users' }
  ];

  function renderNav() {
    var nav = el('nav');
    nav.innerHTML = '';
    VIEWS.filter(function (v) { return !v.permission || can(v.permission); })
      .forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = v.label;
        if (v.id === activeView) b.classList.add('active');
        b.addEventListener('click', function () { show(v.id); });
        nav.appendChild(b);
      });
  }

  function show(viewId) {
    activeView = viewId;
    renderNav();

    var main = el('main');
    if (viewId === 'home') { main.innerHTML = homeHtml(); return; }

    // A view module owns its own DOM from here on. If the file is missing, fall
    // back to the placeholder rather than showing a blank screen.
    var module = VIEW_MODULES[viewId];
    if (module && window[module] && typeof window[module].render === 'function') {
      main.innerHTML = '';
      // A throw inside a view used to leave whatever it had painted last on
      // screen — which reads as "stuck loading forever". Say so instead.
      try {
        window[module].render(main);
      } catch (err) {
        console.error('view ' + viewId + ' failed: ' + (err && err.stack ? err.stack : err));
        main.innerHTML = '<section class="card"><p class="empty err-text">' +
          'Không mở được màn hình này. Vui lòng tải lại trang.</p></section>';
      }
      return;
    }
    main.innerHTML = placeholderHtml(viewId);
  }

  /** viewId → the global a ui/Views*.html file registers itself under. */
  var VIEW_MODULES = { orders: 'TTOrders' };

  /* ---------------- views ---------------- */

  function homeHtml() {
    var granted = [], denied = [];
    Object.keys(session.permissions).forEach(function (k) {
      if (k === 'visible_fields') return;
      (session.permissions[k] === true ? granted : denied).push(k);
    });

    var chips = granted.map(function (k) { return '<li class="perm on">' + esc(k) + '</li>'; })
      .concat(denied.map(function (k) { return '<li class="perm">' + esc(k) + '</li>'; }))
      .join('');

    var fields = session.permissions.visible_fields || [];
    var fieldText = (fields.length === 1 && fields[0] === '*') ? 'Toàn bộ cột' : fields.join(', ');
    return '' +
      '<section class="card">' +
        '<h2>Tài khoản của bạn</h2>' +
        '<dl class="kv">' +
          '<dt>Họ tên</dt><dd>' + esc(session.displayName) + '</dd>' +
          '<dt>Email</dt><dd>' + esc(session.email) + '</dd>' +
          '<dt>Vai trò</dt><dd>' + esc(session.role) + '</dd>' +
          '<dt>Cột được xem</dt><dd>' + esc(fieldText) + '</dd>' +
        '</dl>' +
      '</section>' +
      '<section class="card">' +
        '<h2>Quyền hạn</h2>' +
        '<ul class="perm-list">' + chips + '</ul>' +
      '</section>';
  }

  function placeholderHtml(viewId) {
    var view = VIEWS.filter(function (v) { return v.id === viewId; })[0];
    var milestone = { orders: 2, statistics: 4, inventory: 5, users: 5 }[viewId] || 2;
    return '' +
      '<section class="card">' +
        '<h2>' + esc(view ? view.label : '') + '</h2>' +
        '<p class="empty">Chức năng này sẽ có ở giai đoạn ' + milestone + '.</p>' +
      '</section>';
  }

  /* ---------------- build stamp (DEV_MODE only) ---------------- */

  /**
   * The one real hazard of two projects is pushing one side and forgetting to
   * publish a new version of the other. Showing both build strings makes that
   * visible instead of silent.
   */
  function renderBuild(build) {
    var node = el('build-stamp');
    if (!build) { node.classList.add('hidden'); return; }
    node.textContent = build.web + '  ·  ' + build.api;
    node.classList.remove('hidden');

    var webDate = (build.web || '').replace('web-', '');
    var apiDate = (build.api || '').replace('api-', '');
    node.classList.toggle('drift', !!apiDate && !!webDate && apiDate !== webDate);
  }

  /**
   * Milestone 2.5 / P1 — per-call latency, DEV_MODE only (same signal as
   * renderBuild: `session.build` is null outside DEV_MODE, see buildStamp_ in
   * Main.gs). Overwritten on every server round trip, so it always reflects the
   * most recent action — most usefully right after "Đơn hàng" loads.
   *
   * gate/user/đọc = inside the API (Router.gs); mạng = the WEB → API HTTP hop
   * (ApiClient.gs); script = browser ⇄ google.script.run overhead (this file).
   */
  function renderTiming(ms) {
    var node = el('timing-stamp');
    if (!node) return;
    if (!ms || !session || !session.build) { node.classList.add('hidden'); return; }

    var total = (ms.total || 0) + (ms.transport || 0) + (ms.script || 0);
    node.textContent = 'gate ' + ms.gate + 'ms · user ' + ms.user + 'ms · đọc ' + ms.read +
      'ms · mạng ' + (ms.transport || 0) + 'ms · script ' + (ms.script || 0) +
      'ms · tổng ' + total + 'ms';
    node.classList.remove('hidden');
  }

  /* ---------------- boot ---------------- */

  function denied(info) {
    el('boot').classList.add('hidden');
    el('denied-message').textContent = info.message || 'Đã xảy ra lỗi. Vui lòng thử lại.';
    el('denied-email').textContent = info.email || 'Không xác định được';

    var urls = info.urls || {};
    appUrl = urls.app || '';
    if (urls.logout) logoutUrl = urls.logout;
    var locked = info.reason === 'locked';
    var sec = info.security || null;
    var isAdmin = !!(sec && sec.isAdmin);

    // A locked system is not an account problem: hide the account options so the
    // person is not sent chasing the wrong fix.
    el('account-options').classList.toggle('hidden', locked);
    el('options-lead').classList.toggle('hidden', locked);
    el('locked-help').classList.toggle('hidden', !(locked && isAdmin));
    el('ask-access-wrap').classList.toggle('hidden', locked);

    if (!locked) {
      renderAccountOptions();
      renderAskAccess(urls.supportEmail, info.email);
    }

    renderDiag(info.diag);
    el('denied').classList.remove('hidden');
  }

  function renderDiag(diag) {
    var box = el('diag-box'), table = el('diag-table');
    if (!diag) { box.classList.add('hidden'); return; }

    table.innerHTML = '';
    Object.keys(diag).forEach(function (k) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      var td2 = document.createElement('td');
      td1.textContent = k;
      td2.textContent = diag[k];
      tr.appendChild(td1); tr.appendChild(td2);
      table.appendChild(tr);
    });
    box.classList.remove('hidden');
  }

  function authorized(data) {
    session = data;
    el('user-name').textContent = session.displayName;
    el('user-email').textContent = session.email;
    el('user-role').textContent = (session.role === 'admin') ? 'Quản trị' : 'Nhân viên';
    appUrl = (session.urls && session.urls.app) || '';
    if (session.urls && session.urls.logout) logoutUrl = session.urls.logout;

    renderSecurityBanner(session.security);
    renderBuild(session.build);
    el('boot').classList.add('hidden');
    el('app').classList.remove('hidden');
    show('home');

    // Milestone 2.5 / P3 + L3 — warm the orders cache after a short delay so
    // this listOrders hop does not compete with the just-finished getSession
    // under a cold API. can('view_orders') mirrors the nav visibility check.
    if (can('view_orders') && window.TTOrders && typeof window.TTOrders.prefetch === 'function') {
      setTimeout(function () {
        try { window.TTOrders.prefetch(); } catch (e) { /* ignore */ }
      }, 400);
    }
  }

  function start() {
    call('apiGetSession')
      .then(function (data) {
        if (data && data.authorized) authorized(data);
        else denied(data || {});
      })
      .catch(function (err) {
        denied({ message: err.message, email: '', urls: {} });
      });
  }

  /**
   * Offer to ask the admin for access with THIS account. Often the real fix: the
   * person is signed in as the account they use all day, and it simply has not
   * been added to the Users sheet yet.
   */
  function renderAskAccess(supportEmail, currentEmail) {
    var wrap = el('ask-access-wrap');
    if (!wrap) return;
    if (!supportEmail || !currentEmail) { wrap.classList.add('hidden'); return; }

    var subject = 'Xin cấp quyền truy cập THIÊN TÂN';
    var body = 'Chào anh/chị,\n\nEm không truy cập được ứng dụng THIÊN TÂN.\n' +
               'Tài khoản Google em đang dùng: ' + currentEmail + '\n\n' +
               'Nhờ anh/chị cấp quyền giúp em. Em cảm ơn.';
    el('ask-access').href = 'mailto:' + supportEmail +
      '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    wrap.classList.remove('hidden');
  }

  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(function () { toast('Đã sao chép đường dẫn.'); })
        .catch(function () { toast('Không sao chép được. Hãy chọn và copy thủ công.', true); });
    } else {
      toast('Trình duyệt không hỗ trợ sao chép. Hãy chọn và copy thủ công.', true);
    }
  }

  /**
   * Detect enough about the browser to name the right menu item and the right
   * keystroke. Wrong wording here is the difference between a step someone
   * follows and a step someone abandons.
   */
  function browserInfo() {
    var ua = navigator.userAgent;
    var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || ua);
    var info = { name: 'Chrome', priv: 'cửa sổ ẩn danh', key: 'Shift + N', profiles: true };

    if (/Firefox\//.test(ua)) {
      info = { name: 'Firefox', priv: 'cửa sổ riêng tư', key: 'Shift + P', profiles: false };
    } else if (/Edg\//.test(ua)) {
      info = { name: 'Edge', priv: 'cửa sổ InPrivate', key: 'Shift + N', profiles: true };
    } else if (/OPR\//.test(ua)) {
      info = { name: 'Opera', priv: 'cửa sổ riêng tư', key: 'Shift + N', profiles: true };
    } else if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) {
      info = { name: 'Safari', priv: 'cửa sổ riêng tư', key: 'Shift + N', profiles: false };
    }
    info.shortcut = (isMac ? '⌘' : 'Ctrl') + ' + ' + info.key;
    return info;
  }

  /**
   * The three ways to end up signed in as a different account.
   *
   * Each is one line in the list and at most three steps in the dialog. People
   * hit this screen blocked and impatient; a wall of text gets skipped, and a
   * skipped instruction is the same as no instruction.
   */
  function accountOptions() {
    var b = browserInfo();
    return [
      {
        id: 'private',
        title: 'Dùng ' + b.priv,
        tag: 'Nhanh nhất',
        desc: 'Không ảnh hưởng tài khoản đang dùng',
        steps: [
          'Mở ' + b.priv + ': <code class="kbd">' + esc(b.shortcut) + '</code>',
          'Dán đường dẫn ứng dụng',
          'Đăng nhập tài khoản cần dùng'
        ]
      },
      {
        id: 'profile',
        title: b.profiles ? 'Dùng profile khác' : 'Dùng trình duyệt khác',
        desc: b.profiles ? 'Hợp khi dùng cả hai tài khoản mỗi ngày'
                         : 'Đăng nhập tài khoản kia ở trình duyệt khác',
        steps: b.profiles
          ? ['Bấm ảnh đại diện góc trên bên phải ' + esc(b.name),
             'Chọn hoặc thêm profile của tài khoản kia',
             'Dán đường dẫn ứng dụng vào cửa sổ đó']
          : ['Mở một trình duyệt khác',
             'Đăng nhập tài khoản cần dùng',
             'Dán đường dẫn ứng dụng vào đó']
      },
      {
        id: 'logout',
        title: 'Đăng xuất rồi đăng nhập lại',
        desc: 'Đăng xuất mọi dịch vụ Google trên trình duyệt này',
        warn: 'Cách này thoát cả Gmail, Drive… trên trình duyệt này.',
        steps: [
          'Sao chép đường dẫn ứng dụng',
          'Bấm <strong>Đăng xuất Google</strong>',
          'Đăng nhập tài khoản cần dùng rồi dán đường dẫn'
        ],
        logout: true
      }
    ];
  }

  function optionListHtml() {
    return accountOptions().map(function (o) {
      return '<button type="button" class="opt-row" data-opt="' + o.id + '">' +
               '<span class="opt-row-body">' +
                 '<span class="opt-row-title">' + esc(o.title) +
                   (o.tag ? '<span class="opt-tag">' + esc(o.tag) + '</span>' : '') +
                 '</span>' +
                 '<span class="opt-row-desc">' + esc(o.desc) + '</span>' +
               '</span>' +
               '<span class="opt-row-chev">›</span>' +
             '</button>';
    }).join('');
  }

  function optionDetailHtml(o) {
    return (o.warn ? '<p class="opt-warn">' + esc(o.warn) + '</p>' : '') +
      '<ol class="opt-steps">' +
        o.steps.map(function (t) { return '<li>' + t + '</li>'; }).join('') +
      '</ol>' +
      '<div class="opt-actions">' +
        '<button type="button" class="btn-mini" data-action="copy">Sao chép đường dẫn</button>' +
        (o.logout ? '<a class="btn-mini" href="' + esc(logoutUrl) +
                    '" target="_top">Đăng xuất Google</a>' : '') +
      '</div>';
  }

  /**
   * How the admin rotates the key. Three steps, because that is all it is —
   * rotation happens in the Apps Script editor so no secret ever passes through
   * a browser.
   */
  function openRotateGuide() {
    el('modal-title').textContent = 'Đổi khoá bảo mật';
    el('modal-body').innerHTML =
      '<ol class="opt-steps">' +
        '<li>Tạo khoá mới: <code class="kbd">openssl rand -base64 32</code></li>' +
        '<li>Dán vào <strong>SHARED_SECRET</strong> ở cả hai project (API và WEB)</li>' +
        '<li>Mở project API → chạy hàm <code class="kbd">rotateSecret</code></li>' +
      '</ol>' +
      '<p class="opt-warn">Cần khoá toàn bộ ngay? Mở sheet <strong>Security</strong>, ' +
      'đặt <code>status</code> = <code>revoked</code>.</p>';
    el('modal-back').classList.add('hidden');
    showModal();
  }

  /**
   * Security banner. Amber while the key is nearing expiry, red once it has
   * lapsed. Shown to admins only: an employee can do nothing about it, and the
   * expiry date is not their business.
   */
  function renderSecurityBanner(sec) {
    var banner = el('sec-banner');
    if (!sec || !sec.isAdmin || sec.state === 'active') {
      banner.classList.add('hidden');
      return;
    }
    var text;
    if (sec.state === 'expiring') {
      text = 'Khoá bảo mật hết hạn sau ' + sec.daysLeft + ' ngày (' +
             (sec.expiresAt || '') + '). Nên đổi khoá sớm.';
      banner.classList.remove('danger');
    } else {
      text = sec.adminMessage || 'Khoá bảo mật cần được đổi.';
      banner.classList.add('danger');
    }
    el('sec-banner-text').textContent = text;
    banner.classList.remove('hidden');
  }

  /* ---------------- modal ---------------- */

  function showModal() { el('switch-modal').classList.remove('hidden'); }
  function closeModal() { el('switch-modal').classList.add('hidden'); }

  /* ---------------- confirm popup (TT.confirm) ---------------- */

  /**
   * Milestone 3 — one reusable "are you sure" popup for every risky action
   * in the app, replacing the inline confirm-box pattern used ad hoc in
   * ViewsOrders.html (delete order, approve order, discard-and-reload).
   * Style follows the "S2" mockup the user picked: a small record-summary
   * card (id / status pill / customer / meta / total, in the same visual
   * language as an order-list card) so the user is confirming against the
   * SPECIFIC record on screen, not just answering a generic yes/no — useful
   * when the list is filtered/scrolled and it's not obvious at a glance
   * which row is "this one". `summary` is optional: a lightweight caller
   * (e.g. quick status change) can skip it and get a plain text confirm.
   *
   * Still not window.confirm — same reason as the old inline pattern: a
   * native dialog blocks the whole Apps Script iframe. This is a
   * hand-built overlay, `position: fixed` (see .modal in Styles.html), so
   * it works regardless of where the page is scrolled.
   *
   * @param {Object} opts
   *   title: string, required — e.g. "Duyệt đơn hàng?"
   *   message: string, required — the "what happens / can't undo" line
   *   summary: optional {id, statusLabel, statusClass, customer, meta, money}
   *     — when given, renders the mini order-card block; statusClass should
   *     be the same class statusPillClass() returns, so colors match the
   *     list exactly. Every field is optional within summary too (a caller
   *     without money-visible fields just omits `money`).
   *   okLabel / cancelLabel: strings, default "Xác nhận" / "Không"
   *   danger: boolean — true colors the OK button/icon with --c-danger
   *     instead of --c-ok (delete vs. approve/reject/reload)
   *   noteField: optional {label, placeholder} — Milestone 3 / 3.8, added for
   *     "Từ chối" (reject with an optional note). When given, renders a
   *     <textarea> above the actions and the promise resolves to
   *     {ok, note} instead of a plain boolean. Every existing caller that
   *     omits noteField still gets a plain boolean back (note is simply
   *     absent), so nothing already using T.confirm() needed to change.
   * @return {Promise<boolean>|Promise<{ok:boolean, note:string}>} resolves
   *   true/false, or {ok, note} when noteField was given (note is '' on
   *   cancel too, never meaningful then — always check ok first)
   */
  function confirm_(opts) {
    return new Promise(function (resolve) {
      var danger = !!(opts && opts.danger);
      var okLabel = (opts && opts.okLabel) || 'Xác nhận';
      var cancelLabel = (opts && opts.cancelLabel) || 'Không';
      var iconPath = danger
        ? '<path d="M12 9v4"></path><path d="M12 17h.01"></path>' +
          '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>'
        : '<path d="M9 11l3 3L22 4"></path>' +
          '<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>';

      var noteField = opts && opts.noteField;

      el('confirm-modal-body').innerHTML = '' +
        '<div class="confirm-band' + (danger ? ' confirm-band--danger' : '') + '">' +
          '<span class="confirm-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + iconPath + '</svg>' +
          '</span>' +
          '<h2 id="confirm-modal-title">' + esc(opts.title) + '</h2>' +
        '</div>' +
        (opts.summary ? confirmSummaryHtml(opts.summary) : '') +
        '<p class="confirm-message">' + esc(opts.message) + '</p>' +
        (noteField
          ? '<label class="field confirm-note-field"><span class="field-label">' +
            esc(noteField.label || '') + '</span>' +
            '<textarea id="confirm-modal-note" rows="2" placeholder="' +
            esc(noteField.placeholder || '') + '"></textarea></label>'
          : '') +
        '<div class="confirm-actions">' +
          '<button type="button" class="btn" data-confirm-choice="cancel">' + esc(cancelLabel) + '</button>' +
          '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-ok') +
            '" data-confirm-choice="ok">' + esc(okLabel) + '</button>' +
        '</div>';

      var modal = el('confirm-modal');

      function finish(result) {
        modal.classList.add('hidden');
        modal.removeEventListener('click', onClick);
        document.removeEventListener('keydown', onKeydown);
        if (noteField) {
          var noteInput = el('confirm-modal-note');
          resolve({ ok: result, note: (result && noteInput) ? noteInput.value : '' });
        } else {
          resolve(result);
        }
      }
      function onClick(e) {
        var choice = e.target.closest && e.target.closest('[data-confirm-choice]');
        if (choice) { finish(choice.getAttribute('data-confirm-choice') === 'ok'); return; }
        if (e.target === modal) finish(false); // click on the dimmed backdrop = cancel
      }
      function onKeydown(e) {
        if (e.key === 'Escape') finish(false);
      }

      modal.addEventListener('click', onClick);
      document.addEventListener('keydown', onKeydown);
      modal.classList.remove('hidden');
    });
  }

  /** Mini order-card block inside the confirm popup — same visual language
   *  (id / status pill / customer / meta / total) as a real order-list
   *  card, per the "S2" option: the user recognizes the record they're
   *  about to act on instead of reading a generic sentence. */
  function confirmSummaryHtml(s) {
    return '' +
      '<div class="confirm-summary">' +
        '<div class="confirm-summary-top">' +
          (s.id ? '<span class="confirm-summary-id">' + esc(s.id) + '</span>' : '') +
          (s.statusLabel
            ? '<span class="' + esc(s.statusClass || 'status-pill') + '">' + esc(s.statusLabel) + '</span>'
            : '') +
        '</div>' +
        (s.customer ? '<div class="confirm-summary-customer">' + esc(s.customer) + '</div>' : '') +
        (s.meta ? '<div class="confirm-summary-meta">' + esc(s.meta) + '</div>' : '') +
        (s.money ? '<div class="confirm-summary-money">' + esc(s.money) + '</div>' : '') +
      '</div>';
  }

  /** List view — used by the "Đổi tài khoản" control in the top bar. */
  function openOptionList() {
    el('modal-title').textContent = 'Đổi tài khoản';
    el('modal-body').innerHTML = '<p class="hint hint-lead">' + esc(leadText()) + '</p>' +
                                 '<div class="opt-list">' + optionListHtml() + '</div>';
    el('modal-back').classList.add('hidden');
    showModal();
  }

  /** Detail view. `fromList` decides whether a back arrow makes sense. */
  function openOptionDetail(id, fromList) {
    var o = accountOptions().filter(function (x) { return x.id === id; })[0];
    if (!o) return;
    el('modal-title').textContent = o.title;
    el('modal-body').innerHTML = optionDetailHtml(o);
    el('modal-back').classList.toggle('hidden', !fromList);
    showModal();
  }

  function leadText() {
    return 'Ứng dụng dùng tài khoản Google chính của trình duyệt này. Chọn cách đổi:';
  }

  function renderAccountOptions() {
    var lead = el('options-lead');
    if (lead) lead.textContent = leadText();
    var list = el('account-options');
    if (list) list.innerHTML = optionListHtml();
  }

  // One delegated listener serves the inline list and both modal views.
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;

    var row = e.target.closest('[data-opt]');
    if (row) {
      openOptionDetail(row.getAttribute('data-opt'), !el('denied').contains(row));
      return;
    }
    if (e.target.closest('[data-action="copy"]')) {
      e.preventDefault();
      copyText(appUrl);
      return;
    }
    if (e.target.closest('[data-action="rotate-guide"]')) {
      e.preventDefault();
      openRotateGuide();
    }
  });

  el('switch-top').addEventListener('click', openOptionList);
  el('sec-banner-btn').addEventListener('click', openRotateGuide);
  el('modal-back').addEventListener('click', openOptionList);
  el('modal-close').addEventListener('click', closeModal);
  el('switch-modal').addEventListener('click', function (e) {
    if (e.target === el('switch-modal')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  el('retry').addEventListener('click', function () {
    el('denied').classList.add('hidden');
    el('boot').classList.remove('hidden');
    start();
  });

  start();
})();
</script>
