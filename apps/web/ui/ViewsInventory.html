<script>
/**
 * ViewsInventory.html — product/stock CRUD (Milestone 5 / 5.1).
 *
 * Same two-screens-one-module shape as ViewsOrders.html: a paginated list of
 * cards, and a form used for both create and edit. Everything decided here is
 * cosmetic; THIENTAN-API (Products.gs) revalidates every field and owns the
 * low-stock computation — this file only ever displays the `isLowStock` flag
 * the server already computed, never recomputes the threshold itself.
 *
 * Unlike Orders, there is exactly one permission for this whole screen
 * (manage_inventory — see docs/PERMISSIONS.md) and no visible_fields concept
 * for Products (per docs/PERMISSIONS.md's note that visible_fields does not
 * apply here). App.html's nav already gates the "Kho hàng" tab on
 * manage_inventory, so by the time render() runs the current user can always
 * fully use every part of this screen — there is no read-only variant to
 * account for, unlike ViewsOrders.html's permRo.
 */
(function () {
  'use strict';

  /**
   * The TT bridge is assigned in render(), NOT here — see ViewsOrders.html's
   * identical note: ui/Index.html includes view modules before ui/App.html,
   * so window.TT does not exist yet while this IIFE runs.
   */
  var T = null;
  var root = null;

  var state = {
    products: [], productsMeta: null, productsLoadedAt: 0, refreshing: false,
    productsPage: 0, productsHasMore: false, loadingMore: false,
    // Server-side filters (mirrors Orders.gs/ViewsOrders.html's pattern per
    // Phong's choice, "Mirror the order list's pattern"). '' / false = no
    // filter. lowStockTotal is NOT one of these — it's a standing summary
    // Products.gs computes independent of q/lowStockOnly (see its own doc
    // comment), so it lives on its own below.
    filters: { q: '', includeInactive: false, lowStockOnly: false },
    // Live text of the search box, separate from filters.q (the last value
    // actually searched for) — same reasoning as ViewsOrders.html's
    // searchDraft: a repaint mid-typing must never wipe what's not yet
    // submitted.
    searchDraft: '',
    // Count of active, low-stock products across the WHOLE catalog (ignores
    // q/lowStockOnly, still respects includeInactive) — see
    // actionListProducts_'s doc comment. Refreshed from every list response.
    lowStockTotal: 0,
    product: null, editing: false, bound: false,
    // One product-detail mutation in flight at a time: null | 'saving' |
    // 'deleting'. Mirrors ViewsOrders.html's busyAction/isBusy() exactly.
    busyAction: null
  };

  function isBusy() { return !!state.busyAction; }

  /** Mirrors LIST_PAGE_SIZE_DEFAULT in the API's Config.gs. */
  var PAGE_SIZE = 20;

  /** Same idea as ViewsOrders.html's LIST_CACHE_TTL_MS: how long a
   *  successful list fetch stays "fresh" before a background revalidation
   *  is worth doing on return to this tab. */
  var LIST_CACHE_TTL_MS = 60000;

  /** The in-flight page-1 apiListProducts promise, shared so a background
   *  revalidation and a manual "Làm mới" never fire overlapping requests. */
  var loadingPromise = null;
  var loadMorePromise = null;

  /** Only-latest-wins sequence, bumped on every (re-)entry to this tab —
   *  same mechanism as ViewsOrders.html's viewSeq. */
  var viewSeq = 0;
  var myGeneration = 0;

  /**
   * staleView_(seq) is the one place "is this callback still allowed to
   * touch the DOM" is decided — fails when EITHER the local sequence moved
   * OR Kho hàng is no longer the active tab (T.isCurrentView via App.html's
   * viewGeneration). See ViewsOrders.html's own staleView_ doc comment for
   * the bug this cross-tab guard fixes (a stale response from a tab the
   * user already left painting over whatever is now on screen).
   */
  function staleView_(seq) {
    return seq !== viewSeq || !T.isCurrentView('inventory', myGeneration);
  }

  /* ---------------- config / value helpers ---------------- */

  function config() { return T.config() || {}; }
  function uomList() { return config().uomList || []; }

  function has(record, field) {
    return record && Object.prototype.hasOwnProperty.call(record, field);
  }

  /** Money arrives from the server as a number and from an input as
   *  "1.200.000" — same digit-stripping as ViewsOrders.html's groupDigits/
   *  moneyValue (money_() server-side strips non-digits the same way). */
  function digits(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[^\d]/g, '');
  }

  function groupDigits(value) {
    var d = digits(value);
    return d ? parseInt(d, 10).toLocaleString('vi-VN') : '';
  }

  /**
   * stockQty/minStock are NOT grouped like money: productQuantity_
   * server-side parses with parseFloat (comma as decimal separator), so a
   * "1.200" grouped with dots-as-thousands would silently parse as 1.2.
   * Kept as a plain decimal-friendly display, same treatment as
   * ViewsOrders.html's line qty field.
   */
  function formatQty(value) {
    var n = Number(value);
    if (!isFinite(n)) n = 0;
    return n.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
  }

  /* ---------------- render entry point ---------------- */

  function render(container) {
    T = window.TT;
    root = container;
    myGeneration = T.viewGeneration();
    viewSeq++;
    if (!state.bound) {
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('blur', onBlur, true);
      root.addEventListener('keydown', onKeydown);
      root.addEventListener('change', onChange);
      state.bound = true;
    }
    showList();
  }

  /** True when we have list data and it is still within LIST_CACHE_TTL_MS. */
  function cacheIsFresh() {
    return !!(state.products.length && state.productsLoadedAt &&
      (Date.now() - state.productsLoadedAt) < LIST_CACHE_TTL_MS);
  }

  /** Same P2/P3/L1/L2 shape as ViewsOrders.html's showList(). */
  function showList() {
    var seq = ++viewSeq;
    state.product = null;

    if (state.products.length) {
      paintList();
      if (!cacheIsFresh()) silentRefresh(seq);
      return;
    }

    root.innerHTML = skeletonHtml();
    (loadingPromise || fetchProducts())
      .then(function () {
        if (staleView_(seq)) return;
        paintList();
      })
      .catch(function (err) {
        if (staleView_(seq)) return;
        root.innerHTML = '<section class="card"><p class="empty err-text">' +
          T.esc(err.message) + '</p></section>';
      });
  }

  /** The one place apiListProducts is called for PAGE 1. */
  function listPayload(page) {
    var payload = { page: page, pageSize: PAGE_SIZE };
    if (state.filters.q) payload.q = state.filters.q;
    if (state.filters.includeInactive) payload.includeInactive = true;
    if (state.filters.lowStockOnly) payload.lowStockOnly = true;
    return payload;
  }

  function hasActiveFilters() {
    var f = state.filters;
    return !!(f.q || f.includeInactive || f.lowStockOnly);
  }

  /** Same enable/disable rule as ViewsOrders.html's canSubmitSearch(). */
  function canSubmitSearch() {
    var draft = (state.searchDraft || '').trim();
    return !!draft && draft !== (state.filters.q || '');
  }

  var SEARCH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>';

  function fetchProducts() {
    if (loadingPromise) return loadingPromise;
    var filtersAtRequest = JSON.stringify(state.filters);
    loadingPromise = T.call('apiListProducts', listPayload(1)).then(
      function (data) {
        loadingPromise = null;
        if (filtersAtRequest !== JSON.stringify(state.filters)) return data; // superseded
        state.products = (data && data.products) || [];
        state.productsMeta = { total: (data && data.total) || 0, shown: state.products.length };
        state.productsPage = 1;
        state.productsHasMore = !!(data && data.hasMore);
        state.productsLoadedAt = Date.now();
        state.lowStockTotal = (data && data.lowStockTotal) || 0;
        return data;
      },
      function (err) { loadingPromise = null; throw err; }
    );
    return loadingPromise;
  }

  /** Same "deliberate navigation, always fetch fresh" reasoning as
   *  ViewsOrders.html's applyFilters(). */
  function applyFilters(next) {
    var merged = Object.assign({}, state.filters, next || {});
    var changed = ['q', 'includeInactive', 'lowStockOnly'].some(function (k) {
      return merged[k] !== state.filters[k];
    });
    if (!changed) return;
    state.filters = merged;
    state.products = [];
    state.productsMeta = null;
    state.productsLoadedAt = 0;
    state.productsPage = 0;
    state.productsHasMore = false;
    state.loadingMore = false;
    loadMorePromise = null;
    showList();
  }

  function clearFilters() {
    state.searchDraft = '';
    applyFilters({ q: '', includeInactive: false, lowStockOnly: false });
  }

  /** "Xem thêm": fetch the next page and append it — same shape as
   *  ViewsOrders.html's loadMore(). */
  function loadMore() {
    if (loadMorePromise || loadingPromise || !state.productsHasMore) return;
    var seq = viewSeq;
    state.loadingMore = true;
    paintList();

    var nextPage = state.productsPage + 1;
    loadMorePromise = T.call('apiListProducts', listPayload(nextPage))
      .then(function (data) {
        if (staleView_(seq)) { state.loadingMore = false; loadMorePromise = null; return; }
        var seen = {};
        state.products.forEach(function (p) { seen[p.productId] = true; });
        ((data && data.products) || []).forEach(function (p) {
          if (!seen[p.productId]) state.products.push(p);
        });
        state.productsMeta = { total: (data && data.total) || 0, shown: state.products.length };
        state.productsPage = nextPage;
        state.productsHasMore = !!(data && data.hasMore);
        state.lowStockTotal = (data && data.lowStockTotal) || 0;
        state.loadingMore = false;
        loadMorePromise = null;
        paintList();
      })
      .catch(function (err) {
        state.loadingMore = false;
        loadMorePromise = null;
        if (staleView_(seq)) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /** Background revalidation on return to an already-loaded list — never
   *  blanks the screen, silent on failure. Same shape as
   *  ViewsOrders.html's silentRefresh(). */
  function silentRefresh(seq) {
    if (state.refreshing || state.loadingMore || state.productsPage > 1) return;
    if (seq == null) seq = viewSeq;
    state.refreshing = true;
    fetchProducts()
      .then(function () {
        state.refreshing = false;
        if (staleView_(seq)) return;
        if (state.product) return; // user opened a detail while we were refreshing
        paintList();
      })
      .catch(function () { state.refreshing = false; });
  }

  /** The visible "Làm mới" button — a deliberate click, so failure IS
   *  reported (unlike silentRefresh). Resets to page 1. */
  function manualRefresh() {
    if (state.refreshing || state.loadingMore) return;
    var seq = viewSeq;
    state.refreshing = true;
    paintList();
    fetchProducts()
      .then(function () {
        state.refreshing = false;
        if (staleView_(seq)) return;
        paintList();
      })
      .catch(function (err) {
        state.refreshing = false;
        if (staleView_(seq)) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /* ---------------- list rendering ---------------- */

  function paintList() {
    root.innerHTML = listHtml();
  }

  function updatedLabel() {
    if (!state.productsLoadedAt) return '';
    var d = new Date(state.productsLoadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'cập nhật lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function listHtml() {
    var head = '' +
      '<div class="view-head">' +
        '<h2>Kho hàng</h2>' +
        '<div class="view-head-actions">' +
          '<button type="button" class="btn btn-primary" data-act="new">+ Thêm sản phẩm</button>' +
        '</div>' +
      '</div>' +
      (state.lowStockTotal > 0
        ? '<p class="lowstock-summary">' +
            '<span class="pc-lowstock">Sắp hết hàng</span> ' +
            state.lowStockTotal + ' sản phẩm đang ở mức tồn kho thấp.' +
          '</p>'
        : '') +
      filterBarHtml();

    if (!state.products.length) {
      var emptyText = hasActiveFilters()
        ? 'Không có sản phẩm nào khớp với bộ lọc đã chọn.'
        : 'Chưa có sản phẩm nào. Bấm “Thêm sản phẩm” để bắt đầu.';
      return head + '<section class="card"><p class="empty">' + emptyText + '</p></section>';
    }

    var meta = state.productsMeta || { shown: state.products.length, total: state.products.length };
    var count = '' +
      '<p class="list-count">' +
        'Hiển thị ' + meta.shown + ' / ' + meta.total + ' sản phẩm' +
        (updatedLabel() ? ' · ' + updatedLabel() : '') + ' · ' +
        '<button type="button" class="link-btn" data-act="refresh-list"' +
          (state.refreshing ? ' disabled' : '') + '>' +
          (state.refreshing ? 'Đang làm mới…' : 'Làm mới') +
        '</button>' +
      '</p>';

    var loadMoreBtn = state.productsHasMore
      ? '<button type="button" class="btn btn-block" data-act="load-more"' +
          (state.loadingMore ? ' disabled' : '') + '>' +
          (state.loadingMore ? 'Đang tải thêm…' : 'Xem thêm') +
        '</button>'
      : '';

    return head + count + '<div class="product-list">' +
      state.products.map(productCardHtml).join('') + '</div>' + loadMoreBtn;
  }

  /**
   * Compact filter bar: search box (submitted explicitly, same as
   * ViewsOrders.html's list-filter-q) plus two checkboxes that apply
   * immediately on change — Products only has three filters total, so the
   * collapsible "Bộ lọc" panel ViewsOrders.html needs for six-plus filters
   * would be overhead here rather than clarity.
   */
  function filterBarHtml() {
    var active = hasActiveFilters();
    return '' +
      '<div class="list-filter">' +
        '<div class="list-filter-row">' +
          '<input type="search" id="f-filter-q" class="list-filter-q" placeholder="Tìm mã, tên sản phẩm…" ' +
            'value="' + T.esc(state.searchDraft || '') + '">' +
          '<button type="button" class="btn-icon" data-act="submit-search" aria-label="Tìm kiếm"' +
            (canSubmitSearch() ? '' : ' disabled') + '>' + SEARCH_ICON_SVG + '</button>' +
        '</div>' +
        '<div class="filter-checks">' +
          '<label class="filter-check">' +
            '<input type="checkbox" id="f-filter-includeInactive"' +
              (state.filters.includeInactive ? ' checked' : '') + '>' +
            'Hiện cả sản phẩm ngừng kinh doanh' +
          '</label>' +
          '<label class="filter-check">' +
            '<input type="checkbox" id="f-filter-lowStockOnly"' +
              (state.filters.lowStockOnly ? ' checked' : '') + '>' +
            'Chỉ hiện sản phẩm sắp hết hàng' +
          '</label>' +
          (active ? '<button type="button" class="link-btn" data-act="clear-filter">Xóa lọc</button>' : '') +
        '</div>' +
      '</div>';
  }

  function skeletonHtml() {
    var card = '' +
      '<div class="product-card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</div>';
    return '' +
      '<div class="view-head"><h2>Kho hàng</h2></div>' +
      '<div class="product-list">' + card + card + card + '</div>';
  }

  function detailSkeletonHtml() {
    return '' +
      '<div class="view-head"><h2>Đang mở sản phẩm...</h2></div>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</section>';
  }

  /** Write-through cache update after create/edit, same reasoning as
   *  ViewsOrders.html's upsertCachedOrder — next "← Danh sách" is instant
   *  AND already correct. */
  function upsertCachedProduct(product) {
    if (!state.productsLoadedAt) return;
    var i = -1;
    for (var j = 0; j < state.products.length; j++) {
      if (state.products[j].productId === product.productId) { i = j; break; }
    }
    if (i >= 0) state.products[i] = product;
    else state.products.unshift(product);

    if (state.productsMeta) {
      if (i < 0) state.productsMeta.total += 1;
      state.productsMeta.shown = state.products.length;
    }
    state.productsLoadedAt = Date.now();
  }

  function removeCachedProduct(productId) {
    var before = state.products.length;
    state.products = state.products.filter(function (p) { return p.productId !== productId; });
    if (state.productsMeta && state.products.length !== before) {
      state.productsMeta.total = Math.max(0, state.productsMeta.total - 1);
      state.productsMeta.shown = state.products.length;
    }
    if (state.productsLoadedAt) state.productsLoadedAt = Date.now();
  }

  function productCardHtml(p) {
    var badges = '' +
      (p.isLowStock ? '<span class="pc-lowstock">Sắp hết hàng</span>' : '') +
      (!p.active ? '<span class="status-pill status-pill--cancelled">Ngừng kinh doanh</span>' : '');

    var stockLine = 'Tồn: ' + formatQty(p.stockQty) + (p.uom ? ' ' + T.esc(p.uom) : '') +
      (p.minStock > 0 ? ' · Ngưỡng: ' + formatQty(p.minStock) : '');

    var priceLine = p.lastPrice
      ? '<span class="pc-price">' + T.formatVnd(p.lastPrice) + (p.uom ? '/' + T.esc(p.uom) : '') + '</span>'
      : '';

    return '' +
      '<button type="button" class="product-card" data-open="' + T.esc(p.productId) + '">' +
        '<div class="pc-top">' +
          '<span class="pc-code">' + T.esc(p.code) + '</span>' +
          badges +
        '</div>' +
        '<div class="pc-name">' + T.esc(p.name) + '</div>' +
        '<div class="pc-meta">' +
          '<span>' + stockLine + '</span>' +
          priceLine +
        '</div>' +
      '</button>';
  }

  /* ---------------- form ---------------- */

  function field(label, control) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
           control + '</label>';
  }

  function blankProduct() {
    return {
      productId: '', code: '', name: '', uom: uomList()[0] || '',
      stockQty: '', minStock: '', lastPrice: '', active: true, note: ''
    };
  }

  function openForm(productId) {
    var seq = ++viewSeq;

    if (!productId) {
      state.product = blankProduct();
      state.editing = true;
      paintForm();
      return;
    }

    // No detail cache here (unlike ViewsOrders.html's orderCache): the
    // product list itself already carries every field the form needs
    // (buildProductResponse_ returns the exact same shape for a list row
    // and a single get), so reopening from the list is a plain object copy,
    // never a network round trip.
    var cached = state.products.filter(function (p) { return p.productId === productId; })[0];
    if (cached) {
      state.product = shallowCopy(cached);
      state.editing = true;
      paintForm();
      return;
    }

    root.innerHTML = detailSkeletonHtml();
    T.call('apiGetProduct', productId)
      .then(function (data) {
        if (staleView_(seq)) return;
        state.product = data;
        state.editing = true;
        paintForm();
      })
      .catch(function (err) {
        if (staleView_(seq)) return;
        T.toast(err.message, true);
        showList();
      });
  }

  function shallowCopy(obj) {
    var out = {};
    if (obj) Object.keys(obj).forEach(function (k) { out[k] = obj[k]; });
    return out;
  }

  function paintForm() {
    var p = state.product;
    var isNew = !p.productId;
    var busy = isBusy();

    root.innerHTML = '' +
      '<div class="view-head">' +
        '<h2>' + (isNew ? 'Thêm sản phẩm' : 'Mã ' + T.esc(p.code)) + '</h2>' +
        '<button type="button" class="link-btn" data-act="back"' +
          (busy ? ' disabled' : '') + '>← Danh sách</button>' +
      '</div>' +
      formCardHtml(p, busy) +
      actionsHtml(isNew, busy) +
      uomDatalistHtml();
  }

  function formCardHtml(p, busy) {
    var d = busy ? ' disabled' : '';
    return '' +
      '<section class="card">' +
        '<h3>Thông tin sản phẩm</h3>' +
        '<div class="form-grid">' +
          field('Mã sản phẩm *',
            '<input id="f-code" value="' + T.esc(p.code) + '"' + d + '>') +
          field('Tên sản phẩm *',
            '<input id="f-name" value="' + T.esc(p.name) + '"' + d + '>') +
          field('Đơn vị tính',
            '<input id="f-uom" list="uom-options" autocomplete="off" value="' +
            T.esc(p.uom) + '"' + d + '>') +
          field('Tồn kho',
            '<input id="f-stockQty" inputmode="decimal" value="' + T.esc(p.stockQty) + '"' + d + '>') +
          field('Ngưỡng tồn kho tối thiểu',
            '<input id="f-minStock" inputmode="decimal" value="' + T.esc(p.minStock) + '"' + d + '>') +
          field('Giá gần nhất (VNĐ)',
            '<input id="f-lastPrice" class="money" inputmode="numeric" value="' +
            T.esc(groupDigits(p.lastPrice)) + '"' + d + '>') +
          '<label class="field field-check">' +
            '<input type="checkbox" id="f-active"' + (p.active ? ' checked' : '') + d + '> Còn kinh doanh' +
          '</label>' +
          '<label class="field field-wide">' +
            '<span class="field-label">Ghi chú</span>' +
            '<textarea id="f-note" rows="2"' + d + '>' + T.esc(p.note) + '</textarea>' +
          '</label>' +
        '</div>' +
      '</section>';
  }

  function actionsHtml(isNew, busy) {
    var savingNow = state.busyAction === 'saving';
    var save = '<button type="button" class="btn btn-primary" data-act="save"' +
      (busy ? ' disabled' : '') + '>' +
      (savingNow ? 'Đang lưu...' : (isNew ? 'Lưu sản phẩm' : 'Lưu thay đổi')) + '</button>';

    var deletingNow = state.busyAction === 'deleting';
    var del = !isNew
      ? '<button type="button" class="btn btn-danger" data-act="ask-delete"' +
          (busy ? ' disabled' : '') + '>' +
          (deletingNow ? 'Đang xoá...' : 'Xoá sản phẩm') + '</button>'
      : '';

    return '<div class="form-actions">' + save +
      '<button type="button" class="btn" data-act="back"' +
      (busy ? ' disabled' : '') + '>Huỷ</button>' +
      del + '</div>';
  }

  function uomDatalistHtml() {
    return '<datalist id="uom-options">' +
      uomList().map(function (u) { return '<option value="' + T.esc(u) + '"></option>'; }).join('') +
      '</datalist>';
  }

  /** Read the DOM back into state, so a repaint never loses what was typed —
   *  same collect()-at-save-time shape as ViewsOrders.html. */
  function collect() {
    if (!state.product) return;
    var p = state.product;
    var get = function (sel) { var n = root.querySelector(sel); return n ? n.value : ''; };

    p.code = get('#f-code');
    p.name = get('#f-name');
    p.uom = get('#f-uom');
    p.stockQty = get('#f-stockQty');
    p.minStock = get('#f-minStock');
    p.lastPrice = get('#f-lastPrice');
    p.note = get('#f-note');
    var activeEl = root.querySelector('#f-active');
    p.active = activeEl ? !!activeEl.checked : true;
  }

  /* ---------------- save / delete ---------------- */

  function save() {
    if (isBusy()) return;
    collect();
    doSave();
  }

  function doSave() {
    var isNew = !state.product.productId;
    var payload = { product: {
      code: state.product.code, name: state.product.name, uom: state.product.uom,
      stockQty: state.product.stockQty, minStock: state.product.minStock,
      lastPrice: state.product.lastPrice, active: state.product.active,
      note: state.product.note
    } };
    if (!isNew) payload.productId = state.product.productId;
    var seq = viewSeq;

    state.busyAction = 'saving';
    paintForm(); // locks every field + button until this resolves
    T.call(isNew ? 'apiCreateProduct' : 'apiUpdateProduct', payload)
      .then(function (data) {
        upsertCachedProduct(data);
        state.busyAction = null;
        if (staleView_(seq)) return;
        state.product = data;
        T.toast(isNew ? 'Đã tạo sản phẩm ' + data.code + '.' : 'Đã lưu thay đổi.');
        paintForm();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (staleView_(seq)) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  function doDelete() {
    if (isBusy()) return;
    var seq = viewSeq;
    var deletedId = state.product.productId;
    state.busyAction = 'deleting';
    paintForm();
    T.call('apiDeleteProduct', deletedId)
      .then(function () {
        removeCachedProduct(deletedId);
        state.busyAction = null;
        if (staleView_(seq)) return;
        T.toast('Đã xoá sản phẩm.');
        showList();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (staleView_(seq)) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  /** Migrated to the T.confirm() popup, same as ViewsOrders.html's
   *  confirmDelete — no window.confirm (blocks the whole iframe). */
  function confirmDelete() {
    T.confirm({
      title: 'Xoá sản phẩm?',
      message: 'Xoá vĩnh viễn sản phẩm này khỏi danh mục. Không thể hoàn tác.',
      summary: productSummaryFor(state.product),
      okLabel: 'Xoá sản phẩm', cancelLabel: 'Không', danger: true
    }).then(function (ok) { if (ok) doDelete(); });
  }

  /** Same "mini record-card" summary block as ViewsOrders.html's
   *  orderSummaryFor — shown inside T.confirm()'s popup. */
  function productSummaryFor(p) {
    if (!p) return null;
    return {
      id: p.code,
      statusLabel: p.active ? 'Còn kinh doanh' : 'Ngừng kinh doanh',
      statusClass: p.active ? 'status-pill status-pill--paid' : 'status-pill status-pill--cancelled',
      customer: p.name,
      meta: p.uom ? 'Tồn: ' + formatQty(p.stockQty) + ' ' + p.uom : 'Tồn: ' + formatQty(p.stockQty),
      money: p.lastPrice ? T.formatVnd(p.lastPrice) : ''
    };
  }

  /* =====================================================================
     Behaviour — one delegated listener per event, bound once in render()
     ===================================================================== */

  function onClick(e) {
    var target = e.target.closest ? e.target.closest('[data-act], [data-open]') : null;
    if (!target) return;
    if (isBusy()) return;

    var open = target.getAttribute('data-open');
    if (open) { openForm(open); return; }

    switch (target.getAttribute('data-act')) {
      case 'new':
        openForm(null);
        break;
      case 'back':
        showList();
        break;
      case 'save':
        save();
        break;
      case 'ask-delete':
        confirmDelete();
        break;
      case 'refresh-list':
        manualRefresh();
        break;
      case 'load-more':
        loadMore();
        break;
      case 'submit-search':
        if (canSubmitSearch()) submitSearch();
        break;
      case 'clear-filter':
        clearFilters();
        break;
    }
  }

  function onInput(e) {
    // Same reasoning as ViewsOrders.html's onInput: keep the live search
    // text so any unrelated repaint doesn't wipe it; only submitSearch()
    // (Enter or the 🔍 button) actually searches. The button's enabled
    // state is toggled directly on the element, not via a full paintList()
    // (which would tear down the input and throw away focus mid-typing).
    if (e.target && e.target.id === 'f-filter-q') {
      state.searchDraft = e.target.value;
      var searchBtn = root.querySelector('[data-act="submit-search"]');
      if (searchBtn) searchBtn.disabled = !canSubmitSearch();
    }
  }

  /** Reformat money on the way out of the price field, so 1200000 reads as
   *  1.200.000 — same onBlur trick as ViewsOrders.html. */
  function onBlur(e) {
    if (e.target.classList && e.target.classList.contains('money')) {
      e.target.value = groupDigits(e.target.value);
    }
  }

  /** Enter in the search box applies it, same as ViewsOrders.html's
   *  onKeydown. */
  function onKeydown(e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'f-filter-q') {
      e.preventDefault();
      if (canSubmitSearch()) submitSearch();
    }
  }

  function submitSearch() {
    var input = root.querySelector('#f-filter-q');
    var q = (input ? input.value : state.searchDraft || '').trim();
    state.searchDraft = q;
    applyFilters({ q: q });
  }

  /** The two filter checkboxes apply immediately — unlike Orders' dropdown
   *  panel (which needs an explicit "Áp dụng" since it batches many
   *  fields), a single checkbox flip reads clearly as "apply this now". */
  function onChange(e) {
    if (e.target && e.target.id === 'f-filter-includeInactive') {
      applyFilters({ includeInactive: e.target.checked });
    } else if (e.target && e.target.id === 'f-filter-lowStockOnly') {
      applyFilters({ lowStockOnly: e.target.checked });
    }
  }

  window.TTInventory = { render: render };
})();
</script>
