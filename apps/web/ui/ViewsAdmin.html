<script>
/**
 * ViewsAdmin.html — user management (Milestone 5 / 5.2).
 *
 * Same two-screens-one-module shape as ViewsOrders.html/ViewsInventory.html:
 * a card list, and a form shared by create/edit. Two things make this
 * screen simpler than either of those:
 *
 *   - No server-side pagination. Admin.gs's actionListUsers_ always returns
 *     every user (Auth.gs's own comment: "a few hundred milliseconds, for
 *     5-6 people") — Phong's "mirror the order list's pattern" choice was
 *     specific to the Inventory task (5.1), not asked for here, and a flat
 *     list is simpler to build and to read at this scale. Search/"show
 *     deactivated too" are therefore plain CLIENT-SIDE filters over the
 *     already-loaded list, never a new network call.
 *   - No delete. Users are never hard-deleted (DATA_MODEL.md §1) — the
 *     active checkbox in the edit form IS deactivation, saved through the
 *     normal Save button, not a separate destructive action needing its
 *     own T.confirm() the way Products'/Orders' delete does.
 *
 * Permissions are assigned via one of Admin.gs's PERMISSION_PRESETS,
 * wholesale (role + every checkbox at once) — a per-checkbox matrix editor
 * is Milestone 5 / 5.3, not built yet. See Admin.gs's file doc comment for
 * the two self-protection/last-admin rules this form surfaces via the
 * `isSelf`/`isLastAdmin` flags every user record carries (computed
 * server-side, same "never let the client re-derive a security decision"
 * reasoning as Products.gs's `isLowStock`).
 */
(function () {
  'use strict';

  var T = null;
  var root = null;
  var wrapper = null;  // Fresh container per render — replaces the old state.bound approach
  var keyGenDebounceTimers = {};  // Track debounce timers for each label field

  var state = {
    // Milestone 5 / 5.4 — tab switcher for users vs. config
    activeTab: 'users',

    // ---- Users tab ----
    users: [], usersLoadedAt: 0, refreshing: false,
    // Presets fetched once, lazily (mirrors ViewsOrders.html's
    // ensureCreatorsLoaded/state.creators pattern) — null = not fetched
    // yet, [] would be a genuinely empty (but valid) answer.
    presets: null, presetsLoading: false,
    // Milestone 5b / Phase 4 — visible_fields column groups, same lazy-
    // singleton shape as presets above (fetched once, null = not fetched yet).
    fieldGroups: null, fieldGroupsLoading: false,
    // Client-side-only filters — see file doc comment. includeInactive
    // defaults to false: a deactivated account is out of the way by
    // default, same "hide inactive by default" spirit as Products.gs's list.
    filters: { q: '', includeInactive: false },
    searchDraft: '',
    user: null, editing: false,
    // One user-detail mutation in flight at a time — mirrors
    // ViewsOrders.html's busyAction/isBusy() exactly.
    busyAction: null,

    // ---- Config tab (Milestone 5 / 5.4) ----
    config: [], configLoadedAt: 0, configRefreshing: false,
    configEdits: {} // Tracks unsaved changes per key
  };

  function isBusy() { return !!state.busyAction; }

  /** Same L1-style TTL as ViewsInventory.html/ViewsOrders.html, even though
   *  this list rarely changes — consistency with the rest of the app is
   *  worth more than the tiny savings of skipping it here. */
  var LIST_CACHE_TTL_MS = 60000;

  // Grouped permission matrix structure (group label + key/label pairs) now
  // lives in ui/PermissionLabels.html as window.PERMISSION_GROUPS, shared
  // with App.html's homepage "Quyền hạn" card (Milestone 5b). Every other
  // reference to the bare PERMISSION_GROUPS identifier in this file
  // (collect(), permissionDisclosureHtml(), etc.) is unchanged.
  var PERMISSION_GROUPS = window.PERMISSION_GROUPS;

  /**
   * Config display labels (Vietnamese). Server allowlist in AdminConfig.gs:38 is
   * the source of truth; these are display-only with raw-key fallback.
   */
  var CONFIG_LABELS = {
    statusList: 'Danh sách trạng thái',
    uomList: 'Đơn vị tính',
    customerList: 'Danh sách khách hàng',
    vatRates: 'Thuế suất VAT',
    currency: 'Đơn vị tiền tệ'
  };

  /**
   * Config editor type dispatch. Maps config key to editor template ('statusList',
   * 'strings', 'numbers', 'scalar'). Falls back to item.type for unknown keys.
   */
  var CONFIG_EDITORS = {
    statusList: 'statusList',
    uomList: 'strings',
    customerList: 'strings',
    vatRates: 'numbers',
    currency: 'scalar'
  };

  /**
   * Flatten PERMISSION_GROUPS into a single array of permission keys.
   * Memoised — called from collect() every save, so compute once.
   */
  var _permissionKeysCache = null;
  function permissionKeys_() {
    if (_permissionKeysCache) return _permissionKeysCache;
    var keys = [];
    PERMISSION_GROUPS.forEach(function (group) {
      group.keys.forEach(function (pair) {
        keys.push(pair[0]);
      });
    });
    _permissionKeysCache = keys;
    return keys;
  }

  /**
   * Return the effective permissions object for rendering checkboxes:
   * permissionsToSave (in-flight edit) if set, otherwise the resolved base
   * (see basePermissions_), or empty if both absent. Prevents painted
   * checkboxes from reverting when doSave() repaints mid-flight.
   */
  function effectivePermissions_(u, basePerms) {
    return u.permissionsToSave || basePerms || u.permissions || {};
  }

  /**
   * Mirrors Admin.gs:327-333 (permissionsEqualPreset_) — keep the two in
   * sync when Admin.gs changes. Compares the 14 booleans with `!!` coercion
   * and visible_fields as a SET (order-independent), exactly like the
   * server does when it re-derives presetKey after every save
   * (matchPresetKey_, Admin.gs:319-325). Any divergence here would make the
   * "customised" label flip right after a save that the server considered
   * an exact preset match.
   */
  function permissionsEqual_(a, b) {
    for (var i = 0; i < permissionKeys_().length; i++) {
      var k = permissionKeys_()[i];
      if (!!a[k] !== !!b[k]) return false;
    }
    return arraysEqualAsSets_(a.visible_fields || ['*'], b.visible_fields || ['*']);
  }

  function arraysEqualAsSets_(a, b) {
    var av = a || [], bv = b || [];
    if (av.length !== bv.length) return false;
    return av.every(function (x) { return bv.indexOf(x) >= 0; });
  }

  /**
   * Look up a preset's full permissions object by key, or null when the key
   * is empty/unknown/presets haven't loaded. Thin wrapper kept separate from
   * basePermissions_ so the resolution-order policy lives in one place.
   */
  function presetPermissions_(key) {
    if (!key) return null;
    var list = state.presets || [];
    var found = list.filter(function (p) { return p.key === key; })[0];
    return (found && found.permissions) || null;
  }

  /**
   * Resolves the "base" permissions to seed the matrix from and diff
   * against, in priority order (see phase-04 plan, Requirements):
   *   1. state.user.basePresetKey — chosen THIS session via #f-preset
   *   2. u.presetKey — server-derived exact match (edit, unmodified)
   *   3. u.permissions — edit, presetKey === null (unknown/hand-edited base)
   *   4. null — create with no base picked yet; no disclosure is rendered
   */
  function basePermissions_(u) {
    return presetPermissions_(u.basePresetKey) ||
      presetPermissions_(u.presetKey) ||
      u.permissions ||
      null;
  }

  /** True when the collected/in-flight permissions differ from the
   *  resolved base — drives the "+ tuỳ chỉnh" label and the preset-switch
   *  confirm. `base` is falsy (no base yet) → never customised. */
  function isCustomised_(u, collected) {
    var base = basePermissions_(u);
    return !!(base && !permissionsEqual_(collected, base));
  }

  var loadingPromise = null;
  var viewSeq = 0;
  var myGeneration = 0;

  /** Same cross-tab race guard as every other view module — see
   *  ViewsOrders.html's staleView_ doc comment for the bug this fixes. */
  function staleView_(seq) {
    return seq !== viewSeq || !T.isCurrentView('users', myGeneration);
  }

  /* ---------------- render entry point ---------------- */

  function render(container) {
    T = window.TT;
    root = container;
    myGeneration = T.viewGeneration();
    viewSeq++;
    // Issue 1 fix: each render() creates a fresh wrapper div and attaches
    // listeners to it, replacing the old state.bound approach.
    // In test environments where document doesn't exist, fall back to root.
    root.innerHTML = '';
    if (typeof document !== 'undefined') {
      wrapper = document.createElement('div');
      wrapper.addEventListener('click', onClick);
      wrapper.addEventListener('input', onInput);
      wrapper.addEventListener('keydown', onKeydown);
      wrapper.addEventListener('change', onChange);
      root.appendChild(wrapper);
    } else {
      wrapper = root;
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('keydown', onKeydown);
      root.addEventListener('change', onChange);
    }
    ensurePresetsLoaded();
    ensureFieldGroupsLoaded();
    // Milestone 5 / 5.4 — default to users tab; later tab navigation will switch
    if (state.activeTab === 'config') {
      showConfigTab();
    } else {
      showList();
    }
  }

  /**
   * Presets rarely change (they're a code constant, not sheet data) and are
   * needed by both the list (for a "which profile" badge — actually
   * server-supplied per row, so presets are only needed by the FORM'S
   * dropdown) — fetched once per session, same lazy-singleton shape as
   * ViewsOrders.html's ensureCreatorsLoaded.
   */
  function ensurePresetsLoaded() {
    if (state.presets !== null || state.presetsLoading) return;
    state.presetsLoading = true;
    var gen = T.viewGeneration();
    T.call('apiListPermissionPresets', {}).then(function (data) {
      state.presets = (data && data.presets) || [];
      state.presetsLoading = false;
      if (state.user && T.isCurrentView('users', gen)) paintForm();
    }).catch(function (err) {
      state.presets = [];
      state.presetsLoading = false;
      T.toast('Không tải được danh sách nhóm quyền: ' + err.message, true);
      if (state.user && T.isCurrentView('users', gen)) paintForm();
    });
  }

  /**
   * Milestone 5b / Phase 4 — visible_fields column groups, fetched once per
   * session. Mirrors ensurePresetsLoaded()'s exact shape: same null-means-
   * not-fetched-yet guard, same failure fallback to [] (never leaves the
   * request stuck retrying forever, same as presets' own failure path).
   */
  function ensureFieldGroupsLoaded() {
    if (state.fieldGroups !== null || state.fieldGroupsLoading) return;
    state.fieldGroupsLoading = true;
    var gen = T.viewGeneration();
    T.call('apiListVisibleFieldGroups', {}).then(function (data) {
      state.fieldGroups = (data && data.groups) || [];
      state.fieldGroupsLoading = false;
      if (state.user && T.isCurrentView('users', gen)) paintForm();
    }).catch(function (err) {
      state.fieldGroups = [];
      state.fieldGroupsLoading = false;
      T.toast('Không tải được danh sách cột dữ liệu: ' + err.message, true);
      if (state.user && T.isCurrentView('users', gen)) paintForm();
    });
  }

  function cacheIsFresh() {
    return !!(state.users.length && state.usersLoadedAt &&
      (Date.now() - state.usersLoadedAt) < LIST_CACHE_TTL_MS);
  }

  function showList() {
    var seq = ++viewSeq;
    state.user = null;

    if (state.users.length) {
      paintList();
      if (!cacheIsFresh()) silentRefresh(seq);
      return;
    }

    wrapper.innerHTML = skeletonHtml();
    (loadingPromise || fetchUsers())
      .then(function () {
        if (staleView_(seq)) return;
        paintList();
      })
      .catch(function (err) {
        if (staleView_(seq)) return;
        wrapper.innerHTML = '<section class="card"><p class="empty err-text">' +
          T.esc(err.message) + '</p></section>';
      });
  }

  function fetchUsers() {
    if (loadingPromise) return loadingPromise;
    loadingPromise = T.call('apiListUsers', {}).then(
      function (data) {
        loadingPromise = null;
        state.users = (data && data.users) || [];
        state.usersLoadedAt = Date.now();
        return data;
      },
      function (err) { loadingPromise = null; throw err; }
    );
    return loadingPromise;
  }

  function silentRefresh(seq) {
    if (state.refreshing) return;
    if (seq == null) seq = viewSeq;
    state.refreshing = true;
    fetchUsers()
      .then(function () {
        state.refreshing = false;
        if (staleView_(seq)) return;
        if (state.user) return; // user opened a detail while we were refreshing
        paintList();
      })
      .catch(function () { state.refreshing = false; });
  }

  function manualRefresh() {
    if (state.refreshing) return;
    var seq = viewSeq;
    state.refreshing = true;
    paintList();
    fetchUsers()
      .then(function () {
        state.refreshing = false;
        if (staleView_(seq)) return;
        paintList();
      })
      .catch(function (err) {
        state.refreshing = false;
        if (staleView_(seq)) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /* ---------------- client-side filtering ---------------- */

  function hasActiveFilters() {
    var f = state.filters;
    return !!(f.q || f.includeInactive);
  }

  function canSubmitSearch() {
    var draft = (state.searchDraft || '').trim();
    return !!draft && draft !== (state.filters.q || '');
  }

  function submitSearch() {
    var input = root.querySelector('#f-filter-q');
    var q = (input ? input.value : state.searchDraft || '').trim();
    state.searchDraft = q;
    state.filters.q = q;
    paintList();
  }

  function clearFilters() {
    state.searchDraft = '';
    state.filters = { q: '', includeInactive: false };
    paintList();
  }

  /** Every visible row, after the client-side search/includeInactive
   *  filters — see file doc comment for why these never touch the
   *  network. */
  function visibleUsers() {
    var q = (state.filters.q || '').trim().toLowerCase();
    return state.users.filter(function (u) {
      if (!state.filters.includeInactive && !u.active) return false;
      if (!q) return true;
      return (String(u.displayName || '').toLowerCase().indexOf(q) >= 0) ||
             (String(u.email || '').toLowerCase().indexOf(q) >= 0);
    });
  }

  var SEARCH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>';

  /* ---------------- list rendering ---------------- */

  function paintList() {
    wrapper.innerHTML = listHtml();
  }

  function updatedLabel() {
    if (!state.usersLoadedAt) return '';
    var d = new Date(state.usersLoadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'cập nhật lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function listHtml() {
    var head = '' +
      '<div class="view-head">' +
        '<h2>Người dùng</h2>' +
        '<div class="view-head-actions">' +
          '<button type="button" class="btn btn-secondary" data-act="switch-to-config">Cài đặt hệ thống</button>' +
          '<button type="button" class="btn btn-primary" data-act="new">+ Thêm người dùng</button>' +
        '</div>' +
      '</div>' +
      filterBarHtml();

    var rows = visibleUsers();

    if (!state.users.length) {
      return head + '<section class="card"><p class="empty">Chưa có người dùng nào.</p></section>';
    }
    if (!rows.length) {
      return head + '<section class="card"><p class="empty">' +
        'Không có người dùng nào khớp với bộ lọc đã chọn.</p></section>';
    }

    var count = '' +
      '<p class="list-count">' +
        'Hiển thị ' + rows.length + ' / ' + state.users.length + ' người dùng' +
        (updatedLabel() ? ' · ' + updatedLabel() : '') + ' · ' +
        '<button type="button" class="link-btn" data-act="refresh-list"' +
          (state.refreshing ? ' disabled' : '') + '>' +
          (state.refreshing ? 'Đang làm mới…' : 'Làm mới') +
        '</button>' +
      '</p>';

    return head + count + '<div class="user-list">' +
      rows.map(userCardHtml).join('') + '</div>';
  }

  function filterBarHtml() {
    var active = hasActiveFilters();
    return '' +
      '<div class="list-filter">' +
        '<div class="list-filter-row">' +
          '<input type="search" id="f-filter-q" class="list-filter-q" placeholder="Tìm tên, email…" ' +
            'value="' + T.esc(state.searchDraft || '') + '">' +
          '<button type="button" class="btn-icon" data-act="submit-search" aria-label="Tìm kiếm"' +
            (canSubmitSearch() ? '' : ' disabled') + '>' + SEARCH_ICON_SVG + '</button>' +
        '</div>' +
        '<div class="filter-checks">' +
          '<label class="filter-check">' +
            '<input type="checkbox" id="f-filter-includeInactive"' +
              (state.filters.includeInactive ? ' checked' : '') + '>' +
            'Hiện cả tài khoản đã khoá' +
          '</label>' +
          (active ? '<button type="button" class="link-btn" data-act="clear-filter">Xóa lọc</button>' : '') +
        '</div>' +
      '</div>';
  }

  function skeletonHtml() {
    var card = '' +
      '<div class="user-card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</div>';
    return '' +
      '<div class="view-head"><h2>Người dùng</h2></div>' +
      '<div class="user-list">' + card + card + card + '</div>';
  }

  function detailSkeletonHtml() {
    return '' +
      '<div class="view-head"><h2>Đang mở người dùng...</h2></div>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</section>';
  }

  function upsertCachedUser(u) {
    var i = -1;
    for (var j = 0; j < state.users.length; j++) {
      if (state.users[j].email === u.email) { i = j; break; }
    }
    if (i >= 0) state.users[i] = u;
    else state.users.unshift(u);
    if (state.usersLoadedAt) state.usersLoadedAt = Date.now();
  }

  function presetLabel(key) {
    if (!key) return 'Tuỳ chỉnh';
    var list = state.presets || [];
    var found = list.filter(function (p) { return p.key === key; })[0];
    return found ? found.label : key;
  }

  function userCardHtml(u) {
    var badges = '' +
      (!u.active ? '<span class="status-pill status-pill--cancelled">Đã khoá</span>' : '') +
      (u.isSelf ? '<span class="user-self-badge">Bạn</span>' : '');

    return '' +
      '<button type="button" class="user-card" data-open="' + T.esc(u.email) + '">' +
        '<div class="pc-top">' +
          '<span class="pc-code">' + T.esc(u.displayName) + '</span>' +
          badges +
        '</div>' +
        '<div class="pc-meta">' +
          '<span>' + T.esc(u.email) + '</span>' +
          '<span class="pc-price">' + T.esc(presetLabel(u.presetKey)) + '</span>' +
        '</div>' +
      '</button>';
  }

  /* ---------------- form ---------------- */

  function field(label, control) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
           control + '</label>';
  }

  function headMetaHtml(u, isNew) {
    if (isNew) return '';
    var meta = '<span>' + T.esc(u.email) + '</span>';
    if (u.createdAt) {
      meta += '<span>· Tạo lúc ' + T.esc(T.formatDate(u.createdAt)) + '</span>';
    }
    return '<div class="user-head-meta">' + meta + '</div>';
  }

  function statusSelectHtml(u, locked) {
    var d = locked ? ' disabled' : '';
    return '<select id="f-active"' + d + '>' +
      '<option value="active"' + (u.active ? ' selected' : '') + '>Đang hoạt động</option>' +
      '<option value="inactive"' + (!u.active ? ' selected' : '') + '>Đã khoá</option>' +
      '</select>';
  }

  function blankUser() {
    // isNewUser: true is the ONLY source of truth for "is this a create form?" —
    // see the invariant note at save()'s isNew line. Never derive it from email
    // presence again; collect() and other handlers may run long before save().
    return { email: '', displayName: '', note: '', active: true, presetKey: '',
             isSelf: false, isLastAdmin: false, showPermissionMatrix: false,
             showFieldMatrix: false, isNewUser: true };
  }

  /**
   * Auto-expand rule (spec 2c): an existing user whose stored permissions
   * don't exactly match any preset (presetKey === null, server-computed by
   * matchPresetKey_) opens with the matrix already visible — there's no
   * preset label to hide behind, so showing "Tuỳ chỉnh" collapsed would just
   * make the admin click to find out what it actually grants. Called from
   * every openForm() path that sets state.user, never duplicated inline.
   */
  function autoExpandPermissionDisclosure_(u) {
    u.showPermissionMatrix = (u.presetKey === null && !!u.permissions);
  }

  function openForm(email) {
    var seq = ++viewSeq;

    if (!email) {
      state.user = blankUser();
      state.editing = true;
      paintForm();
      return;
    }

    // Same "the list already has everything the form needs" shortcut as
    // ViewsInventory.html's openForm — actionListUsers_/actionGetUser_
    // return the exact same shape (buildUserResponse_ in both cases), so
    // reopening from the loaded list is a plain object copy, never a
    // network round trip.
    var cached = state.users.filter(function (u) { return u.email === email; })[0];
    if (cached) {
      state.user = shallowCopy(cached);
      autoExpandPermissionDisclosure_(state.user);
      state.editing = true;
      paintForm();
      return;
    }

    wrapper.innerHTML = detailSkeletonHtml();
    T.call('apiGetUser', email)
      .then(function (data) {
        if (staleView_(seq)) return;
        state.user = data;
        autoExpandPermissionDisclosure_(state.user);
        state.editing = true;
        paintForm();
      })
      .catch(function (err) {
        if (staleView_(seq)) return;
        T.toast(err.message, true);
        showList();
      });
  }

  function shallowCopy(obj) {
    var out = {};
    if (obj) Object.keys(obj).forEach(function (k) { out[k] = obj[k]; });
    return out;
  }

  function paintForm() {
    var u = state.user;
    var isNew = !!u.isNewUser;
    var busy = isBusy();

    wrapper.innerHTML = '' +
      '<div class="view-head">' +
        '<h2>' + (isNew ? 'Thêm người dùng' : T.esc(u.displayName)) + '</h2>' +
        headMetaHtml(u, isNew) +
        '<button type="button" class="link-btn" data-act="back"' +
          (busy ? ' disabled' : '') + '>← Danh sách</button>' +
      '</div>' +
      guardNoteHtml(u) +
      formCardHtml(u, isNew, busy) +
      actionsHtml(busy);
  }

  /**
   * Advisory banner explaining WHY the preset dropdown and/or active
   * checkbox are locked below — "hiding a button is UX, not security"
   * (PERMISSIONS.md §4 point 5): the server re-checks both rules on every
   * save regardless of what this banner says, this is purely so a refusal
   * never comes as a surprise.
   */
  function guardNoteHtml(u) {
    if (u.isSelf && u.isLastAdmin) {
      return '<p class="ro-note">Đây là tài khoản của bạn, và cũng là quản trị viên đang ' +
        'hoạt động cuối cùng — không thể tự khoá tài khoản hoặc đổi nhóm quyền. ' +
        'Hãy nhờ một quản trị viên khác, hoặc thêm một quản trị viên nữa trước.</p>';
    }
    if (u.isSelf) {
      return '<p class="ro-note">Đây là tài khoản của bạn — bạn không thể tự đổi nhóm quyền ' +
        'của chính mình. Hãy nhờ một quản trị viên khác thực hiện.</p>';
    }
    if (u.isLastAdmin) {
      return '<p class="ro-note">Đây là quản trị viên đang hoạt động cuối cùng — không thể ' +
        'khoá tài khoản này hoặc đổi nhóm quyền (hệ thống luôn cần ít nhất một quản trị viên).</p>';
    }
    return '';
  }

  function formCardHtml(u, isNew, busy) {
    var d = busy ? ' disabled' : '';
    // Self and last-admin both lock the same two controls — see
    // guardNoteHtml's doc comment.
    var lockPermissions = busy || u.isSelf || u.isLastAdmin;
    var lockActive = busy || u.isLastAdmin; // self MAY still deactivate their
    // own (non-last-admin) account per PERMISSIONS.md §4.6 — only manage_users
    // removal is unconditionally self-blocked, not deactivation itself.

    return '' +
      '<section class="card">' +
        '<div class="form-linear">' +
          '<div class="form-section">' +
            '<span class="form-section-label">Thông tin người dùng</span>' +
            (isNew
              ? field('Email *', '<input id="f-email" type="email" value="' + T.esc(u.email) + '"' + d + '>')
              : field('Email', '<input value="' + T.esc(u.email) + '" disabled>')) +
            field('Tên hiển thị *',
              '<input id="f-displayName" value="' + T.esc(u.displayName) + '"' + d + '>') +
            field(isNew ? 'Nhóm quyền *' : 'Nhóm quyền',
              presetSelectHtml(u, isNew, lockPermissions)) +
            field('Trạng thái', statusSelectHtml(u, lockActive)) +
          '</div>' +
          permissionDisclosureHtml(u, lockPermissions) +
          window.TTAdminVisibleFields.visibleFieldsDisclosureHtml(
            u, basePermissions_(u), lockPermissions, state.fieldGroups) +
          '<div class="form-section">' +
            '<span class="form-section-label">Ghi chú</span>' +
            '<label class="field"><textarea id="f-note" rows="3"' + d + '>' +
              T.esc(u.note) + '</textarea></label>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  /**
   * The base-role picker. With base-extension (phase 04) the select is
   * NEVER disabled by "custom permissions mode" — it now doubles as the
   * base the matrix seeds from and diffs against, so it must stay usable
   * even once the admin has toggled a box away from that base. Only the
   * self/last-admin lock (`locked`) still disables it.
   *
   * `u.basePresetKey` — set only while this form session is open (never on
   * the cached row, see risk register) — is rendered as the selected
   * option so a re-paint after `#f-preset` changes reflects the chosen
   * base, not always the original server value.
   */
  function presetSelectHtml(u, isNew, locked) {
    if (state.presets === null) {
      return '<select disabled><option>Đang tải nhóm quyền…</option></select>';
    }
    var options = state.presets.map(function (p) {
      var selected = u.basePresetKey === p.key ? ' selected' : '';
      return '<option value="' + T.esc(p.key) + '"' + selected + '>' + T.esc(p.label) + '</option>';
    }).join('');

    if (isNew) {
      var placeholderSelected = u.basePresetKey ? '' : ' selected';
      return '<select id="f-preset"' + (locked ? ' disabled' : '') + '>' +
        '<option value="" disabled' + placeholderSelected + '>— Chọn nhóm quyền —</option>' + options +
        '</select>';
    }

    // Editing: default to "keep current permissions" — a plain save of
    // displayName/active/note must never silently re-apply (or worse,
    // change) permissions just because the dropdown had some option
    // selected. The current profile is shown as plain text alongside it,
    // since presetKey is null (informational "Tuỳ chỉnh") whenever the
    // sheet holds permissions that were hand-edited or don't otherwise
    // match any preset exactly.
    //
    // No explicit `selected` on THIS option: it is always the first in
    // document order, so the browser selects it by default whenever no
    // later option carries `selected` — i.e. whenever basePresetKey is
    // unset. Marking it explicitly too would conflict with the option
    // below the moment a base IS chosen (two `selected` options).
    return '' +
      '<select id="f-preset"' + (locked ? ' disabled' : '') + '>' +
        '<option value="">— Giữ nguyên (' + T.esc(presetLabel(u.presetKey)) + ') —</option>' +
        options +
      '</select>';
  }

  /**
   * Permission disclosure UI for M5.3b (Option B: button + badge). Renders
   * the 14 checkboxes unconditionally, grouped, and collapses/expands the
   * wrapping `#perm-body` with a CSS class only — the collapsed DOM stays
   * reachable via `querySelector`, so `collect()` keeps one source of truth
   * and there's no separate "which is authoritative, state or DOM" shadow
   * state (see phase-03-permission-disclosure-ui.md, key insight #2).
   *
   * Phase 04: seeds from `basePermissions_` (session base-picker >
   * server-derived presetKey > raw permissions, see its doc comment) and
   * computes the diff against that same base for the "+ tuỳ chỉnh" badge —
   * `isCustomised_` mirrors the server's `permissionsEqualPreset_` exactly
   * so the label never disagrees with what the save is about to do.
   */
  function permissionDisclosureHtml(u, locked) {
    // Only shown when not locked (self/last-admin) per PERMISSIONS.md §4
    if (locked) return '';
    var base = basePermissions_(u);
    // No base to seed from: create form with no preset chosen yet, or
    // presets failed to load (state.presets === []) and this is a brand-new
    // user with no server-assigned permissions either. Degrade to no
    // disclosure at all, same as the old `!u.permissions` guard did (R5).
    if (!base) return '';

    var expanded = !!u.showPermissionMatrix;
    var perms = effectivePermissions_(u, base);
    // The resolved base's label: the session's chosen base preset first,
    // then the server-derived exact match, then "Tuỳ chỉnh" (null) when
    // the base is only known via raw permissions (hand-edited/unmatched).
    var baseLabel = presetLabel(u.basePresetKey || u.presetKey || null);
    var customised = isCustomised_(u, perms);

    var groups = '<div class="perm-groups">';
    PERMISSION_GROUPS.forEach(function (group) {
      groups += '' +
        '<div class="perm-group">' +
          '<h4 class="perm-group-title">' + T.esc(group.label) + '</h4>' +
          '<div class="perm-group-items">';

      group.keys.forEach(function (pair) {
        var key = pair[0];
        var label = pair[1];
        var checked = !!perms[key];
        var checkboxId = 'f-perm-' + key;
        groups += '' +
          '<label class="field field-check">' +
            '<input type="checkbox" id="' + checkboxId + '"' + (checked ? ' checked' : '') + '> ' +
            T.esc(label) +
          '</label>';
      });

      groups += '' +
        '</div>' +
        '</div>';
    });
    groups += '</div>';

    return '' +
      '<div class="form-section">' +
        '<span class="form-section-label">Nhóm quyền chi tiết</span>' +
        '<button type="button" class="perm-disclosure" data-act="toggle-perms" ' +
          'aria-expanded="' + (expanded ? 'true' : 'false') + '" aria-controls="perm-body">' +
          '<div class="perm-disclosure-content">' +
            '<div class="perm-disclosure-label">' +
              '<strong>' + T.esc(baseLabel) + '</strong>' +
              '<span class="perm-disclosure-badge' + (customised ? '' : ' hidden') + '" id="perm-badge">' +
                (customised ? '+ tuỳ chỉnh' : '') +
              '</span>' +
            '</div>' +
          '</div>' +
          '<span class="perm-disclosure-toggle">▼</span>' +
        '</button>' +
        '<div id="perm-body" class="perm-body' + (expanded ? '' : ' perm-body--collapsed') + '">' +
          groups +
        '</div>' +
      '</div>';
  }

  function actionsHtml(busy) {
    var savingNow = state.busyAction === 'saving';
    var save = '<button type="button" class="btn btn-primary" data-act="save"' +
      (busy ? ' disabled' : '') + '>' +
      (savingNow ? 'Đang lưu...' : 'Lưu') + '</button>';

    return '<div class="form-actions">' + save +
      '<button type="button" class="btn" data-act="back"' +
      (busy ? ' disabled' : '') + '>Huỷ</button>' +
      '</div>';
  }

  /** Read the DOM back into state, so a repaint never loses what was typed —
   *  same collect()-at-save-time shape as ViewsInventory.html/
   *  ViewsOrders.html. */
  function collect() {
    if (!state.user) return;
    var u = state.user;
    var get = function (sel) { var n = root.querySelector(sel); return n ? n.value : ''; };

    // #f-email exists only on the create form (the edit form's email input has
    // no id — see formCardHtml). Re-read it every time, not just once: with
    // isNewUser now owning the "is this new?" question, the field stays editable
    // across every repaint, so a typo fixed after toggling the matrix or the
    // preset must still make it into the saved payload.
    var emailEl = root.querySelector('#f-email');
    if (emailEl) u.email = emailEl.value;
    u.displayName = get('#f-displayName');
    u.note = get('#f-note');
    u.presetKeyToSave = get('#f-preset'); // '' means "keep current" on edit
    var activeEl = root.querySelector('#f-active');
    // Missing node must NOT mean "deactivate": keep whatever the record already says
    // (new users default active:true via blankUser()).
    u.active = activeEl ? (activeEl.value !== 'inactive') : (u.active !== false);

    // showPermissionMatrix (open/collapsed) is owned by the `toggle-perms`
    // click handler alone (M5.3b) — collect() must never derive it from the
    // DOM. The old matrix-toggle checkbox is gone; reading a removed node
    // here would return null and silently reset showPermissionMatrix to
    // false, dropping any in-progress custom-permission edit (phase-03 risk R6).
    //
    // Permission block (phase 04): mirrors self/last-admin lock at
    // formCardHtml:643 exactly.
    var lockPermissions = isBusy() || u.isSelf || u.isLastAdmin;
    u.permissionsToSave = null;
    if (lockPermissions) return; // R2 — locked users: never read the matrix,
    // not even to confirm it's unchanged. There IS no matrix in the DOM for
    // them (permissionDisclosureHtml returns '' when locked), so querying it
    // would read null nodes and silently synthesise an all-false permission
    // set — exactly the "plain save strips the last admin" bug this guards.

    var base = basePermissions_(u);
    if (!base) return; // R5 — no base resolved, no matrix was rendered either
    // (create form with no preset chosen yet) — nothing to collect.

    var perms = {};
    permissionKeys_().forEach(function (key) {
      var el = root.querySelector('#f-perm-' + key);
      // Absent node (matrix collapsed in a real DOM, or the offline test
      // harness's stub) falls back to the BASE value, never to false — a
      // partially-stubbed DOM must never be able to invent a revocation.
      perms[key] = el ? !!el.checked : !!base[key];
    });
    // R3 — read visible_fields through the shared collectVisibleFields_()
    // helper (AdminVisibleFields.html), which reads the real field-editor
    // DOM (master toggle + per-field checkboxes) and falls back to the
    // resolved base — NEVER hardcodes ['*'] — when the section isn't
    // rendered. refreshCustomisedBadge_() below reads through the exact
    // same helper so the two can never drift.
    perms.visible_fields = window.TTAdminVisibleFields.collectVisibleFields_(root, base);

    // R1 — gate on an actual diff against the base. Ungated, every save
    // (even a plain displayName edit) would set permissionsToSave and force
    // role:'custom' server-side, which the header chip reads literally
    // (App.html: role === 'admin' ? 'Quản trị' : 'Nhân viên') — a full admin
    // saved this way would display as "Nhân viên".
    if (!permissionsEqual_(perms, base)) {
      u.permissionsToSave = perms;
    }
  }

  /* ---------------- save ---------------- */

  function save() {
    if (isBusy()) return;
    // isNew comes from state.user.isNewUser, set once by blankUser() and never
    // touched by collect() — NOT from email presence. `!state.user.email` used
    // to be the test (fixed 2026-09-07 by capturing it before collect() ran
    // inside save()), but that only guarded collect() calls made BY save()
    // itself. toggle-perms (:1407-ish) and onPresetChange_ (:1528-ish) both
    // call collect() long before save() runs — picking a preset or opening the
    // permission matrix on a brand-new user's form permanently set
    // state.user.email from #f-email, silently flipping the form to edit mode
    // and making Save call apiUpdateUser for an email that doesn't exist yet
    // (Admin.gs correctly rejected it with "Không tìm thấy người dùng"). The
    // isNewUser flag can't be corrupted this way since only blankUser() writes
    // it and only replacing state.user with a server response clears it.
    var isNew = !!state.user.isNewUser;
    collect();
    doSave(isNew);
  }

  function doSave(isNew) {
    var seq = viewSeq;
    var payload;
    var actionName;

    if (isNew) {
      actionName = 'apiCreateUser';
      payload = {
        user: { email: state.user.email, displayName: state.user.displayName, note: state.user.note },
        active: state.user.active
      };
      // Create: three-way intent resolved
      // 1. permissionsToSave (matrix mode) → use custom
      // 2. presetKeyToSave (preset mode) → use preset
      // 3. neither → error (for create, a preset is required)
      if (state.user.permissionsToSave) {
        payload.permissions = state.user.permissionsToSave;
      } else {
        payload.presetKey = state.user.presetKeyToSave;
      }
    } else {
      actionName = 'apiUpdateUser';
      payload = {
        email: state.user.email,
        user: { displayName: state.user.displayName, note: state.user.note },
        active: state.user.active
      };
      // Update: three-way intent preserved from collect()
      // 1. permissionsToSave (matrix mode) → use custom
      // 2. presetKeyToSave (preset mode, non-empty) → use preset
      // 3. presetKeyToSave === '' or omitted (keep mode) → omit both, leaving server to use current
      if (state.user.permissionsToSave) {
        payload.permissions = state.user.permissionsToSave;
      } else if (state.user.presetKeyToSave) {
        payload.presetKey = state.user.presetKeyToSave;
      }
      // If neither permissionsToSave nor presetKeyToSave, payload has neither:
      // Admin.gs's actionUpdateUser_ will leave role/permissions untouched.
    }

    state.busyAction = 'saving';
    paintForm();
    T.call(actionName, payload)
      .then(function (data) {
        upsertCachedUser(data);
        state.busyAction = null;
        if (staleView_(seq)) return;
        state.user = data;
        T.toast(actionName === 'apiCreateUser' ? 'Đã thêm người dùng ' + data.displayName + '.' : 'Đã lưu thay đổi.');
        paintForm();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (staleView_(seq)) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  /* =====================================================================
     Config tab (Milestone 5 / 5.4)
     ===================================================================== */

  function showConfigTab() {
    state.activeTab = 'config';
    var seq = ++viewSeq;

    if (state.config.length) {
      paintConfigTab();
      if (!configCacheIsFresh()) silentRefreshConfig(seq);
      return;
    }

    wrapper.innerHTML = configSkeletonHtml();
    fetchConfig()
      .then(function () {
        if (staleView_(seq)) return;
        paintConfigTab();
      })
      .catch(function (err) {
        if (staleView_(seq)) return;
        root.innerHTML = '<section class="card"><p class="empty err-text">' +
          T.esc(err.message) + '</p></section>';
      });
  }

  function configCacheIsFresh() {
    return !!(state.config.length && state.configLoadedAt &&
      (Date.now() - state.configLoadedAt) < LIST_CACHE_TTL_MS);
  }

  function fetchConfig() {
    return T.call('apiListConfig', {}).then(
      function (data) {
        state.config = (data && data.config) || [];
        state.configLoadedAt = Date.now();
        state.configEdits = {};
        return data;
      }
    );
  }

  function silentRefreshConfig(seq) {
    if (state.configRefreshing) return;
    state.configRefreshing = true;
    fetchConfig()
      .then(function () {
        state.configRefreshing = false;
        if (staleView_(seq)) return;
        paintConfigTab();
      })
      .catch(function () { state.configRefreshing = false; });
  }

  function paintConfigTab() {
    wrapper.innerHTML = configTabHtml();
  }

  function configTabHtml() {
    var isSaving = state.busyAction === 'saving-config';
    return '' +
      '<div class="view-head">' +
        '<h2>Cài đặt hệ thống</h2>' +
        '<button type="button" class="btn btn-secondary" data-act="back-to-users"' +
          (isSaving ? ' disabled' : '') + '>← Quay lại</button>' +
      '</div>' +
      '<div style="max-width: 700px; margin: 0 auto; padding: 0 16px;">' +
        state.config.map(function (item) { return configSectionHtml(item, isSaving); }).join('') +
      '</div>' +
      configSaveBarHtml();
  }

  function configSaveBarHtml() {
    var isSaving = state.busyAction === 'saving-config';
    var isClean = !Object.keys(state.configEdits).length;
    return '' +
      '<div class="form-actions">' +
        '<button type="button" class="btn btn-primary" data-act="save-config"' +
          (isClean || isSaving ? ' disabled' : '') +
          '>' + (isSaving ? 'Đang lưu...' : 'Lưu cài đặt') + '</button>' +
        '<button type="button" class="btn" data-act="back-to-users">Huỷ</button>' +
      '</div>';
  }

  function configSectionHtml(item, busy) {
    var key = item.key;
    var value = state.configEdits[key] !== undefined ? state.configEdits[key] : item.value;
    var label = CONFIG_LABELS[key] || key;
    var editorType = CONFIG_EDITORS[key] || (item.type === 'array' ? 'strings' : 'scalar');
    var itemCount = Array.isArray(value) ? value.length : 1;

    return '' +
      '<section class="card" style="margin-bottom: 16px; padding: 16px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--c-border);">' +
          '<h3 style="margin: 0; font-size: 14px; font-weight: 600; color: var(--c-text);">' + T.esc(label) + '</h3>' +
          '<span style="font-size: 12px; color: var(--c-muted); background: var(--c-bg); padding: 2px 8px; border-radius: 12px; white-space: nowrap;">' + itemCount + '</span>' +
        '</div>' +
        (item.description ? '<p class="config-desc">' + T.esc(item.description) + '</p>' : '') +
        configEditorHtml(key, value, editorType, busy) +
      '</section>';
  }

  function configEditorHtml(key, value, editorType, busy) {
    if (editorType === 'statusList') {
      return configStatusListEditorHtml(key, value || [], busy);
    } else if (editorType === 'strings') {
      return configArrayEditorHtml(key, value || [], false, busy);
    } else if (editorType === 'numbers') {
      return configArrayEditorHtml(key, value || [], true, busy);
    } else {
      return configScalarEditorHtml(key, value || '', busy);
    }
  }

  function configStatusListEditorHtml(key, items, busy) {
    var busyAttr = busy ? ' disabled' : '';
    var listHtml = items.length > 0
      ? '<div class="config-list">' +
          items.map(function (item, i) {
            var isNew = item && item.__new;
            var isDisabled = !isNew ? ' disabled' : busyAttr;
            var isReadOnly = isNew && !busy ? ' readonly' : '';
            var deleteBtn = isNew
              ? '<button type="button" class="btn-icon" data-act="delete-config-item" ' +
                  'data-key="' + T.esc(key) + '" data-index="' + i + '" aria-label="Xoá"' + busyAttr + ' ' +
                  'style="padding: 4px 8px; border: 1px solid #dc2626; border-radius: 4px; background: transparent; color: #dc2626; cursor: pointer; font-size: 12px; flex-shrink: 0;">&times;</button>'
              : '';
            return '<div class="config-row">' +
              '<div class="config-row-fields">' +
                '<input type="text" id="f-cfg-' + T.esc(key) + '-' + i + '-key" ' +
                  'class="config-status-key" data-key="' + T.esc(key) + '" data-index="' + i + '" ' +
                  'value="' + T.esc((item && item.key) || '') + '"' + isDisabled + isReadOnly + ' ' +
                  'placeholder="Mã" style="padding: 8px; border: 1px solid var(--c-border); border-radius: 4px; font-size: 13px;">' +
                '<input type="text" id="f-cfg-' + T.esc(key) + '-' + i + '-label" ' +
                  'class="config-status-label" data-key="' + T.esc(key) + '" data-index="' + i + '" ' +
                  'value="' + T.esc((item && item.label) || '') + '"' + busyAttr + ' ' +
                  'placeholder="Tên" style="padding: 8px; border: 1px solid var(--c-border); border-radius: 4px; font-size: 13px;">' +
              '</div>' + deleteBtn +
            '</div>';
          }).join('') +
        '</div>'
      : '<p class="config-empty">Chưa có mục nào.</p>';

    return '' + listHtml +
      '<button type="button" class="btn-mini" data-act="add-status" data-key="' +
        T.esc(key) + '"' + busyAttr + ' style="margin-top: 12px;">+ Thêm</button>';
  }

  function configArrayEditorHtml(key, items, isNumeric, busy) {
    var busyAttr = busy ? ' disabled' : '';
    var listHtml = items.length > 0
      ? '<div class="config-list">' +
          items.map(function (item, i) {
            var inputType = isNumeric ? 'number' : 'text';
            var inputAttrs = isNumeric ? ' step="0.01" min="0" max="1" inputmode="decimal"' : '';
            return '<div class="config-row">' +
              '<div class="config-row-fields config-row-fields--single">' +
                '<input type="' + inputType + '" ' +
                  'class="config-array-item" data-key="' + T.esc(key) + '" data-index="' + i + '" ' +
                  'value="' + T.esc(item || '') + '"' + inputAttrs + busyAttr + ' ' +
                  'style="padding: 8px; border: 1px solid var(--c-border); border-radius: 4px; font-size: 13px; width: 100%;">' +
              '</div>' +
              '<button type="button" class="btn-icon" data-act="delete-config-item" ' +
                'data-key="' + T.esc(key) + '" data-index="' + i + '" aria-label="Xoá"' + busyAttr + ' ' +
                'style="padding: 4px 8px; border: 1px solid #dc2626; border-radius: 4px; background: transparent; color: #dc2626; cursor: pointer; font-size: 12px; flex-shrink: 0;">&times;</button>' +
            '</div>';
          }).join('') +
        '</div>'
      : '<p class="config-empty">Chưa có mục nào.</p>';

    return '' + listHtml +
      '<button type="button" class="btn-mini" data-act="add-array-item" data-key="' +
        T.esc(key) + '"' + busyAttr + ' style="margin-top: 12px;">+ Thêm</button>';
  }

  function configScalarEditorHtml(key, value, busy) {
    var maxlen = key === 'currency' ? ' maxlength="10"' : '';
    var busyAttr = busy ? ' disabled' : '';
    return '<div class="field">' +
      '<label class="field-label" for="f-cfg-' + T.esc(key) + '">Giá trị</label>' +
      '<input type="text" id="f-cfg-' + T.esc(key) + '" ' +
        'class="field config-input" data-key="' + T.esc(key) + '" ' +
        'value="' + T.esc(value || '') + '"' + maxlen + busyAttr + '>' +
    '</div>';
  }

  function configSkeletonHtml() {
    return '' +
      '<div class="view-head"><h2>Cài đặt hệ thống</h2></div>' +
      '<section class="card" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line"></div>' +
      '</section>';
  }

  /* =====================================================================
     Config state helpers — manage deep copies and dirty tracking
     ===================================================================== */

  function generateStatusKeyFromLabel(label) {
    return label
      .toLowerCase()
      .trim()
      /* Replace Vietnamese characters with ASCII equivalents */
      .replace(/đ/g, 'd')
      .replace(/ă/g, 'a').replace(/â/g, 'a').replace(/ê/g, 'e').replace(/ô/g, 'o')
      .replace(/ơ/g, 'o').replace(/ư/g, 'u').replace(/ư/g, 'u').replace(/ơ/g, 'o')
      /* Remove remaining diacritics: ̀ ́ ̉ ̃ ̣ -> removed */
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/\s+/g, '_')
      .replace(/[^a-z0-9_]/g, '')
      .substring(0, 50);
  }

  function configItem_(key) {
    var item = state.config.find(function (c) { return c.key === key; });
    return item || null;
  }

  function configDeepCopy_(value) {
    if (Array.isArray(value) && value.length > 0 && typeof value[0] === 'object') {
      return value.map(function (item) {
        var copy = { key: item.key || '', label: item.label || '' };
        if (item.__new) copy.__new = true;  // Preserve __new flag for new rows
        return copy;
      });
    }
    return Array.isArray(value) ? value.slice() : value;
  }

  function configValue_(key) {
    if (state.configEdits[key] !== undefined) {
      return state.configEdits[key];
    }
    var item = configItem_(key);
    if (!item) return [];
    return configDeepCopy_(item.value || []);
  }

  function ensureUniqueStatusKeys(statusList, existingKeys) {
    /* Make keys unique by adding suffix (_2, _3, etc.) if duplicate found */
    var usedKeys = {};
    existingKeys.forEach(function (k) { usedKeys[k] = true; });

    return statusList.map(function (row) {
      if (!row.key || !usedKeys[row.key]) {
        /* Key is empty or unique — keep as is */
        usedKeys[row.key] = true;
        return row;
      }
      /* Duplicate key found — make unique by adding suffix */
      var originalKey = row.key;
      var suffix = 2;
      while (usedKeys[originalKey + '_' + suffix]) {
        suffix++;
      }
      var uniqueKey = originalKey + '_' + suffix;
      usedKeys[uniqueKey] = true;
      return { key: uniqueKey, label: row.label || '' };
    });
  }

  function markEdit_(key, value) {
    var item = configItem_(key);
    var pristineJson = item ? JSON.stringify(configDeepCopy_(item.value)) : '[]';
    var newJson = JSON.stringify(value);
    if (pristineJson === newJson) {
      delete state.configEdits[key];
    } else {
      state.configEdits[key] = value;
    }
    updateSaveButtonState();
  }

  function saveConfig() {
    var seq = viewSeq;
    var updates = Object.keys(state.configEdits);
    if (!updates.length) return;

    // Validate and collect all changes
    var changes = [];
    for (var i = 0; i < updates.length; i++) {
      var key = updates[i];
      var item = state.config.filter(function (c) { return c.key === key; })[0];
      if (!item) continue;

      var newValue = state.configEdits[key];
      /* Strip __new flag from statusList items before sending to server */
      if (key === 'statusList' && Array.isArray(newValue)) {
        /* Separate existing rows from new rows — only NEW rows get key deduplication */
        var existingRows = [];
        var newRows = [];
        newValue.forEach(function (row) {
          if (row.__new) {
            newRows.push({ key: row.key || '', label: row.label || '' });
          } else {
            existingRows.push({ key: row.key || '', label: row.label || '' });
          }
        });

        /* Deduplicate keys ONLY for new rows, existing row keys are immutable */
        var existingStatusKeys = item.value.map(function (s) { return s.key; });
        var dedupedNewRows = ensureUniqueStatusKeys(newRows, existingStatusKeys);

        /* Combine: existing rows (unchanged) + deduplicated new rows */
        newValue = existingRows.concat(dedupedNewRows);
      }
      changes.push({ key: key, value: newValue, type: item.type });
    }

    // Save each change
    state.busyAction = 'saving-config';
    paintConfigTab();

    var saveNext = function (idx) {
      if (idx >= changes.length) {
        state.busyAction = null;
        if (staleView_(seq)) return;
        paintConfigTab();
        T.toast('Lưu cài đặt thành công.');
        silentRefreshConfig(seq);
        return;
      }

      var change = changes[idx];
      T.call('apiUpdateConfig', { key: change.key, value: change.value })
        .then(function () { saveNext(idx + 1); })
        .catch(function (err) {
          state.busyAction = null;
          if (staleView_(seq)) return;
          paintConfigTab();
          T.toast(err.message, true);
        });
    };

    saveNext(0);
  }

  /* =====================================================================
     Behaviour — one delegated listener per event, bound once in render()
     ===================================================================== */

  function onClick(e) {
    var target = e.target.closest ? e.target.closest('[data-act], [data-open]') : null;
    if (!target) return;
    if (isBusy()) return;

    var open = target.getAttribute('data-open');
    if (open) { openForm(open); return; }

    var act = target.getAttribute('data-act');

    // Milestone 5 / 5.4 — config tab actions
    if (act === 'switch-to-config') {
      showConfigTab();
      return;
    }
    if (act === 'back-to-users') {
      state.activeTab = 'users';
      state.configEdits = {};
      showList();
      return;
    }
    if (act === 'save-config') {
      saveConfig();
      return;
    }
    if (act === 'add-status') {
      var key = target.getAttribute('data-key');
      var statusList = configValue_(key);
      statusList.push({ key: '', label: '', __new: true });
      markEdit_(key, statusList);
      paintConfigTab();
      return;
    }
    if (act === 'add-array-item') {
      var key = target.getAttribute('data-key');
      var arrValue = configValue_(key);
      arrValue.push('');
      markEdit_(key, arrValue);
      paintConfigTab();
      return;
    }
    if (act === 'delete-config-item') {
      var key = target.getAttribute('data-key');
      var idx = parseInt(target.getAttribute('data-index'), 10);
      var val = configValue_(key);

      /* Prevent deletion of saved statusList rows (only __new rows can be deleted) */
      if (key === 'statusList' && Array.isArray(val) && val[idx] && !val[idx].__new) {
        T.toast('Không thể xoá trạng thái đã lưu.', true);
        return;
      }

      if (Array.isArray(val)) {
        val = configDeepCopy_(val);
        val.splice(idx, 1);
        markEdit_(key, val);
        paintConfigTab();
      }
      return;
    }

    // Original users tab actions
    switch (act) {
      case 'new':
        openForm(null);
        break;
      case 'back':
        showList();
        break;
      case 'save':
        save();
        break;
      case 'refresh-list':
        manualRefresh();
        break;
      case 'submit-search':
        if (canSubmitSearch()) submitSearch();
        break;
      case 'clear-filter':
        clearFilters();
        break;
      case 'toggle-perms':
        // M5.3b — collect() BEFORE flipping state so anything already typed
        // (displayName, note, preset, status, checked permission boxes)
        // survives the paintForm() repaint below; same discipline the old
        // matrix-toggle onChange handler used.
        collect();
        state.user.showPermissionMatrix = !state.user.showPermissionMatrix;
        paintForm();
        break;
      case 'toggle-fields':
        // Phase 4 — same collect()-before-flip discipline as toggle-perms.
        collect();
        state.user.showFieldMatrix = !state.user.showFieldMatrix;
        paintForm();
        break;
    }
  }

  function onInput(e) {
    if (e.target && e.target.id === 'f-filter-q') {
      state.searchDraft = e.target.value;
      var searchBtn = root.querySelector('[data-act="submit-search"]');
      if (searchBtn) searchBtn.disabled = !canSubmitSearch();
    }

    // Phase 4 — live text filter over the visible_fields checkbox grid.
    // Targeted DOM write only (show/hide rows, force-open matching groups);
    // never repaints, so typing never loses focus mid-keystroke.
    if (e.target && e.target.id === 'f-field-filter') {
      window.TTAdminVisibleFields.applyFieldFilter_(root, e.target.value);
    }

    // Milestone 5 / 5.4 — track config input changes
    if (e.target && e.target.classList.contains('config-input')) {
      var key = e.target.getAttribute('data-key');
      markEdit_(key, e.target.value);
    }
    if (e.target && (e.target.classList.contains('config-status-key') ||
                     e.target.classList.contains('config-status-label'))) {
      var key = e.target.getAttribute('data-key');
      var idx = parseInt(e.target.getAttribute('data-index'), 10);
      var list = configValue_(key);
      list = configDeepCopy_(list);
      if (!list[idx]) list[idx] = {};
      if (e.target.classList.contains('config-status-key')) {
        list[idx].key = e.target.value;
      } else {
        list[idx].label = e.target.value;
        /* Debounced key generation ONLY for new rows (existing rows: label-only edit) */
        if (list[idx].__new === true) {
          var timerKey = key + '-' + idx;
          clearTimeout(keyGenDebounceTimers[timerKey]);
          keyGenDebounceTimers[timerKey] = setTimeout(function () {
            var updatedList = configValue_(key);
            updatedList = configDeepCopy_(updatedList);
            if (updatedList[idx] && updatedList[idx].__new === true) {
              updatedList[idx].key = generateStatusKeyFromLabel(updatedList[idx].label);
              /* Get existing keys (pristine values) + keys from OTHER new rows in this list */
              var configItem = configItem_(key);
              var existingKeys = configItem ? configItem.value.map(function (s) { return s.key; }) : [];
              /* Also include keys from other new rows (but not this one) */
              updatedList.forEach(function (row, i) {
                if (i !== idx && row.__new && row.key) {
                  existingKeys.push(row.key);
                }
              });
              var dedupedList = ensureUniqueStatusKeys([updatedList[idx]], existingKeys);
              updatedList[idx].key = dedupedList[0].key;
              var keyFieldId = 'f-cfg-' + T.esc(key) + '-' + idx + '-key';
              var keyField = document.getElementById(keyFieldId);
              if (keyField) keyField.value = updatedList[idx].key;
              markEdit_(key, updatedList);
            }
            delete keyGenDebounceTimers[timerKey];
          }, 300);  /* 300ms debounce */
        }
      }
      markEdit_(key, list);
    }
    if (e.target && e.target.classList.contains('config-array-item')) {
      var key = e.target.getAttribute('data-key');
      var idx = parseInt(e.target.getAttribute('data-index'), 10);
      var list = configValue_(key);
      list = configDeepCopy_(list);
      /* For vatRates, store as number; for mid-typing unparseable values, store raw string */
      if (key === 'vatRates') {
        var numVal = parseFloat(e.target.value);
        list[idx] = (isNaN(numVal) || e.target.value === '') ? e.target.value : numVal;
      } else {
        list[idx] = e.target.value;
      }
      markEdit_(key, list);
    }
  }

  function updateSaveButtonState() {
    var saveBtn = root.querySelector('[data-act="save-config"]');
    if (saveBtn) {
      saveBtn.disabled = !Object.keys(state.configEdits).length;
    }
  }

  function onKeydown(e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'f-filter-q') {
      e.preventDefault();
      if (canSubmitSearch()) submitSearch();
    }
  }

  function onChange(e) {
    if (e.target && e.target.id === 'f-filter-includeInactive') {
      state.filters.includeInactive = e.target.checked;
      paintList();
      return;
    }

    if (e.target && e.target.id === 'f-preset') {
      onPresetChange_(e.target);
      return;
    }

    if (e.target && e.target.id && e.target.id.indexOf('f-perm-') === 0) {
      refreshCustomisedBadge_();
      return;
    }

    // Phase 4 — field checkboxes (#f-field-<key>) and the master toggle
    // (#f-field-all, which also matches this prefix) both live-update the
    // SAME "+ tuỳ chỉnh" badge the permission checkboxes already drive
    // (visible_fields is part of the one compared/collected object) — see
    // permissionsEqual_'s visible_fields set-comparison. Beyond the badge,
    // the master toggle and individual checkboxes two-way sync via targeted
    // DOM writes (no full repaint, same discipline as
    // refreshCustomisedBadge_() itself): flipping the master cascades every
    // non-locked individual to match it; flipping an individual recomputes
    // whether they're all checked and writes that back onto the master. The
    // filter text input (#f-field-filter) matches this same id prefix but is
    // handled in onInput, not here, so it must be excluded explicitly.
    if (e.target && e.target.id && e.target.id.indexOf('f-field-') === 0 &&
        e.target.id !== 'f-field-filter') {
      if (e.target.id === 'f-field-all') {
        window.TTAdminVisibleFields.cascadeFieldMaster_(root, e.target.checked);
      } else {
        window.TTAdminVisibleFields.syncFieldMasterFromIndividuals_(root);
      }
      refreshCustomisedBadge_();
      return;
    }
  }

  /**
   * Reseeding the base picker (phase 04): collect() first, using the OLD
   * base, to find out whether the in-progress edit is currently customised
   * — that's the only thing that decides whether switching bases needs a
   * confirm. `T.confirm` is async (returns a Promise, same as every other
   * view's confirm dialog); the select's DOM value has ALREADY moved to the
   * newly-picked option by the time `change` fires, so a cancel must
   * explicitly restore it inside the `.then`, not just skip the reseed.
   */
  function onPresetChange_(selectEl) {
    var u = state.user;
    var newKey = selectEl.value;
    collect();
    if (!u.permissionsToSave) {
      applyBaseSwitch_(u, newKey);
      return;
    }
    T.confirm('Đổi nhóm quyền sẽ đặt lại các quyền đã tuỳ chỉnh. Tiếp tục?').then(function (confirmed) {
      if (!confirmed) {
        selectEl.value = u.basePresetKey || '';
        return;
      }
      applyBaseSwitch_(u, newKey);
    });
  }

  function applyBaseSwitch_(u, newKey) {
    u.basePresetKey = newKey;
    u.permissionsToSave = null;
    paintForm();
  }

  /**
   * Targeted label refresh for a single `#f-perm-*` checkbox flip — same
   * "write the DOM directly, skip paintForm()" discipline as
   * updateSaveButtonState(). A full repaint here would also blow away focus
   * on whichever checkbox the admin just clicked.
   */
  function refreshCustomisedBadge_() {
    var u = state.user;
    var base = basePermissions_(u);
    if (!base) return; // no base rendered means no matrix, no badge either
    var collected = {};
    permissionKeys_().forEach(function (key) {
      var el = root.querySelector('#f-perm-' + key);
      collected[key] = el ? !!el.checked : false;
    });
    // Same shared helper collect() uses (see its comment) — kept in sync so
    // the live badge and the actual save can never disagree.
    collected.visible_fields = window.TTAdminVisibleFields.collectVisibleFields_(root, base);

    var badgeEl = root.querySelector('#perm-badge');
    if (!badgeEl) return;
    if (isCustomised_(u, collected)) {
      badgeEl.textContent = '+ tuỳ chỉnh';
      badgeEl.classList.remove('hidden');
    } else {
      badgeEl.textContent = '';
      badgeEl.classList.add('hidden');
    }
  }

  window.TTAdmin = { render: render };
})();
</script>
