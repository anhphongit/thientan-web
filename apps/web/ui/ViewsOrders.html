<script>
/**
 * ViewsOrders.html — order list and the multi-line order form (Milestone 2).
 *
 * Two screens, one module: a list of cards, and a form used for both create and
 * edit. Everything it decides is cosmetic — which buttons to draw, what to show
 * as a total while typing. THIENTAN-API recomputes every đồng and re-checks
 * every permission on save.
 *
 * Cards, not a table: the Admin is on a PC but the staff are on phones, and a
 * seven-column table on a 360px screen is unusable.
 */
(function () {
  'use strict';

  /**
   * The TT bridge is assigned in render(), NOT here.
   *
   * ui/Index.html includes this file BEFORE ui/App.html, so at the moment this
   * IIFE runs `window.TT` does not exist yet. Capturing it here left T undefined
   * forever: showList() painted "Đang tải đơn hàng..." and then threw on the very
   * next line, so the screen hung on the loading text with no error and no
   * "Tạo đơn hàng" button. Found live on 2026-08-20.
   *
   * A view module must not touch window.TT at load time. Read it in render(),
   * which only runs after the whole page has parsed.
   */
  var T = null;
  var root = null;
  var state = {
    orders: [], ordersMeta: null, ordersLoadedAt: 0, refreshing: false,
    // Milestone 4 / 4.5.2 — set while a large export job is being polled;
    // null the rest of the time. Distinct from the plain boolean
    // state.exporting (still used for the synchronous CSV/small-XLSX/PDF
    // path) since this one carries a live rowsWritten/totalRows to show
    // progress, not just an in-flight flag.
    exportJobProgress: null,
    // Milestone 4 / 4.1 — CSV export in flight (disables the button + swaps
    // its label while the server builds/returns the CSV).
exporting: false,
    ordersPage: 0, ordersHasMore: false, loadingMore: false,
    // Milestone 3 / 3.2-3.3 — server-side filters. '' means "no filter" for
    // each field; they combine as AND. Kept separate from the list cache:
    // any change resets orders/loadedAt so the next fetch always goes to the
    // API, filters included.
    // approveStatus: Milestone 3 / 3.8 — combines AND with everything else,
    // same as every other filter here.
    filters: { month: '', customer: '', status: '', createdBy: '', q: '', approveStatus: '' },
    // Milestone 3 / 3.4 fix — the LIVE text of the search box, separate from
    // state.filters.q (the last value actually searched for). Every repaint
    // (toggling the filter panel, "Làm mới", background refreshes...)
    // re-renders the search input's value from this, never from
    // state.filters.q directly, so nothing you're mid-typing gets wiped by
    // an unrelated repaint. See submitSearch().
    searchDraft: '',
    // Milestone 3 / 3.3 — createdBy dropdown data (view_all_orders only).
    // null = not fetched yet; [] is a valid "nobody yet" answer.
    creators: null, creatorsLoading: false,
    // Milestone 3 / 3.5 — orderIds with a status change in flight (server
    // round trip not yet resolved). While an orderId is in here: its card's
    // "open detail" buttons are blocked (see onClick) and its status pill
    // shows a pending state instead of the pencil/select — so the user
    // can't navigate into an order whose status the server hasn't
    // confirmed yet, and always sees that a change is happening.
    statusUpdatingIds: {},
    // UI revision (2026-09-03, "Option A") — which fused-marker dropdown is
    // currently open, or null for none. A string key: an orderId for a
    // list-card marker, or the literal 'detail' for the one in the detail
    // title. Only one open at a time, same as any menu of this kind.
    approveMenuOpenFor: null,
    // Same idea as statusUpdatingIds, for an approve action fired from a
    // LIST CARD's marker (the detail title's own in-flight state keeps
    // using state.busyAction — there is only ever one order open there).
    // While orderId sits in here, that card's marker renders its pending
    // (spinner) state and cannot be clicked again.
    approveUpdatingIds: {},
    // Milestone 3 / 3.2-3.4 UI, "Bảng lọc thu gọn" — purely a display toggle
    // for the panel of dropdowns; never read by fetchOrders()/listPayload().
    filterPanelOpen: false,
    order: null, lines: [],
    editing: false, hiddenMoney: false, bound: false,
    // Milestone 2.5c follow-up — one order-detail mutation in flight at a
    // time: null | 'saving' | 'deleting' | 'reloading'. Everything that can
    // change this order (save, delete, force-reload) checks isBusy() first,
    // and the whole form is rendered locked while it is set — see
    // paintForm()/isBusy() below.
    busyAction: null
  };

  function isBusy() { return !!state.busyAction; }

  /** Milestone 2.5 / P4 — mirrors LIST_PAGE_SIZE_DEFAULT in the API's Config.gs. */
  var PAGE_SIZE = 20;

  /**
   * Milestone 2.5b / L1 — how long a successful list fetch stays "fresh".
   * While fresh, showList() paints from cache and does NOT call the API
   * (no silentRefresh). "Làm mới" always forces a fetch. Create/edit/delete
   * reset the timestamp via upsert/remove so the user's own writes stay
   * visible without a round trip.
   */
  var LIST_CACHE_TTL_MS = 60000;

  /**
   * Milestone 2.5c / D1 — order-detail cache, mirroring LIST_CACHE_TTL_MS.
   * Keyed by orderId: { data: {order, lines, hiddenMoney}, loadedAt }.
   * Reopening the same order within the TTL paints from cache with zero API
   * calls; past the TTL, paints the cached data immediately then silently
   * revalidates in the background — same shape as the list's L1/P2.
   *
   * This does not add a new staleness risk to editing: actionUpdateOrder_
   * has never guarded saves with an updatedAt/version check (it only
   * re-reads inside the lock to reconcile line ids), so two overlapping
   * edits already last-write-win today regardless of how the form got its
   * data — a form simply left open for ten minutes carries the same risk
   * already. A 60s cache does not meaningfully change that envelope.
   */
  var DETAIL_CACHE_TTL_MS = 60000;
  var orderCache = {};

  /**
   * Milestone 2.5 / P2 — the in-flight page-1 apiListOrders promise, shared so
   * a background revalidation, a manual refresh and the P3 boot prefetch never
   * fire three overlapping requests for the same data. "Xem thêm" (P4) is a
   * separate, independently-guarded request — see loadMorePromise below —
   * since appending page 2 is a different operation from replacing page 1.
   */
  var loadingPromise = null;
  var loadMorePromise = null;

  /**
   * Milestone 2.5b / L2 — only-latest-wins.
   * Bumped on every navigation that changes what should be on screen
   * (showList, openForm). Async callbacks capture the seq at start; if it no
   * longer matches when they resolve, they discard the result and do not
   * paint. Network calls are not aborted (UrlFetchApp cannot cancel); only
   * the UI effect is ignored.
   */
  var viewSeq = 0;

  /* ---------------- config helpers ---------------- */

  function config() { return T.config() || {}; }

  function statusList() {
    var list = config().statusList;
    return (list && list.length) ? list : [{ key: 'draft', label: 'Nháp' }];
  }

  function statusLabel(key) {
    var found = statusList().filter(function (s) { return s.key === key; })[0];
    return found ? found.label : (key || '');
  }

  /**
   * UI request, 2026-08-26: statuses must be tellable apart "at a glance",
   * not only by reading the label — so each known workflow step gets its own
   * colour AND its own left-edge dot/shape (colour-blind users, or anyone
   * scanning fast, still get a second signal). Keyed on the fixed 8-status
   * workflow this app ships with (see CONFIG_DEFAULTS in apps/api/Config.gs);
   * an admin who adds a new status key via the Config sheet falls back to
   * the neutral "default" style below rather than breaking.
   */
  var STATUS_STYLE = {
    draft: 'draft',
    confirmed: 'confirmed',
    waiting_stock: 'waiting',
    stock_arrived: 'arrived',
    delivered_not_invoiced: 'delivered',
    invoiced_unpaid: 'invoiced',
    paid: 'paid',
    cancelled: 'cancelled'
  };

  function statusPillClass(key) {
    return 'status-pill status-pill--' + (STATUS_STYLE[key] || 'default');
  }

  /**
   * Milestone 3 / 3.8 — the approve-status workflow, config-gated. When the
   * flag is off, every helper below stays inert (approveStatusEnabled()
   * false), so a deployment that hasn't turned this on keeps exactly
   * today's screen: no badge, no buttons, no filter — the server itself
   * behaves the same way (approvalFlowEnabled_() in Orders.gs), so client
   * and server agree on when this workflow exists at all.
   */
  function approveStatusEnabled() {
    var v = config().approvalFlowEnabled;
    return v === true || v === 'TRUE' || v === 'true';
  }

  function approveStatusList() {
    var list = config().approveStatusList;
    return (list && list.length) ? list : [
      { key: 'draft', label: 'Nháp' },
      { key: 'wait_approval', label: 'Chờ duyệt' },
      { key: 'approved', label: 'Đã duyệt' },
      { key: 'rejected', label: 'Từ chối' }
    ];
  }

  function approveStatusLabel(key) {
    var found = approveStatusList().filter(function (s) { return s.key === key; })[0];
    return found ? found.label : (key || '');
  }

  /**
   * Same "colour + shape" reasoning as STATUS_STYLE above, but its OWN
   * modifier classes (approve-status-pill--*, not status-pill--*): reusing
   * a business-status class here would also drag in that class's other
   * rules (status-pill--cancelled has a strikethrough, which reads as
   * "this order is cancelled" — wrong for an approve status of "rejected").
   */
  var APPROVE_STATUS_STYLE = {
    draft: 'draft',
    wait_approval: 'waiting',
    approved: 'approved',
    rejected: 'rejected'
  };

  function approveStatusPillClass(key) {
    return 'status-pill approve-status-pill approve-status-pill--' + (APPROVE_STATUS_STYLE[key] || 'default');
  }

  function approveStatusPillHtml(key) {
    return '<span class="' + approveStatusPillClass(key) + '">' + T.esc(approveStatusLabel(key)) + '</span>';
  }

  /**
   * UI revision (2026-09-02, "Option N") — small stroke icons distinguishing
   * the four approve-status states by SHAPE, not just colour (same
   * colour-blind-friendly reasoning as the business-status pill's dot).
   * Pencil = draft (still being edited), hourglass = waiting on approval,
   * check = approved, cross = rejected. Kept inline (not a sprite) since
   * ViewsOrders.html has no build step to dedupe/inline external assets.
   */
  var APPROVE_STATUS_ICON = {
    draft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    wait_approval: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M6 2c0 5 4 6 4 10s-4 5-4 10M18 2c0 5-4 6-4 10s4 5 4 10"/></svg>',
    approved: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    rejected: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
  };

  function approveStatusIconSvg(key) {
    return APPROVE_STATUS_ICON[key] || APPROVE_STATUS_ICON.draft;
  }

  /**
   * UI revision (2026-09-02, "Option N") — replaces the old .oc-approve-row
   * (a separate pill on its own row below the id) with the approve-status
   * marker fused directly onto the order id itself: two flush halves, each
   * with its own border, chosen from the mockup round as the option that
   * keeps id and status readable as separate signals while still reading
   * as one object. `idHtml` is the already-escaped order-id markup (plain
   * text on the list card, "Mã đơn {id}" prefix included by the caller for
   * the detail title) — this only wraps it and appends the status half.
   * Colour + icon only here; the caller decides whether a text label goes
   * anywhere else (list: no label at all: detail: separate labelled badge
   * from approveStatusPillHtml/approveStatusBannerHtml below the title).
   *
   * UI revision (2026-09-03, "Option A") — the marker doubles as the
   * trigger for the approve actions themselves, replacing the separate
   * Gửi duyệt/Duyệt/Từ chối/Về Nháp button row. `actions` is the ordered
   * list of {key, label, cls} entries this order/user combination allows
   * right now (see approveActionsFor below) — when it's empty the marker
   * renders exactly as before this revision: no chevron, not clickable,
   * nothing to notice. When it's non-empty, the status half grows a small
   * chevron and becomes a real button (data-act="toggle-approve-menu"),
   * and — only when `menuOpen` says THIS marker is the open one — a
   * dropdown of those actions is rendered right under it. `menuOpen` is
   * state.approveMenuOpenFor === menuKey, computed by the caller so this
   * function stays a pure renderer.
   */
  function fusedOrderIdHtml(idHtml, approveStatus, idClass, actions, menuKey, menuOpen, pending) {
    var styleKey = APPROVE_STATUS_STYLE[approveStatus] || 'default';
    var label = approveStatusLabel(approveStatus);
    actions = actions || [];
    // While an action fired from THIS marker is in flight, it always shows
    // the pending spinner regardless of the (now stale) actions list — same
    // "no second click on top of the first" reasoning as the business-
    // status pill's .status-pill--pending state.
    var actionable = !pending && actions.length > 0;

    var statHtml;
    if (pending) {
      statHtml = '<span class="oc-id-stat" aria-live="polite" aria-label="Đang cập nhật trạng thái duyệt">' +
        '<span class="pill-spinner" aria-hidden="true"></span>' +
      '</span>';
    } else if (actionable) {
      var chev = '<svg class="oc-approve-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      statHtml = '<button type="button" class="oc-id-stat" data-act="toggle-approve-menu" ' +
          'data-menu-key="' + T.esc(menuKey) + '" aria-haspopup="true" aria-expanded="' + (menuOpen ? 'true' : 'false') + '" ' +
          'title="' + T.esc(label) + ' — bấm để xem thao tác" aria-label="' + T.esc(label) + ', có thao tác khả dụng">' +
          approveStatusIconSvg(approveStatus) + chev +
        '</button>';
    } else {
      statHtml = '<span class="oc-id-stat" title="' + T.esc(label) + '" aria-label="' + T.esc(label) + '">' +
          approveStatusIconSvg(approveStatus) +
        '</span>';
    }

    var menuHtml = (actionable && menuOpen)
      ? '<div class="oc-approve-menu" role="menu">' +
          actions.map(function (a) {
            return '<button type="button" class="oc-approve-menu-item' + (a.cls ? ' oc-approve-menu-item--' + a.cls : '') +
              '" role="menuitem" data-act="' + T.esc(a.key) + '" data-menu-key="' + T.esc(menuKey) + '">' +
              a.icon + T.esc(a.label) +
            '</button>';
          }).join('') +
        '</div>'
      : '';

    var wrapClass = 'oc-id-fused oc-id-fused--' + styleKey + (actionable ? ' oc-id-fused--actionable' : '');
    var idSpan = '<span class="' + idClass + '">' + idHtml + '</span>';

    if (!actionable) {
      return '<span class="' + wrapClass + '">' + idSpan + statHtml + '</span>';
    }
    return '<span class="' + wrapClass + '"><span class="oc-approve-menu-wrap" data-menu-key="' + T.esc(menuKey) + '">' +
      idSpan + statHtml + menuHtml +
    '</span></span>';
  }

  /**
   * The four possible approve-menu items, each carrying its own icon/label/
   * colour class and the data-act it maps to in onClick — one place so the
   * list card and the detail title never draw a different label for the
   * same action.
   */
  // The state.busyAction values doApproveStatusAction sets — used by the
  // detail title to know when to show the pending spinner instead of the
  // normal marker/menu, without hard-coding an exclusion list against
  // every OTHER busyAction (saving, deleting, reloading, ...) that isn't
  // approve-related.
  var APPROVE_BUSY_LABELS = ['requesting-approve', 'approving', 'rejecting', 'setting-draft'];

  var APPROVE_MENU_ITEM = {
    requestApprove: { key: 'ask-request-approve', label: 'Gửi duyệt', cls: 'ok', icon: APPROVE_STATUS_ICON.wait_approval },
    approve:        { key: 'ask-approve',         label: 'Duyệt',     cls: 'ok', icon: APPROVE_STATUS_ICON.approved },
    reject:         { key: 'ask-reject',          label: 'Từ chối',   cls: 'danger', icon: APPROVE_STATUS_ICON.rejected },
    setDraft:       { key: 'ask-set-draft',       label: 'Về Nháp',   cls: '', icon: APPROVE_STATUS_ICON.draft }
  };

  /**
   * Builds the ordered action list fusedOrderIdHtml draws its menu from,
   * straight off the four server-computed flags — never re-derives who is
   * allowed to do what (that stays entirely server-side, see
   * approveActionFlags_ in Orders.gs). An order with none of the four flags
   * set returns [], which is what makes the marker render as plain/static.
   */
  function approveActionsFor(o) {
    if (!approveStatusEnabled()) return [];
    var actions = [];
    if (o.canRequestApprove) actions.push(APPROVE_MENU_ITEM.requestApprove);
    if (o.canApprove) actions.push(APPROVE_MENU_ITEM.approve);
    if (o.canReject) actions.push(APPROVE_MENU_ITEM.reject);
    if (o.canSetDraft) actions.push(APPROVE_MENU_ITEM.setDraft);
    return actions;
  }

  /**
   * Mirror of MONEY_FIELDS in the API's Config.gs. Used only to decide whether
   * to draw price inputs — the server still filters what it sends and refuses
   * what it must. A mismatch here costs a redundant field, never a leak.
   */
  var MONEY_FIELDS = ['unitPrice', 'vatRate', 'amountExVat', 'amountIncVat',
                      'totalExVat', 'totalIncVat', 'customerDeposit', 'supplierPaid'];

  function seesMoney() {
    var s = T.session();
    var allowed = (s && s.permissions && s.permissions.visible_fields) || [];
    if (allowed.length === 1 && allowed[0] === '*') return true;
    return MONEY_FIELDS.some(function (f) { return allowed.indexOf(f) >= 0; });
  }

  /**
   * Per-field visible_fields check, mirroring fieldVisible_() in the API's
   * Orders.gs. Money fields keep their own coarser seesMoney() (any money
   * field visible → draw all price inputs); this is for the other optional
   * fields (po, poNote, statusNote, supplierName, and per-line productCode /
   * uom / invoiceNo+invoiceDate / note): a field this user cannot see must
   * not be drawn on the form at all, not merely left to render blank. Only
   * used when there is no server response yet to read has(o, field) from —
   * i.e. building a brand new order/line. Once real data exists, has(o,
   * field) is the source of truth (the server already applied this same
   * rule when it decided what to include in the response).
   */
  function fieldAllowed_(field) {
    var s = T.session();
    var allowed = (s && s.permissions && s.permissions.visible_fields) || [];
    if (allowed.length === 1 && allowed[0] === '*') return true;
    return allowed.indexOf(field) >= 0;
  }

  function uomList() { return config().uomList || []; }
  function vatRates() { return config().vatRates || [0.08, 0.1]; }
  function customerList() { return config().customerList || []; }

  /* ---------------- value helpers ---------------- */

  /** Money arrives from the sheet as a number and from an input as "1.200.000". */
  function digits(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[^\d]/g, '');
  }

  function moneyValue(value) {
    var d = digits(value);
    return d ? parseInt(d, 10) : 0;
  }

  function groupDigits(value) {
    var d = digits(value);
    return d ? parseInt(d, 10).toLocaleString('vi-VN') : '';
  }

  function qtyValue(value) {
    var parsed = parseFloat(String(value === null || value === undefined ? '' : value)
      .replace(',', '.'));
    return isFinite(parsed) ? parsed : 0;
  }

  /** <input type="date"> wants yyyy-MM-dd; the sheet sends an ISO datetime. */
  function dateInputValue(value) {
    if (!value) return '';
    var d = (value instanceof Date) ? value : new Date(value);
    if (isNaN(d.getTime())) return '';
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function today() { return dateInputValue(new Date()); }

  function has(record, field) {
    return record && Object.prototype.hasOwnProperty.call(record, field);
  }

  /* =====================================================================
     List
     ===================================================================== */

  function render(container) {
    T = window.TT;
    root = container;
    if (!state.bound) {
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('blur', onBlur, true);
      root.addEventListener('keydown', onKeydown);
      root.addEventListener('change', onChange);
      state.bound = true;
    }
    showList();
  }

  /**
   * Milestone 2.5 / P3 — called once from App.html right after the session
   * loads, before the user has ever opened "Đơn hàng". Warms `state.orders`
   * so the tab is already instant the first time it's actually clicked.
   *
   * Safe to call whether or not render() has ever run: it only touches
   * `state` and `T`, never the DOM. Silent on failure — showList() will just
   * try again (and can show the real error) when the tab is opened for real.
   */
  function prefetch() {
    if (!window.TT || !window.TT.can('view_orders')) return;
    if (!T) T = window.TT;
    // L3: never stack a prefetch on top of an in-flight list fetch, a warm
    // cache, or a user who already opened the tab (render sets bound).
    if (state.orders.length || loadingPromise || state.refreshing) return;
    if (state.bound && root && state.order === null && root.innerHTML) return;
    fetchOrders().catch(function () {});
  }

  /** True when we have list data and it is still within LIST_CACHE_TTL_MS. */
  function cacheIsFresh() {
    return !!(state.orders.length && state.ordersLoadedAt &&
      (Date.now() - state.ordersLoadedAt) < LIST_CACHE_TTL_MS);
  }

  /**
   * Milestone 2.5 / P2 + P3 + L1 + L2.
   *
   *   - cache warm AND still within LIST_CACHE_TTL_MS (L1):
   *     paint immediately, do NOT call the API.
   *   - cache warm but stale: paint immediately, then silentRefresh.
   *   - a fetch is already in flight (prefetch racing a fast click): show
   *     the skeleton and ride that same promise instead of firing a second
   *     request.
   *   - nothing yet: show the skeleton and start the fetch.
   *
   * L2: bumps viewSeq so any in-flight detail response is discarded.
   */
  function showList() {
    var seq = ++viewSeq;
    state.order = null;
    ensureCreatorsLoaded();

    if (state.orders.length) {
      paintList();
      // L1: only revalidate when the cache has gone stale. Fresh cache =
      // paint only, zero API calls. "Làm mới" still forces a fetch.
      if (!cacheIsFresh()) silentRefresh(seq);
      return;
    }

    root.innerHTML = skeletonHtml();
    (loadingPromise || fetchOrders())
      .then(function () {
        if (seq !== viewSeq) return;
        paintList();
      })
      .catch(function (err) {
        if (seq !== viewSeq) return;
        root.innerHTML = '<section class="card"><p class="empty err-text">' +
          T.esc(err.message) + '</p></section>';
      });
  }

  /**
   * The one place apiListOrders is called for PAGE 1. Shared via
   * `loadingPromise` so overlapping callers (prefetch, silent refresh, the
   * manual "Làm mới" button) never fire duplicate requests. Always replaces
   * `state.orders` from the top — see loadMore() for appending page 2+.
   */
  function listPayload(page) {
    var payload = { page: page, pageSize: PAGE_SIZE };
    if (state.filters.month) payload.month = state.filters.month;
    if (state.filters.customer) payload.customer = state.filters.customer;
    if (state.filters.status) payload.status = state.filters.status;
    if (state.filters.createdBy) payload.createdBy = state.filters.createdBy;
    if (state.filters.q) payload.q = state.filters.q;
    if (state.filters.approveStatus) payload.approveStatus = state.filters.approveStatus;
    return payload;
  }

  function hasActiveFilters() {
    var f = state.filters;
    return !!(f.month || f.customer || f.status || f.createdBy || f.q || f.approveStatus);
  }

  /**
   * Milestone 3 / 3.4 UI fix, Phong's spec 2026-08-31:
   *   (a) empty search box → button disabled
   *   (b) box matches the already-applied query → button disabled (nothing
   *       new to search for)
   *   (c) box holds a different, non-empty query → button enabled
   * Read at paint time (drives the `disabled` attribute) AND on every
   * keystroke (onInput toggles the live button directly — see below) so the
   * two never drift.
   */
  function canSubmitSearch() {
    var draft = (state.searchDraft || '').trim();
    return !!draft && draft !== (state.filters.q || '');
  }

  /** Minimal magnifier glass, matches the app's line-icon-free style —
   *  currentColor so .btn-icon's CSS (brand when enabled, muted when
   *  disabled) drives its color, no separate SVG fill/stroke to keep in sync. */
  var SEARCH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>';

  /** Small pencil/edit glyph for the quick-status pill (E1 option, chosen
   *  2026-08-31): trailing icon appended after the status label, colored via
   *  currentColor so it always matches that pill's own status color — same
   *  technique as SEARCH_ICON_SVG above. */
  var PENCIL_ICON_SVG = '<svg class="pill-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

  /**
   * Milestone 3 / 3.3 — createdBy dropdown data. Fetched once, lazily, only
   * for a caller who can see everyone's orders (apiListOrderCreators returns
   * an empty list for anyone else anyway, so there's nothing worth a request
   * for). Not gated behind the list cache/TTL machinery: this is small,
   * changes rarely (only when someone new creates their first order), and
   * re-fetching it is cheap compared to the order list itself.
   */
  function ensureCreatorsLoaded() {
    if (!T.can('view_all_orders')) return;
    if (state.creators !== null || state.creatorsLoading) return;
    state.creatorsLoading = true;
    T.call('apiListOrderCreators', {}).then(function (data) {
      state.creators = (data && data.creators) || [];
      state.creatorsLoading = false;
      if (state.order === null) paintList(); // repaint the filter bar now that options exist
    }).catch(function (err) {
      // Bug found live 2026-08-31: leaving state.creators === null here made
      // the dropdown show "Đang tải người tạo…" forever on any failure (a
      // stale deployment missing the endpoint, a network blip) with no way
      // to notice or recover. Fall back to an empty (but usable) dropdown —
      // every OTHER filter still works — and surface the error once instead
      // of failing silently forever.
      state.creators = [];
      state.creatorsLoading = false;
      T.toast('Không tải được danh sách người tạo: ' + err.message, true);
      if (state.order === null) paintList();
    });
  }

  function fetchOrders() {
    if (loadingPromise) return loadingPromise;
    // Milestone 3 / 3.2-3.3: stamp the request with the filters in effect
    // when it was made. applyFilters()/clearFilters() cannot cancel an
    // in-flight apiListOrders call (UrlFetchApp has no abort), so a slow
    // request made under OLD filters must not be allowed to overwrite
    // state.orders once newer filters have already reset it — checked below.
    var filtersAtRequest = JSON.stringify(state.filters);
    loadingPromise = T.call('apiListOrders', listPayload(1)).then(
      function (data) {
        loadingPromise = null;
        if (filtersAtRequest !== JSON.stringify(state.filters)) return data; // superseded by newer filters
        state.orders = (data && data.orders) || [];
        // Milestone 4 / 4.5.2 revision — also carry totalLines (sum of
        // the filtered set's order-line counts, actionListOrders_) so the
        // export dialog can gauge export size by LINE count, a better
        // predictor of export time than order count (see doExportCsv).
        state.ordersMeta = { total: (data && data.total) || 0,
          totalLines: (data && data.totalLines) || 0, shown: state.orders.length };
        state.ordersPage = 1;
        state.ordersHasMore = !!(data && data.hasMore);
        state.ordersLoadedAt = Date.now();
        return data;
      },
      function (err) { loadingPromise = null; throw err; }
    );
    return loadingPromise;
  }

  /**
   * Milestone 3 / 3.2-3.3 — applying or clearing filters is a deliberate
   * navigation, same spirit as manualRefresh(): drop whatever is cached (a
   * stale unfiltered or differently-filtered page must never be shown under
   * the new filters) and fetch page 1 fresh. Cheap at this data volume
   * (≤ 100 orders/month) to just always hit the API rather than keep a
   * per-filter-combination cache client-side.
   *
   * `next` only needs to carry the fields that changed; anything omitted
   * keeps its current value.
   */
  function applyFilters(next) {
    var merged = Object.assign({}, state.filters, next || {});
    // Bug found live 2026-08-31: 'q' was missing from this list, so any
    // call that only changed the search query (submitSearch(), the "✕" on
    // the search chip) saw `changed === false` and returned before ever
    // updating state.filters or re-fetching — the enabled, clickable search
    // button did nothing because THIS check silently no-op'd it.
    var changed = ['month', 'customer', 'status', 'createdBy', 'q', 'approveStatus'].some(function (k) {
      return merged[k] !== state.filters[k];
    });
    if (!changed) return;
    state.filters = merged;
    state.orders = [];
    state.ordersMeta = null;
    state.ordersLoadedAt = 0;
    state.ordersPage = 0;
    state.ordersHasMore = false;
    state.loadingMore = false;
    loadMorePromise = null;
    showList();
  }

  function clearFilters() {
    // Same bug's other half: 'q' was missing here too, so "Xóa lọc" cleared
    // every dropdown filter but left the search query actually applied
    // (state.filters.q) untouched, even though the chip/input looked cleared.
    applyFilters({ month: '', customer: '', status: '', createdBy: '', q: '', approveStatus: '' });
  }

  /**
   * Milestone 2.5 / P4 — "Xem thêm": fetch the next page and append it.
   * Independent of fetchOrders()/loadingPromise (a page-1 replace is a
   * different operation from a page-N append) but mutually exclusive with
   * it in practice — see the guards in silentRefresh()/manualRefresh() below
   * — so a background refresh can never land mid-append and interleave two
   * different views of the list.
   */
  function loadMore() {
    if (loadMorePromise || loadingPromise || !state.ordersHasMore) return;
    var seq = viewSeq; // do not bump — still on list; but ignore if user leaves
    state.loadingMore = true;
    paintList();

    var nextPage = state.ordersPage + 1;
    loadMorePromise = T.call('apiListOrders', listPayload(nextPage))
      .then(function (data) {
        if (seq !== viewSeq) {
          state.loadingMore = false;
          loadMorePromise = null;
          return;
        }
        var seen = {};
        state.orders.forEach(function (o) { seen[o.orderId] = true; });
        ((data && data.orders) || []).forEach(function (o) {
          if (!seen[o.orderId]) state.orders.push(o); // a save/delete may have shifted the page boundary
        });
        // Milestone 4 / 4.5.2 revision — also carry totalLines (sum of
        // the filtered set's order-line counts, actionListOrders_) so the
        // export dialog can gauge export size by LINE count, a better
        // predictor of export time than order count (see doExportCsv).
        state.ordersMeta = { total: (data && data.total) || 0,
          totalLines: (data && data.totalLines) || 0, shown: state.orders.length };
        state.ordersPage = nextPage;
        state.ordersHasMore = !!(data && data.hasMore);
        state.loadingMore = false;
        loadMorePromise = null;
        paintList();
      })
      .catch(function (err) {
        state.loadingMore = false;
        loadMorePromise = null;
        if (seq !== viewSeq) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Background revalidation for returning to an already-loaded list. Never
   * blanks the screen. Failure is silent on purpose: the cached list on
   * screen is still the last good one, and "Làm mới" remains available for
   * a deliberate retry — an unprompted error toast for a refresh nobody
   * asked for would just be noise.
   *
   * Skipped once more than one page is loaded, and while "Xem thêm" is in
   * flight: a silent background refresh only re-fetches page 1, so running
   * it against a deeper view would quietly truncate pages the user
   * deliberately loaded. A deliberate "Làm mới" click is allowed to do that
   * — see manualRefresh() — but a background one that nobody asked for
   * should never surprise like that.
   */
  function silentRefresh(seq) {
    // L3: one background revalidation at a time; never against a multi-page view
    if (state.refreshing || state.loadingMore || state.ordersPage > 1) return;
    if (seq == null) seq = viewSeq;
    state.refreshing = true;
    // rides loadingPromise when prefetch or another caller is already mid-flight
    fetchOrders()
      .then(function () {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        if (state.order) return; // user opened a detail while we were refreshing
        paintList();
      })
      .catch(function () { state.refreshing = false; });
  }

  /** The visible "Làm mới" button: spins in place, old list stays on screen,
   *  and a failure here IS reported — this one the user asked for. Resets to
   *  page 1, same as any "refresh" control — a deliberate click, so the
   *  surprise silentRefresh() avoids is acceptable here. */
  function manualRefresh() {
    if (state.refreshing || state.loadingMore) return;
    var seq = viewSeq; // stay on list; ignore result only if user navigated away
    state.refreshing = true;
    paintList();
    // L3: fetchOrders() coalesces with any in-flight page-1 request
    fetchOrders()
      .then(function () {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        paintList();
      })
      .catch(function (err) {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Milestone 4 / 4.1 — CSV export of the currently-filtered list.
   * Manual-testing button (no dedicated export screen yet): reuses the same
   * filter fields as listPayload() (month/customer/status/createdBy/q/
   * approveStatus), so "what you're looking at" is "what you export" — same
   * filters actionExportOrdersCsv_ re-applies server-side via
   * computeOrderFilters_/filteredOrderRowsForUser_ (shared with
   * actionListOrders_, see Orders.gs). Not paginated: page/pageSize from
   * listPayload() are harmless extras the export action ignores.
   *
   * The server returns {filename, mimeType, csv} (csv already carries a
   * UTF-8 BOM prefix) — turned into a real download here via a Blob +
   * temporary <a download> link, since google.script.run has no way to
   * hand back a browser download directly.
   */
  /**
   * Milestone 4 / 4.5.2 (revised 2026-09-04 — Phong: count order LINES,
   * not orders, and read the threshold from config instead of a
   * hardcoded constant): above `config().exportLargeThreshold` order
   * LINES (not orders — a handful of orders with many lines each can
   * take just as long to export as many single-line orders, since
   * ExportJob.gs's checkpointing batches by sheet ROW, and this project
   * writes one export row per order line either way — see
   * exportLargeThreshold_'s doc comment in the API project's Export.gs),
   * XLSX/PDF switch to the checkpointed job+polling path instead of the
   * plain synchronous export. Config-driven (Config sheet's
   * `exportLargeThreshold`, default 500) rather than a constant duplicated
   * on both sides, so an admin can retune it without a code deploy.
   */
  function exportLargeThreshold_() {
    var n = parseInt(config().exportLargeThreshold, 10);
    return (n > 0) ? n : 500;
  }

  function doExportCsv() {
    if (state.exporting || state.exportJobProgress) return;
    openExportDialog().then(function (choice) {
      if (!choice || !choice.ok) return;
      var lineCount = (state.ordersMeta && state.ordersMeta.totalLines != null)
        ? state.ordersMeta.totalLines
        : state.orders.reduce(function (sum, o) { return sum + (o.lineCount || 0); }, 0);
      var large = lineCount > exportLargeThreshold_();
      if (choice.format === 'xlsx') {
        if (large) runExportLarge_(choice.basis, 'xlsx'); else runExportXlsx(choice.basis);
      } else if (choice.format === 'pdf') {
        if (large) runExportLarge_(choice.basis, 'pdf'); else runExportPdf(choice.basis);
      } else {
        runExportCsv(choice.basis); // CSV: always synchronous, any size
      }
    });
  }

  /**
   * Milestone 4 / 4.2 revision (2026-09-03, "Option B2" of the reviewed
   * mockups) — export-options dialog. Shows the filters currently applied
   * to the list (activeFilterChips(), same data the filter-bar chips use),
   * then two radio choices: date basis (order date / invoice date — an
   * inline hint appears under "Ngày hóa đơn" explaining the per-line
   * month-split behavior only once it's selected, not unconditionally)
   * and file format (CSV only for now; XLSX/PDF, 4.3/4.4, add rows here
   * rather than a new dialog).
   *
   * Bespoke modal (#export-modal, ui/Index.html) rather than TT.confirm():
   * that popup's shape (title/message/one optional textarea) has no room
   * for live radio groups or a conditionally-shown block. Resolves
   * {ok:true, basis} on "Xuất file", {ok:false} on cancel/backdrop/Escape —
   * same ok-flag shape as TT.confirm() so doExportCsv() above reads it the
   * same way every other confirm-then-act flow in this file does.
   */
  function openExportDialog() {
    return new Promise(function (resolve) {
      var modal = document.getElementById('export-modal');
      var body = document.getElementById('export-modal-body');
      var chips = activeFilterChips();
      var count = (state.ordersMeta && state.ordersMeta.total != null)
        ? state.ordersMeta.total : state.orders.length;

      body.innerHTML = '' +
        // Bug fix, 2026-09-03 (Phong screenshotted: dialog cut off on a
        // phone layout, "Xuất file" unreachable) — everything but the
        // action buttons now lives inside .export-modal-scroll (see
        // Styles.html's .export-modal-card/.export-modal-scroll) so a
        // tall dialog (this one especially once the invoice-date hint is
        // showing) scrolls internally instead of being clipped by the
        // card's own `overflow: hidden`.
        '<div class="export-modal-scroll">' +
        '<div class="confirm-band">' +
          '<span class="confirm-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>' +
            '</svg>' +
          '</span>' +
          '<h2 id="export-modal-title">Xuất danh sách đơn hàng</h2>' +
        '</div>' +
        '<div class="export-section">' +
          '<span class="export-section-label">Đang áp dụng bộ lọc</span>' +
          '<div class="export-chips">' +
            (chips.length ? chips.map(function (c) {
              return '<span class="export-chip">' + T.esc(c.label) + '</span>';
            }).join('') : '<span class="export-chip export-chip--muted">Không có bộ lọc nào</span>') +
            '<span class="export-chip export-chip--muted">' + count + ' đơn</span>' +
          '</div>' +
        '</div>' +
        '<div class="export-divider"></div>' +
        '<div class="export-section">' +
          '<span class="export-section-label">Nhóm theo tháng dựa trên</span>' +
          '<div class="export-rlist">' +
            '<label class="export-rrow">' +
              '<input type="radio" name="export-basis" value="orderDate" checked>' +
              '<span><span class="rmain">Ngày đặt hàng</span>' +
              '<span class="rsub">Khớp với file mẫu hiện tại — mặc định</span></span>' +
            '</label>' +
            '<label class="export-rrow">' +
              '<input type="radio" name="export-basis" value="invoiceDate">' +
              '<span><span class="rmain">Ngày hóa đơn</span></span>' +
            '</label>' +
          '</div>' +
          '<div id="export-basis-hint" class="export-hint" hidden>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"></path>' +
            '<path d="M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>' +
            '<span>Nếu chọn mục này: 1 đơn có nhiều dòng xuất hóa đơn khác tháng sẽ hiện tách ra ở từng ' +
            'tháng tương ứng, dòng chưa có hóa đơn sẽ gộp vào mục riêng "Chưa xuất hóa đơn".</span>' +
          '</div>' +
          '<span class="export-section-label">Định dạng file</span>' +
          '<div class="export-rlist">' +
            '<label class="export-rrow">' +
              '<input type="radio" name="export-format" value="csv" checked>' +
              '<span><span class="rmain">CSV</span>' +
              '<span class="rsub">Mở được bằng Excel, Google Sheets</span></span>' +
            '</label>' +
            '<label class="export-rrow">' +
              '<input type="radio" name="export-format" value="xlsx">' +
              '<span><span class="rmain">Excel (.xlsx)</span>' +
              '<span class="rsub">Có định dạng in đậm dòng tổng/tháng sẵn</span></span>' +
            '</label>' +
            '<label class="export-rrow">' +
              '<input type="radio" name="export-format" value="pdf">' +
              '<span><span class="rmain">PDF</span>' +
              '<span class="rsub">Sẵn sàng để in hoặc gửi qua email</span></span>' +
            '</label>' +
          '</div>' +
        '</div>' +
        '</div>' + // .export-modal-scroll
        '<div class="confirm-actions">' +
          '<button type="button" class="btn" data-export-choice="cancel">Huỷ</button>' +
          '<button type="button" class="btn btn-ok" data-export-choice="ok">Xuất file</button>' +
        '</div>';

      var hint = document.getElementById('export-basis-hint');
      function syncHint() {
        var picked = body.querySelector('input[name="export-basis"]:checked');
        hint.hidden = !picked || picked.value !== 'invoiceDate';
      }
      // Bug fix, 2026-09-03 (Phong live-tested: hint stayed visible under
      // BOTH radio choices) — the CSS side is fixed too (.export-hint[hidden],
      // Styles.html), but sync once up front regardless so the hint is
      // never wrong for the first render, whatever the default checked
      // radio ends up being.
      syncHint();

      function finish(result, basis, format) {
        modal.classList.add('hidden');
        modal.removeEventListener('click', onClick);
        modal.removeEventListener('change', onChangeLocal);
        document.removeEventListener('keydown', onKeydown);
        resolve(result ? { ok: true, basis: basis, format: format } : { ok: false });
      }
      function onClick(e) {
        var choice = e.target.closest && e.target.closest('[data-export-choice]');
        if (choice) {
          if (choice.getAttribute('data-export-choice') === 'ok') {
            var basisEl = body.querySelector('input[name="export-basis"]:checked');
            var formatEl = body.querySelector('input[name="export-format"]:checked');
            finish(true, basisEl ? basisEl.value : 'orderDate', formatEl ? formatEl.value : 'csv');
          } else {
            finish(false);
          }
          return;
        }
        if (e.target === modal) finish(false); // click on the dimmed backdrop = cancel
      }
      function onChangeLocal(e) {
        if (e.target && e.target.name === 'export-basis') syncHint();
      }
      function onKeydown(e) {
        if (e.key === 'Escape') finish(false);
      }

      modal.addEventListener('click', onClick);
      modal.addEventListener('change', onChangeLocal);
      document.addEventListener('keydown', onKeydown);
      modal.classList.remove('hidden');
    });
  }

  function runExportCsv(basis) {
    state.exporting = true;
    paintList();
    var payload = listPayload(1);
    payload.basis = basis;
    T.call('apiExportOrdersCsv', payload)
      .then(function (res) {
        state.exporting = false;
        paintList();
        downloadBlob(new Blob([res.csv], { type: res.mimeType || 'text/csv' }),
          res.filename || 'orders.csv');
      })
      .catch(function (err) {
        state.exporting = false;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Milestone 4 / 4.3 — XLSX export. Same flow as runExportCsv, but the
   * server has no binary channel in its JSON response (apiExportOrdersXlsx
   * returns base64, built by a temp-Sheet export in ExportSheet.gs) — this
   * decodes it back into real bytes before building the Blob.
   */
  function runExportXlsx(basis) {
    state.exporting = true;
    paintList();
    var payload = listPayload(1);
    payload.basis = basis;
    T.call('apiExportOrdersXlsx', payload)
      .then(function (res) {
        state.exporting = false;
        paintList();
        downloadBlob(base64ToBlob_(res.base64, res.mimeType), res.filename || 'orders.xlsx');
      })
      .catch(function (err) {
        state.exporting = false;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Milestone 4 / 4.4 — PDF export. Same flow and response shape as
   * runExportXlsx (base64 -> Blob -> download); only the server action
   * and default filename differ, so this is a near copy rather than a
   * further-shared helper — the two are already as DRY as they can be
   * without the flow itself becoming harder to follow than three near-
   * identical lines saved.
   */
  function runExportPdf(basis) {
    state.exporting = true;
    paintList();
    var payload = listPayload(1);
    payload.basis = basis;
    T.call('apiExportOrdersPdf', payload)
      .then(function (res) {
        state.exporting = false;
        paintList();
        downloadBlob(base64ToBlob_(res.base64, res.mimeType), res.filename || 'orders.pdf');
      })
      .catch(function (err) {
        state.exporting = false;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Milestone 4 / 4.5.2 — large-export path: starts a checkpointed job
   * (ExportJob.gs via apiStartExportJob), then polls apiExportJobStatus
   * every EXPORTJOB_POLL_INTERVAL_MS until it reaches 'done' or 'error'.
   * Deliberately does NOT attempt to download the finished file yet —
   * 4.5.1/4.5.2 stop at the temp Sheet sitting in the API project's Drive
   * with the job marked done; turning that into an actual download/email
   * is 4.5.3 (Drive + email delivery). For now, reaching 'done' just tells
   * Phong the export finished server-side; a manual note in the toast
   * says so plainly rather than implying a file is about to appear.
   *
   * state.exportJobProgress carries {rowsWritten, totalRows, format} so
   * paintList() can render a live "N/M dòng" progress line on the export
   * button — separate from the plain state.exporting boolean the
   * synchronous path uses, since this path has real progress to show.
   */
  var EXPORTJOB_POLL_INTERVAL_MS = 2500;

  function runExportLarge_(basis, format) {
    var payload = listPayload(1);
    payload.basis = basis;
    payload.format = format;
    state.exportJobProgress = { rowsWritten: 0, totalRows: 0, format: format };
    paintList();

    T.call('apiStartExportJob', payload)
      .then(function (res) { pollExportJobOnce_(res.jobId); })
      .catch(function (err) {
        state.exportJobProgress = null;
        paintList();
        T.toast(err.message, true);
      });
  }

  /** Fetches one status snapshot and either re-renders progress and
   *  schedules the next poll (status 'running'), or clears progress and
   *  reports the outcome (status 'done'/'error'). Always fetches fresh
   *  from the server rather than trusting apiStartExportJob's own
   *  {jobId,status} response for anything past the very first call — that
   *  response has no rowsWritten/totalRows (startExportJob_ returns just
   *  enough to know whether to start polling at all), so one real status
   *  fetch right after starting is simpler than fabricating a fake first
   *  "0 / 0" progress frame while waiting out a full poll interval. */
  function pollExportJobOnce_(jobId) {
    T.call('apiExportJobStatus', jobId).then(function (status) {
      if (status.status === 'running') {
        state.exportJobProgress = {
          rowsWritten: status.rowsWritten, totalRows: status.totalRows, format: status.format
        };
        paintList();
        setTimeout(function () { pollExportJobOnce_(jobId); }, EXPORTJOB_POLL_INTERVAL_MS);
        return;
      }

      state.exportJobProgress = null;
      paintList();
      if (status.status === 'done') {
        // 4.5.3 will turn this into an actual download/email delivery;
        // for now the job finishing server-side is all there is to report.
        T.toast('Đã xuất xong (' + status.totalRows + ' dòng). Tính năng tải/gửi file sẽ có ở bước tiếp theo.');
      } else {
        T.toast(status.error || 'Xuất file thất bại.', true);
      }
    }).catch(function (err) {
      state.exportJobProgress = null;
      paintList();
      T.toast(err.message, true);
    });
  }

  /** atob() + Uint8Array — the standard base64-to-Blob conversion; binary
   *  data survives a round trip through JSON only as base64 text
   *  (apiExportOrdersXlsx's response), so this undoes that on the way
   *  into a real downloadable file. */
  function base64ToBlob_(base64, mimeType) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mimeType || 'application/octet-stream' });
  }

  /** Shared by CSV and XLSX export: Blob -> temporary <a download> click ->
   *  revoke. google.script.run has no way to hand back a browser download
   *  directly, so this is the one place both formats turn a Blob into an
   *  actual saved file. */
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    T.toast('Đã xuất file ' + filename + '.');
  }

  function paintList() {
    root.innerHTML = listHtml();
  }

  function listHtml() {
    var canCreate = T.can('create_order');
    // Milestone 4 / 4.1 — CSV export of whatever's currently filtered/shown
    // in this list. Manual-testing button: exports the same filter payload
    // as the list itself (see listPayload()/doExportCsv()).
    var canExport = T.can('export');
    // Milestone 4 / 4.5.2 — while a large export job is being polled, the
    // button shows live progress ("Đang xuất… 1.200/5.000 dòng") instead
    // of the plain "Đang xuất…" the synchronous path (state.exporting)
    // uses — there's real progress to show here, so show it.
    var exportBusy = state.exporting || !!state.exportJobProgress;
    var exportLabel = 'Xuất CSV';
    if (state.exportJobProgress) {
      var p = state.exportJobProgress;
      exportLabel = 'Đang xuất… ' + (p.totalRows
        ? p.rowsWritten.toLocaleString('vi-VN') + '/' + p.totalRows.toLocaleString('vi-VN') + ' dòng'
        : '');
    } else if (state.exporting) {
      exportLabel = 'Đang xuất…';
    }
    var head = '' +
      '<div class="view-head">' +
        '<h2>Đơn hàng</h2>' +
        '<div class="view-head-actions">' +
          (canExport ? '<button type="button" class="btn" data-act="export-csv"' +
            (exportBusy ? ' disabled' : '') + '>' + T.esc(exportLabel) + '</button>' : '') +
          (canCreate ? '<button type="button" class="btn btn-primary" data-act="new">+ Tạo đơn hàng</button>' : '') +
        '</div>' +
      '</div>' +
      filterBarHtml();

    if (!state.orders.length) {
      var emptyText = hasActiveFilters()
        ? 'Không có đơn hàng nào khớp với bộ lọc đã chọn.'
        : (canCreate ? 'Chưa có đơn hàng nào. Bấm “Tạo đơn hàng” để bắt đầu.'
                     : 'Chưa có đơn hàng nào.');
      return head + '<section class="card"><p class="empty">' + emptyText + '</p></section>';
    }

    var meta = state.ordersMeta || { shown: state.orders.length, total: state.orders.length };
    var count = '' +
      '<p class="list-count">' +
        'Hiển thị ' + meta.shown + ' / ' + meta.total + ' đơn' +
        (updatedLabel() ? ' · ' + updatedLabel() : '') + ' · ' +
        '<button type="button" class="link-btn" data-act="refresh-list"' +
          (state.refreshing ? ' disabled' : '') + '>' +
          (state.refreshing ? 'Đang làm mới…' : 'Làm mới') +
        '</button>' +
      '</p>';

    var loadMoreBtn = state.ordersHasMore
      ? '<button type="button" class="btn btn-block" data-act="load-more"' +
          (state.loadingMore ? ' disabled' : '') + '>' +
          (state.loadingMore ? 'Đang tải thêm…' : 'Xem thêm') +
        '</button>'
      : '';

    return head + count + '<div class="order-list">' +
      state.orders.map(orderCardHtml).join('') + '</div>' + loadMoreBtn;
  }

  /**
   * Milestone 3 / 3.2-3.4 — "Bảng lọc thu gọn" + "Thẻ đang áp dụng" (Phong's
   * choice, 2026-08-31, over 4 sketched options): search box always visible;
   * a "Bộ lọc" toggle (state.filterPanelOpen, UI-only — never triggers a
   * fetch by itself) expands a stacked panel of dropdowns instead of
   * cramming everything into one wrapping row; once filters are applied
   * they show as removable chips under the search box, so clearing just
   * "Yamato" doesn't require reopening the panel to hunt for its dropdown.
   *
   * A native <input type="month"> opens a full DATE calendar on most
   * browsers/phones (day grid, just no day picked) for a filter that is only
   * ever a month — two plain dropdowns (month + year) read as "pick a
   * month" immediately and never show a day grid.
   */
  function filterBarHtml() {
    var month = state.filters.month || '';
    var parts = month.split('-');
    var selMonth = parts[0] ? parts[1] : '';
    var selYear = parts[0] ? parts[0] : '';
    var active = hasActiveFilters();

    return '' +
      '<div class="list-filter">' +
        '<div class="list-filter-row">' +
          '<input type="search" id="f-filter-q" class="list-filter-q" placeholder="Tìm mã đơn, PO, khách hàng, mô tả…" ' +
            'value="' + T.esc(state.searchDraft || '') + '">' +
          '<button type="button" class="btn-icon" data-act="submit-search" aria-label="Tìm kiếm"' +
            (canSubmitSearch() ? '' : ' disabled') + '>' + SEARCH_ICON_SVG + '</button>' +
          '<button type="button" class="filter-toggle' + (active ? ' has-active' : '') + '" data-act="toggle-filter-panel">' +
            (active ? '<span class="filter-dot"></span>' : '') + 'Bộ lọc' +
          '</button>' +
        '</div>' +
        chipsHtml() +
        (state.filterPanelOpen ? '' +
          '<div class="filter-panel">' +
            '<div class="filter-panel-pair">' +
              '<select id="f-filter-month">' + monthOptionsHtml(selMonth) + '</select>' +
              '<select id="f-filter-year">' + yearOptionsHtml(selYear) + '</select>' +
            '</div>' +
            (fieldAllowed_('customer') ? '<select id="f-filter-customer">' + customerOptionsHtml(state.filters.customer) + '</select>' : '') +
            (fieldAllowed_('status') ? '<select id="f-filter-status">' + statusOptionsHtml(state.filters.status) + '</select>' : '') +
            approveStatusFilterHtml() +
            creatorFilterHtml() +
            '<div class="filter-panel-actions">' +
              '<button type="button" class="link-btn" data-act="clear-filter">Xóa lọc</button>' +
              '<button type="button" class="btn btn-filter" data-act="apply-filter">Áp dụng</button>' +
            '</div>' +
          '</div>'
        : '') +
      '</div>';
  }

  /**
   * One removable chip per active filter. `data-key` says which
   * `state.filters` field(s) to blank when its ✕ is clicked — month/year are
   * one filter (`month`) even though they're two dropdowns.
   */
  function chipsHtml() {
    var chips = activeFilterChips();
    if (!chips.length) return '';
    return '<div class="chip-row">' + chips.map(function (c) {
      return '<span class="chip">' + T.esc(c.label) +
        '<button type="button" data-act="remove-filter" data-key="' + c.key + '" aria-label="Bỏ lọc ' + T.esc(c.label) + '">✕</button>' +
      '</span>';
    }).join('') + '</div>';
  }

  /** Same {key, label} pairs chipsHtml() renders as removable filter-bar
   *  chips — extracted so the export dialog (Milestone 4 / 4.2 revision)
   *  can show the exact same "what's currently applied" summary without
   *  the ✕ buttons, instead of maintaining a second description of what
   *  counts as an active filter. */
  function activeFilterChips() {
    var chips = [];
    if (state.filters.month) {
      var parts = state.filters.month.split('-');
      chips.push({ key: 'month', label: 'Tháng ' + parseInt(parts[1], 10) + '/' + parts[0] });
    }
    if (state.filters.customer) {
      chips.push({ key: 'customer', label: state.filters.customer });
    }
    if (state.filters.status) {
      chips.push({ key: 'status', label: statusLabel(state.filters.status) });
    }
    if (state.filters.createdBy) {
      var creator = (state.creators || []).filter(function (c) { return c.email === state.filters.createdBy; })[0];
      chips.push({ key: 'createdBy', label: creator ? creator.displayName : state.filters.createdBy });
    }
    if (state.filters.q) {
      chips.push({ key: 'q', label: 'Tìm: "' + state.filters.q + '"' });
    }
    if (state.filters.approveStatus) {
      chips.push({ key: 'approveStatus', label: approveStatusLabel(state.filters.approveStatus) });
    }
    return chips;
  }

  /** Milestone 3 / 3.3. Empty option is always "Tất cả khách hàng" — unlike
   *  month, "no customer selected" is a real, common state, not an error. */
  function customerOptionsHtml(selected) {
    var out = '<option value="">Tất cả khách hàng</option>';
    customerList().forEach(function (c) {
      out += '<option value="' + T.esc(c) + '"' + (c === selected ? ' selected' : '') + '>' +
             T.esc(c) + '</option>';
    });
    return out;
  }

  function statusOptionsHtml(selected) {
    var out = '<option value="">Tất cả trạng thái</option>';
    statusList().forEach(function (s) {
      out += '<option value="' + T.esc(s.key) + '"' + (s.key === selected ? ' selected' : '') + '>' +
             T.esc(s.label) + '</option>';
    });
    return out;
  }

  /**
   * Milestone 3 / 3.8 (point 10) — approve-status filter, config-gated same
   * as everywhere else in this file: while the flag is off the dropdown
   * simply doesn't render, mirroring the server's own approvalFlowEnabled_()
   * guard that ignores payload.approveStatus entirely in that case. Unlike
   * the customer/status filters above, this is never gated on
   * fieldAllowed_() — approveStatus is always visible (spec point 2), so
   * every account gets this dropdown once the flag is on.
   */
  function approveStatusFilterHtml() {
    if (!approveStatusEnabled()) return '';
    var out = '<option value="">Tất cả trạng thái duyệt</option>';
    approveStatusList().forEach(function (s) {
      out += '<option value="' + T.esc(s.key) + '"' +
             (s.key === state.filters.approveStatus ? ' selected' : '') + '>' +
             T.esc(s.label) + '</option>';
    });
    return '<select id="f-filter-approveStatus">' + out + '</select>';
  }

  /**
   * Milestone 3 / 3.3 — createdBy dropdown. Only drawn for a caller who can
   * see everyone's orders (see actionListOrderCreators_'s own gate); while
   * the list is still loading it degrades to a disabled placeholder rather
   * than not being there at all, so the filter bar's layout doesn't jump
   * once it arrives.
   */
  function creatorFilterHtml() {
    if (!T.can('view_all_orders')) return '';
    if (state.creators === null) {
      return '<select id="f-filter-createdBy" disabled><option>Đang tải người tạo…</option></select>';
    }
    var out = '<option value="">Tất cả người tạo</option>';
    state.creators.forEach(function (c) {
      out += '<option value="' + T.esc(c.email) + '"' + (c.email === state.filters.createdBy ? ' selected' : '') + '>' +
             T.esc(c.displayName) + '</option>';
    });
    return '<select id="f-filter-createdBy">' + out + '</select>';
  }

  function monthOptionsHtml(selected) {
    var out = '<option value="">Tháng</option>';
    for (var m = 1; m <= 12; m++) {
      var v = (m < 10 ? '0' : '') + m;
      out += '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>Tháng ' + m + '</option>';
    }
    return out;
  }

  /** Current year, plus a couple back and one ahead — plenty for a ≤100
   *  orders/month shop that has been running since 2026 (Q7, OPEN_QUESTIONS.md). */
  function yearOptionsHtml(selected) {
    var current = new Date().getFullYear();
    var out = '<option value="">Năm</option>';
    for (var y = current + 1; y >= current - 3; y--) {
      out += '<option value="' + y + '"' + (String(y) === selected ? ' selected' : '') + '>' + y + '</option>';
    }
    return out;
  }

  function updatedLabel() {
    if (!state.ordersLoadedAt) return '';
    var d = new Date(state.ordersLoadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'cập nhật lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** Milestone 2.5 / P3 — placeholder cards for a genuine first load, so it
   *  reads as "loading" instead of a frozen blank screen. */
  function skeletonHtml() {
    var card = '' +
      '<div class="order-card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</div>';
    return '' +
      '<div class="view-head"><h2>Đơn hàng</h2></div>' +
      '<div class="order-list">' + card + card + card + '</div>';
  }

  /** Milestone 2.5c / D1 — same idea as skeletonHtml() (P3), for a genuine
   *  first open of one order instead of a blocking "Đang mở đơn hàng..." line. */
  function detailSkeletonHtml() {
    return '' +
      '<div class="view-head"><h2>Đang mở đơn hàng...</h2></div>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</section>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w40"></div>' +
      '</section>';
  }

  /**
   * Milestone 2.5 / P2 — write-through cache update after a create/edit, so
   * the next "← Danh sách" is instant AND already correct: no waiting on a
   * network round trip just to see your own save. A no-op before any list
   * has ever loaded — nothing cached yet to keep in sync.
   */
  function upsertCachedOrder(order, lineCount) {
    if (!state.ordersLoadedAt) return;
    var card = {};
    Object.keys(order).forEach(function (k) { card[k] = order[k]; });
    card.lineCount = lineCount;

    var i = -1;
    for (var j = 0; j < state.orders.length; j++) {
      if (state.orders[j].orderId === order.orderId) { i = j; break; }
    }
    if (i >= 0) state.orders[i] = card;
    else state.orders.unshift(card);

    if (state.ordersMeta) {
      if (i < 0) state.ordersMeta.total += 1;
      state.ordersMeta.shown = state.orders.length;
    }
    // L1: own write keeps the cache "fresh" so the next back-navigation
    // does not immediately trigger a silentRefresh.
    state.ordersLoadedAt = Date.now();
  }

  /** Milestone 2.5 / P2 — same idea, for delete. */
  function removeCachedOrder(orderId) {
    var before = state.orders.length;
    state.orders = state.orders.filter(function (o) { return o.orderId !== orderId; });
    if (state.ordersMeta && state.orders.length !== before) {
      state.ordersMeta.total = Math.max(0, state.ordersMeta.total - 1);
      state.ordersMeta.shown = state.orders.length;
    }
    if (state.ordersLoadedAt) state.ordersLoadedAt = Date.now();
  }

  function orderCardHtml(o) {
    var money = has(o, 'totalExVat')
      ? '<div class="oc-money">' +
          '<span>' + T.formatVnd(o.totalExVat) + '<em> chưa VAT</em></span>' +
          '<span>' + T.formatVnd(o.totalIncVat) + '<em> có VAT</em></span>' +
        '</div>'
      : '';

    var meta = [
      T.formatDate(o.orderDate),
      o.po ? 'PO ' + T.esc(o.po) : ''
    ].filter(Boolean).join(' · ');

    // UI request, 2026-08-26: line count is a key at-a-glance number — a
    // filled circle badge (style A), grouped with the order id on the left
    // (position 3, chosen after seeing it live) — "this order, N lines"
    // reads before status/customer. Just the number, no unit word (the
    // badge shape + position already say "this is a count"); the title
    // attribute still spells it out for anyone who hovers/long-presses.
    var linesChip = '<span class="oc-lines" title="' + o.lineCount + ' dòng">' + o.lineCount + '</span>';

    // Milestone 3 / 3.5, redesigned 2026-08-31 (style E1): a <select>
    // can't nest inside a <button> (invalid HTML — buttons may not contain
    // interactive content), and the status pill itself is now the
    // quick-status control, so the id/lines area and the customer/meta/
    // money area are two SEPARATE sibling buttons, with the pill sitting
    // between them as its own element (plain span, or pill+overlaid
    // <select> when o.canChangeStatus) — never nested inside either button.
    // Milestone 3 / 3.5 — while a status change on THIS order is in
    // flight, both navigable buttons are disabled (not just blocked in JS):
    // gives a visible cue and stops focus/keyboard activation, not just
    // clicks.
    // Approve-action in-flight also disables the card's open buttons —
    // same reasoning as a status change: the server hasn't confirmed the
    // new approveStatus yet, and opening the (possibly stale) detail view
    // invites acting on it again before the change actually lands.
    var updating = !!state.statusUpdatingIds[o.orderId] || !!state.approveUpdatingIds[o.orderId];
    var openAttrs = updating ? ' disabled' : '';

    // UI revision (2026-09-02, "Option N"; 2026-09-03, "Option A") —
    // approve status, always shown (spec point 2) once the flag is on,
    // fused directly onto the order id (see fusedOrderIdHtml above) and —
    // when at least one approve action is available — clickable as the
    // quick-action trigger for it, same component and behaviour as the
    // detail title. Buttons cannot nest (invalid HTML), so as soon as the
    // marker is actionable it has its own <button>/<div> inside it and
    // must sit OUTSIDE oc-open-id, the same way statusQuickPillHtml's
    // pill+<select> already does — only the plain, non-interactive marker
    // (or the plain id text, flag off) is safe to draw inside the button.
    // has(o, 'approveStatus') is really just a config-flag guard here since
    // the field is server-side ALWAYS_VISIBLE, but keeping the has() check
    // means a pre-migration/flag-off response (field simply absent)
    // degrades to a plain id — no stray marker.
    var approveOn = approveStatusEnabled() && has(o, 'approveStatus');
    var approvePending = !!state.approveUpdatingIds[o.orderId];
    // Locking, point 1 (2026-09-03 feedback) — the business-status
    // quick-select and the approve-menu trigger act on the same order at
    // the same time, so firing one while the other is still resolving
    // risks a real conflict (e.g. approving an order whose status just
    // changed under it). Same-order-only lock, per Phong's answer: while
    // THIS order's status quick-change is in flight, its approve marker
    // is drawn as plain/non-interactive (no actions passed in at all —
    // same "no actions" branch fusedOrderIdHtml already has), and
    // vice versa below in statusQuickPillHtml. Other orders in the list
    // are unaffected.
    var statusPendingSameOrder = !!state.statusUpdatingIds[o.orderId];
    var idActions = (approveOn && !statusPendingSameOrder) ? approveActionsFor(o) : [];
    var idIsActionable = !approvePending && idActions.length > 0;
    var idHtml = approveOn
      ? fusedOrderIdHtml(T.esc(o.orderId), o.approveStatus, 'oc-id', idActions, o.orderId,
                        state.approveMenuOpenFor === o.orderId, approvePending)
      : '<span class="oc-id">' + T.esc(o.orderId) + '</span>';

    return '' +
      '<div class="order-card' + (updating ? ' order-card--updating' : '') + '">' +
        '<div class="oc-top">' +
          (idIsActionable
            ? '<span class="oc-top-left">' + idHtml +
                '<button type="button" class="oc-open oc-open-id" data-open="' + T.esc(o.orderId) + '"' + openAttrs + '>' +
                  linesChip +
                '</button>' +
              '</span>'
            : '<button type="button" class="oc-open oc-open-id" data-open="' + T.esc(o.orderId) + '"' + openAttrs + '>' +
                '<span class="oc-top-left">' + idHtml + linesChip + '</span>' +
              '</button>') +
          statusQuickPillHtml(o) +
        '</div>' +
        '<button type="button" class="oc-open oc-open-rest" data-open="' + T.esc(o.orderId) + '"' + openAttrs + '>' +
          '<div class="oc-customer">' + T.esc(o.customer) + '</div>' +
          '<div class="oc-meta">' + meta + '</div>' +
          money +
        '</button>' +
      '</div>';
  }

  /**
   * Milestone 3 / 3.5, style E1 (chosen 2026-08-31) — the status pill
   * itself is the quick-status control: a small pencil icon (currentColor,
   * matching that pill's own status color) trails the label, and a
   * transparent <select> is overlaid on top of the pill to capture the
   * click/tap. Only drawn as interactive when the server already said this
   * user may act on THIS order (o.canChangeStatus — mayAct_'s permission+
   * ownership check, mirrored from canEdit/canDelete); the server re-checks
   * change_status and ownership again on the actual apiChangeStatus call
   * regardless — this flag only decides whether to draw the control.
   * Otherwise it's the same plain, non-interactive pill as before.
   */
  function statusQuickPillHtml(o) {
    // Milestone 3 / 3.5 — while this order's status change is in flight,
    // show a pending pill (spinner dot + "Đang cập nhật…") instead of the
    // normal label+pencil, and drop the overlaid <select> entirely so a
    // second change can't be queued on top of the first before it resolves.
    if (state.statusUpdatingIds[o.orderId]) {
      return '<span class="' + statusPillClass(o.status) + ' status-pill--pending">' +
        '<span class="pill-spinner" aria-hidden="true"></span>Đang cập nhật…' +
        '</span>';
    }
    // Locking, point 1 (2026-09-03 feedback) — same-order lock, mirror of
    // idActions above: while an approve action on THIS order is in
    // flight, the status quick-select is dropped (plain pill, no overlay)
    // so the two can't fire on top of each other. No spinner here — the
    // status itself isn't what's changing, the pill just isn't a control
    // right now.
    var approvePendingSameOrder = !!state.approveUpdatingIds[o.orderId];
    var pill = '<span class="' + statusPillClass(o.status) + '">' + T.esc(statusLabel(o.status));
    if (!o.canChangeStatus || approvePendingSameOrder) return pill + '</span>';
    pill += PENCIL_ICON_SVG + '</span>';
    var options = statusList().map(function (s) {
      return '<option value="' + T.esc(s.key) + '"' + (s.key === o.status ? ' selected' : '') + '>' +
             T.esc(s.label) + '</option>';
    }).join('');
    return '' +
      '<span class="pill-wrap">' +
        pill +
        '<select class="pill-select" data-act="quick-status" data-order="' + T.esc(o.orderId) + '">' +
          options +
        '</select>' +
      '</span>';
  }

  /* =====================================================================
     Form — create and edit share one screen
     ===================================================================== */

  function openForm(orderId) {
    // L2: any in-flight list response must not yank the user back to the list.
    var seq = ++viewSeq;

    if (!orderId) {
      var money = seesMoney();
      // customer / orderDate / status are the minimum needed to identify and
      // save an order at all, so they're always present regardless of
      // visible_fields (same as the server's validateOrderPayload_, which
      // always requires them). Everything else here is optional and gated
      // by fieldAllowed_ — a role missing e.g. po from visible_fields must
      // not even see a blank PO box on a brand new order.
      state.order = {
        orderId: '', customer: '', orderDate: today(),
        status: statusList()[0].key,
        canEdit: true, canDelete: false, canChangeStatus: true
      };
      if (fieldAllowed_('po')) state.order.po = '';
      if (fieldAllowed_('poNote')) state.order.poNote = '';
      if (fieldAllowed_('statusNote')) state.order.statusNote = '';
      if (fieldAllowed_('supplierName')) state.order.supplierName = '';
      if (money) {
        state.order.customerDeposit = '';
        state.order.supplierPaid = '';
      }
      state.lines = [blankLine()];
      state.editing = true;
      state.hiddenMoney = !money;
      paintForm();
      return;
    }

    var cached = orderCache[orderId];
    if (cached) {
      // D1: paint the cached order immediately — instant reopen.
      applyOrderData(cached.data);
      paintForm();
      if (Date.now() - cached.loadedAt < DETAIL_CACHE_TTL_MS) return; // still fresh, no API call
      fetchOrder(orderId)
        .then(function (data) {
          if (seq !== viewSeq) return; // user left this order while we revalidated
          applyOrderData(data);
          paintForm();
        })
        .catch(function () {}); // silent: the cached (if stale) data stays on screen
      return;
    }

    root.innerHTML = detailSkeletonHtml();
    fetchOrder(orderId)
      .then(function (data) {
        if (seq !== viewSeq) return; // user went back or opened another order
        applyOrderData(data);
        paintForm();
      })
      .catch(function (err) {
        if (seq !== viewSeq) return;
        T.toast(err.message, true);
        showList();
      });
  }

  /** The one place apiGetOrder is called. Always refreshes orderCache on
   *  success so the next open of this order — and any write's response —
   *  stays in sync. */
  function fetchOrder(orderId) {
    return T.call('apiGetOrder', orderId).then(function (data) {
      orderCache[orderId] = { data: data, loadedAt: Date.now() };
      return data;
    });
  }

  /**
   * Bug fix, Milestone 2.5c follow-up: this used to assign `data.order`
   * directly into state, which meant state.order and the object cached in
   * orderCache[orderId].data.order were the SAME object. Since collect()
   * mutates state.order in place (`o.po = get('#f-po')`, etc.) on every
   * add-line / del-line / save, that mutation silently corrupted the cache
   * entry too — including for fields the DOM stub or a render race left
   * empty for a moment. A shallow copy here is what actually makes the
   * cache read-only from the form's point of view.
   */
  function applyOrderData(data) {
    state.order = shallowCopy(data.order);
    state.lines = (data.lines || []).map(normalizeLine);
    if (!state.lines.length) state.lines = [blankLine()];
    state.hiddenMoney = !!data.hiddenMoney;
    state.editing = !!data.order.canEdit;
  }

  function shallowCopy(obj) {
    var out = {};
    if (obj) Object.keys(obj).forEach(function (k) { out[k] = obj[k]; });
    return out;
  }

  // description / qty are always required (validateLine_ rejects a line
  // without them), so they're unconditional here, same reasoning as
  // customer/orderDate/status on the order itself. Everything else is
  // optional and gated by fieldAllowed_ so a role missing e.g. productCode
  // from visible_fields never sees a blank "Mã hàng" box on a new line.
  function blankLine() {
    var l = { lineId: '', description: '', qty: '' };
    if (fieldAllowed_('productCode')) l.productCode = '';
    if (fieldAllowed_('uom')) l.uom = uomList()[0] || '';
    if (!state.hiddenMoney) { l.unitPrice = ''; l.vatRate = vatRates()[0]; }
    if (fieldAllowed_('invoiceNo')) { l.invoiceNo = ''; l.invoiceDate = ''; }
    if (fieldAllowed_('note')) l.note = '';
    return l;
  }

  /**
   * Preserves whether the SERVER included a field at all (has(line, field)),
   * rather than always manufacturing every key with a '' fallback — the old
   * version did that, which erased the difference between "blank" and
   * "this role never received this field", so lineHtml() had nothing to
   * gate visibility on. Only lineId/description/qty/unitPrice/vatRate are
   * unconditional (required, or already governed by state.hiddenMoney).
   */
  function normalizeLine(line) {
    var out = {
      lineId: line.lineId || '',
      description: line.description || '',
      qty: has(line, 'qty') ? line.qty : ''
    };
    if (has(line, 'productCode')) out.productCode = line.productCode || '';
    if (has(line, 'uom')) out.uom = line.uom || '';
    if (has(line, 'unitPrice')) out.unitPrice = line.unitPrice;
    if (has(line, 'vatRate')) out.vatRate = line.vatRate;
    else if (!state.hiddenMoney) out.vatRate = vatRates()[0];
    if (has(line, 'invoiceNo')) {
      out.invoiceNo = line.invoiceNo || '';
      out.invoiceDate = dateInputValue(line.invoiceDate);
    }
