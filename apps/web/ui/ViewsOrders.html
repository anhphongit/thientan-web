<script>
/**
 * ViewsOrders.html — order list and the multi-line order form (Milestone 2).
 *
 * Two screens, one module: a list of cards, and a form used for both create and
 * edit. Everything it decides is cosmetic — which buttons to draw, what to show
 * as a total while typing. THIENTAN-API recomputes every đồng and re-checks
 * every permission on save.
 *
 * Cards, not a table: the Admin is on a PC but the staff are on phones, and a
 * seven-column table on a 360px screen is unusable.
 */
(function () {
  'use strict';

  /**
   * The TT bridge is assigned in render(), NOT here.
   *
   * ui/Index.html includes this file BEFORE ui/App.html, so at the moment this
   * IIFE runs `window.TT` does not exist yet. Capturing it here left T undefined
   * forever: showList() painted "Đang tải đơn hàng..." and then threw on the very
   * next line, so the screen hung on the loading text with no error and no
   * "Tạo đơn hàng" button. Found live on 2026-08-20.
   *
   * A view module must not touch window.TT at load time. Read it in render(),
   * which only runs after the whole page has parsed.
   */
  var T = null;
  var root = null;
  var state = {
    orders: [], ordersMeta: null, ordersLoadedAt: 0, refreshing: false,
    ordersPage: 0, ordersHasMore: false, loadingMore: false,
    // Milestone 3 / 3.2-3.3 — server-side filters. '' means "no filter" for
    // each field; they combine as AND. Kept separate from the list cache:
    // any change resets orders/loadedAt so the next fetch always goes to the
    // API, filters included.
    filters: { month: '', customer: '', status: '', createdBy: '', q: '' },
    // Milestone 3 / 3.4 fix — the LIVE text of the search box, separate from
    // state.filters.q (the last value actually searched for). Every repaint
    // (toggling the filter panel, "Làm mới", background refreshes...)
    // re-renders the search input's value from this, never from
    // state.filters.q directly, so nothing you're mid-typing gets wiped by
    // an unrelated repaint. See submitSearch().
    searchDraft: '',
    // Milestone 3 / 3.3 — createdBy dropdown data (view_all_orders only).
    // null = not fetched yet; [] is a valid "nobody yet" answer.
    creators: null, creatorsLoading: false,
    // Milestone 3 / 3.2-3.4 UI, "Bảng lọc thu gọn" — purely a display toggle
    // for the panel of dropdowns; never read by fetchOrders()/listPayload().
    filterPanelOpen: false,
    order: null, lines: [],
    editing: false, hiddenMoney: false, bound: false,
    // Milestone 2.5c follow-up — one order-detail mutation in flight at a
    // time: null | 'saving' | 'deleting' | 'reloading'. Everything that can
    // change this order (save, delete, force-reload) checks isBusy() first,
    // and the whole form is rendered locked while it is set — see
    // paintForm()/isBusy() below.
    busyAction: null
  };

  function isBusy() { return !!state.busyAction; }

  /** Milestone 2.5 / P4 — mirrors LIST_PAGE_SIZE_DEFAULT in the API's Config.gs. */
  var PAGE_SIZE = 20;

  /**
   * Milestone 2.5b / L1 — how long a successful list fetch stays "fresh".
   * While fresh, showList() paints from cache and does NOT call the API
   * (no silentRefresh). "Làm mới" always forces a fetch. Create/edit/delete
   * reset the timestamp via upsert/remove so the user's own writes stay
   * visible without a round trip.
   */
  var LIST_CACHE_TTL_MS = 60000;

  /**
   * Milestone 2.5c / D1 — order-detail cache, mirroring LIST_CACHE_TTL_MS.
   * Keyed by orderId: { data: {order, lines, hiddenMoney}, loadedAt }.
   * Reopening the same order within the TTL paints from cache with zero API
   * calls; past the TTL, paints the cached data immediately then silently
   * revalidates in the background — same shape as the list's L1/P2.
   *
   * This does not add a new staleness risk to editing: actionUpdateOrder_
   * has never guarded saves with an updatedAt/version check (it only
   * re-reads inside the lock to reconcile line ids), so two overlapping
   * edits already last-write-win today regardless of how the form got its
   * data — a form simply left open for ten minutes carries the same risk
   * already. A 60s cache does not meaningfully change that envelope.
   */
  var DETAIL_CACHE_TTL_MS = 60000;
  var orderCache = {};

  /**
   * Milestone 2.5 / P2 — the in-flight page-1 apiListOrders promise, shared so
   * a background revalidation, a manual refresh and the P3 boot prefetch never
   * fire three overlapping requests for the same data. "Xem thêm" (P4) is a
   * separate, independently-guarded request — see loadMorePromise below —
   * since appending page 2 is a different operation from replacing page 1.
   */
  var loadingPromise = null;
  var loadMorePromise = null;

  /**
   * Milestone 2.5b / L2 — only-latest-wins.
   * Bumped on every navigation that changes what should be on screen
   * (showList, openForm). Async callbacks capture the seq at start; if it no
   * longer matches when they resolve, they discard the result and do not
   * paint. Network calls are not aborted (UrlFetchApp cannot cancel); only
   * the UI effect is ignored.
   */
  var viewSeq = 0;

  /* ---------------- config helpers ---------------- */

  function config() { return T.config() || {}; }

  function statusList() {
    var list = config().statusList;
    return (list && list.length) ? list : [{ key: 'draft', label: 'Nháp' }];
  }

  function statusLabel(key) {
    var found = statusList().filter(function (s) { return s.key === key; })[0];
    return found ? found.label : (key || '');
  }

  /**
   * UI request, 2026-08-26: statuses must be tellable apart "at a glance",
   * not only by reading the label — so each known workflow step gets its own
   * colour AND its own left-edge dot/shape (colour-blind users, or anyone
   * scanning fast, still get a second signal). Keyed on the fixed 8-status
   * workflow this app ships with (see CONFIG_DEFAULTS in apps/api/Config.gs);
   * an admin who adds a new status key via the Config sheet falls back to
   * the neutral "default" style below rather than breaking.
   */
  var STATUS_STYLE = {
    draft: 'draft',
    confirmed: 'confirmed',
    waiting_stock: 'waiting',
    stock_arrived: 'arrived',
    delivered_not_invoiced: 'delivered',
    invoiced_unpaid: 'invoiced',
    paid: 'paid',
    cancelled: 'cancelled'
  };

  function statusPillClass(key) {
    return 'status-pill status-pill--' + (STATUS_STYLE[key] || 'default');
  }

  /**
   * Mirror of MONEY_FIELDS in the API's Config.gs. Used only to decide whether
   * to draw price inputs — the server still filters what it sends and refuses
   * what it must. A mismatch here costs a redundant field, never a leak.
   */
  var MONEY_FIELDS = ['unitPrice', 'vatRate', 'amountExVat', 'amountIncVat',
                      'totalExVat', 'totalIncVat', 'customerDeposit', 'supplierPaid'];

  function seesMoney() {
    var s = T.session();
    var allowed = (s && s.permissions && s.permissions.visible_fields) || [];
    if (allowed.length === 1 && allowed[0] === '*') return true;
    return MONEY_FIELDS.some(function (f) { return allowed.indexOf(f) >= 0; });
  }

  /**
   * Per-field visible_fields check, mirroring fieldVisible_() in the API's
   * Orders.gs. Money fields keep their own coarser seesMoney() (any money
   * field visible → draw all price inputs); this is for the other optional
   * fields (po, poNote, statusNote, supplierName, and per-line productCode /
   * uom / invoiceNo+invoiceDate / note): a field this user cannot see must
   * not be drawn on the form at all, not merely left to render blank. Only
   * used when there is no server response yet to read has(o, field) from —
   * i.e. building a brand new order/line. Once real data exists, has(o,
   * field) is the source of truth (the server already applied this same
   * rule when it decided what to include in the response).
   */
  function fieldAllowed_(field) {
    var s = T.session();
    var allowed = (s && s.permissions && s.permissions.visible_fields) || [];
    if (allowed.length === 1 && allowed[0] === '*') return true;
    return allowed.indexOf(field) >= 0;
  }

  function uomList() { return config().uomList || []; }
  function vatRates() { return config().vatRates || [0.08, 0.1]; }
  function customerList() { return config().customerList || []; }

  /* ---------------- value helpers ---------------- */

  /** Money arrives from the sheet as a number and from an input as "1.200.000". */
  function digits(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[^\d]/g, '');
  }

  function moneyValue(value) {
    var d = digits(value);
    return d ? parseInt(d, 10) : 0;
  }

  function groupDigits(value) {
    var d = digits(value);
    return d ? parseInt(d, 10).toLocaleString('vi-VN') : '';
  }

  function qtyValue(value) {
    var parsed = parseFloat(String(value === null || value === undefined ? '' : value)
      .replace(',', '.'));
    return isFinite(parsed) ? parsed : 0;
  }

  /** <input type="date"> wants yyyy-MM-dd; the sheet sends an ISO datetime. */
  function dateInputValue(value) {
    if (!value) return '';
    var d = (value instanceof Date) ? value : new Date(value);
    if (isNaN(d.getTime())) return '';
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function today() { return dateInputValue(new Date()); }

  function has(record, field) {
    return record && Object.prototype.hasOwnProperty.call(record, field);
  }

  /* =====================================================================
     List
     ===================================================================== */

  function render(container) {
    T = window.TT;
    root = container;
    if (!state.bound) {
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('blur', onBlur, true);
      root.addEventListener('keydown', onKeydown);
      state.bound = true;
    }
    showList();
  }

  /**
   * Milestone 2.5 / P3 — called once from App.html right after the session
   * loads, before the user has ever opened "Đơn hàng". Warms `state.orders`
   * so the tab is already instant the first time it's actually clicked.
   *
   * Safe to call whether or not render() has ever run: it only touches
   * `state` and `T`, never the DOM. Silent on failure — showList() will just
   * try again (and can show the real error) when the tab is opened for real.
   */
  function prefetch() {
    if (!window.TT || !window.TT.can('view_orders')) return;
    if (!T) T = window.TT;
    // L3: never stack a prefetch on top of an in-flight list fetch, a warm
    // cache, or a user who already opened the tab (render sets bound).
    if (state.orders.length || loadingPromise || state.refreshing) return;
    if (state.bound && root && state.order === null && root.innerHTML) return;
    fetchOrders().catch(function () {});
  }

  /** True when we have list data and it is still within LIST_CACHE_TTL_MS. */
  function cacheIsFresh() {
    return !!(state.orders.length && state.ordersLoadedAt &&
      (Date.now() - state.ordersLoadedAt) < LIST_CACHE_TTL_MS);
  }

  /**
   * Milestone 2.5 / P2 + P3 + L1 + L2.
   *
   *   - cache warm AND still within LIST_CACHE_TTL_MS (L1):
   *     paint immediately, do NOT call the API.
   *   - cache warm but stale: paint immediately, then silentRefresh.
   *   - a fetch is already in flight (prefetch racing a fast click): show
   *     the skeleton and ride that same promise instead of firing a second
   *     request.
   *   - nothing yet: show the skeleton and start the fetch.
   *
   * L2: bumps viewSeq so any in-flight detail response is discarded.
   */
  function showList() {
    var seq = ++viewSeq;
    state.order = null;
    ensureCreatorsLoaded();

    if (state.orders.length) {
      paintList();
      // L1: only revalidate when the cache has gone stale. Fresh cache =
      // paint only, zero API calls. "Làm mới" still forces a fetch.
      if (!cacheIsFresh()) silentRefresh(seq);
      return;
    }

    root.innerHTML = skeletonHtml();
    (loadingPromise || fetchOrders())
      .then(function () {
        if (seq !== viewSeq) return;
        paintList();
      })
      .catch(function (err) {
        if (seq !== viewSeq) return;
        root.innerHTML = '<section class="card"><p class="empty err-text">' +
          T.esc(err.message) + '</p></section>';
      });
  }

  /**
   * The one place apiListOrders is called for PAGE 1. Shared via
   * `loadingPromise` so overlapping callers (prefetch, silent refresh, the
   * manual "Làm mới" button) never fire duplicate requests. Always replaces
   * `state.orders` from the top — see loadMore() for appending page 2+.
   */
  function listPayload(page) {
    var payload = { page: page, pageSize: PAGE_SIZE };
    if (state.filters.month) payload.month = state.filters.month;
    if (state.filters.customer) payload.customer = state.filters.customer;
    if (state.filters.status) payload.status = state.filters.status;
    if (state.filters.createdBy) payload.createdBy = state.filters.createdBy;
    if (state.filters.q) payload.q = state.filters.q;
    return payload;
  }

  function hasActiveFilters() {
    var f = state.filters;
    return !!(f.month || f.customer || f.status || f.createdBy || f.q);
  }

  /**
   * Milestone 3 / 3.4 UI fix, Phong's spec 2026-08-31:
   *   (a) empty search box → button disabled
   *   (b) box matches the already-applied query → button disabled (nothing
   *       new to search for)
   *   (c) box holds a different, non-empty query → button enabled
   * Read at paint time (drives the `disabled` attribute) AND on every
   * keystroke (onInput toggles the live button directly — see below) so the
   * two never drift.
   */
  function canSubmitSearch() {
    var draft = (state.searchDraft || '').trim();
    return !!draft && draft !== (state.filters.q || '');
  }

  /** Minimal magnifier glass, matches the app's line-icon-free style —
   *  currentColor so .btn-icon's CSS (brand when enabled, muted when
   *  disabled) drives its color, no separate SVG fill/stroke to keep in sync. */
  var SEARCH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>';

  /**
   * Milestone 3 / 3.3 — createdBy dropdown data. Fetched once, lazily, only
   * for a caller who can see everyone's orders (apiListOrderCreators returns
   * an empty list for anyone else anyway, so there's nothing worth a request
   * for). Not gated behind the list cache/TTL machinery: this is small,
   * changes rarely (only when someone new creates their first order), and
   * re-fetching it is cheap compared to the order list itself.
   */
  function ensureCreatorsLoaded() {
    if (!T.can('view_all_orders')) return;
    if (state.creators !== null || state.creatorsLoading) return;
    state.creatorsLoading = true;
    T.call('apiListOrderCreators', {}).then(function (data) {
      state.creators = (data && data.creators) || [];
      state.creatorsLoading = false;
      if (state.order === null) paintList(); // repaint the filter bar now that options exist
    }).catch(function (err) {
      // Bug found live 2026-08-31: leaving state.creators === null here made
      // the dropdown show "Đang tải người tạo…" forever on any failure (a
      // stale deployment missing the endpoint, a network blip) with no way
      // to notice or recover. Fall back to an empty (but usable) dropdown —
      // every OTHER filter still works — and surface the error once instead
      // of failing silently forever.
      state.creators = [];
      state.creatorsLoading = false;
      T.toast('Không tải được danh sách người tạo: ' + err.message, true);
      if (state.order === null) paintList();
    });
  }

  function fetchOrders() {
    if (loadingPromise) return loadingPromise;
    // Milestone 3 / 3.2-3.3: stamp the request with the filters in effect
    // when it was made. applyFilters()/clearFilters() cannot cancel an
    // in-flight apiListOrders call (UrlFetchApp has no abort), so a slow
    // request made under OLD filters must not be allowed to overwrite
    // state.orders once newer filters have already reset it — checked below.
    var filtersAtRequest = JSON.stringify(state.filters);
    loadingPromise = T.call('apiListOrders', listPayload(1)).then(
      function (data) {
        loadingPromise = null;
        if (filtersAtRequest !== JSON.stringify(state.filters)) return data; // superseded by newer filters
        state.orders = (data && data.orders) || [];
        state.ordersMeta = { total: (data && data.total) || 0, shown: state.orders.length };
        state.ordersPage = 1;
        state.ordersHasMore = !!(data && data.hasMore);
        state.ordersLoadedAt = Date.now();
        return data;
      },
      function (err) { loadingPromise = null; throw err; }
    );
    return loadingPromise;
  }

  /**
   * Milestone 3 / 3.2-3.3 — applying or clearing filters is a deliberate
   * navigation, same spirit as manualRefresh(): drop whatever is cached (a
   * stale unfiltered or differently-filtered page must never be shown under
   * the new filters) and fetch page 1 fresh. Cheap at this data volume
   * (≤ 100 orders/month) to just always hit the API rather than keep a
   * per-filter-combination cache client-side.
   *
   * `next` only needs to carry the fields that changed; anything omitted
   * keeps its current value.
   */
  function applyFilters(next) {
    var merged = Object.assign({}, state.filters, next || {});
    // Bug found live 2026-08-31: 'q' was missing from this list, so any
    // call that only changed the search query (submitSearch(), the "✕" on
    // the search chip) saw `changed === false` and returned before ever
    // updating state.filters or re-fetching — the enabled, clickable search
    // button did nothing because THIS check silently no-op'd it.
    var changed = ['month', 'customer', 'status', 'createdBy', 'q'].some(function (k) {
      return merged[k] !== state.filters[k];
    });
    if (!changed) return;
    state.filters = merged;
    state.orders = [];
    state.ordersMeta = null;
    state.ordersLoadedAt = 0;
    state.ordersPage = 0;
    state.ordersHasMore = false;
    state.loadingMore = false;
    loadMorePromise = null;
    showList();
  }

  function clearFilters() {
    // Same bug's other half: 'q' was missing here too, so "Xóa lọc" cleared
    // every dropdown filter but left the search query actually applied
    // (state.filters.q) untouched, even though the chip/input looked cleared.
    applyFilters({ month: '', customer: '', status: '', createdBy: '', q: '' });
  }

  /**
   * Milestone 2.5 / P4 — "Xem thêm": fetch the next page and append it.
   * Independent of fetchOrders()/loadingPromise (a page-1 replace is a
   * different operation from a page-N append) but mutually exclusive with
   * it in practice — see the guards in silentRefresh()/manualRefresh() below
   * — so a background refresh can never land mid-append and interleave two
   * different views of the list.
   */
  function loadMore() {
    if (loadMorePromise || loadingPromise || !state.ordersHasMore) return;
    var seq = viewSeq; // do not bump — still on list; but ignore if user leaves
    state.loadingMore = true;
    paintList();

    var nextPage = state.ordersPage + 1;
    loadMorePromise = T.call('apiListOrders', listPayload(nextPage))
      .then(function (data) {
        if (seq !== viewSeq) {
          state.loadingMore = false;
          loadMorePromise = null;
          return;
        }
        var seen = {};
        state.orders.forEach(function (o) { seen[o.orderId] = true; });
        ((data && data.orders) || []).forEach(function (o) {
          if (!seen[o.orderId]) state.orders.push(o); // a save/delete may have shifted the page boundary
        });
        state.ordersMeta = { total: (data && data.total) || 0, shown: state.orders.length };
        state.ordersPage = nextPage;
        state.ordersHasMore = !!(data && data.hasMore);
        state.loadingMore = false;
        loadMorePromise = null;
        paintList();
      })
      .catch(function (err) {
        state.loadingMore = false;
        loadMorePromise = null;
        if (seq !== viewSeq) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  /**
   * Background revalidation for returning to an already-loaded list. Never
   * blanks the screen. Failure is silent on purpose: the cached list on
   * screen is still the last good one, and "Làm mới" remains available for
   * a deliberate retry — an unprompted error toast for a refresh nobody
   * asked for would just be noise.
   *
   * Skipped once more than one page is loaded, and while "Xem thêm" is in
   * flight: a silent background refresh only re-fetches page 1, so running
   * it against a deeper view would quietly truncate pages the user
   * deliberately loaded. A deliberate "Làm mới" click is allowed to do that
   * — see manualRefresh() — but a background one that nobody asked for
   * should never surprise like that.
   */
  function silentRefresh(seq) {
    // L3: one background revalidation at a time; never against a multi-page view
    if (state.refreshing || state.loadingMore || state.ordersPage > 1) return;
    if (seq == null) seq = viewSeq;
    state.refreshing = true;
    // rides loadingPromise when prefetch or another caller is already mid-flight
    fetchOrders()
      .then(function () {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        if (state.order) return; // user opened a detail while we were refreshing
        paintList();
      })
      .catch(function () { state.refreshing = false; });
  }

  /** The visible "Làm mới" button: spins in place, old list stays on screen,
   *  and a failure here IS reported — this one the user asked for. Resets to
   *  page 1, same as any "refresh" control — a deliberate click, so the
   *  surprise silentRefresh() avoids is acceptable here. */
  function manualRefresh() {
    if (state.refreshing || state.loadingMore) return;
    var seq = viewSeq; // stay on list; ignore result only if user navigated away
    state.refreshing = true;
    paintList();
    // L3: fetchOrders() coalesces with any in-flight page-1 request
    fetchOrders()
      .then(function () {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        paintList();
      })
      .catch(function (err) {
        state.refreshing = false;
        if (seq !== viewSeq) return;
        paintList();
        T.toast(err.message, true);
      });
  }

  function paintList() {
    root.innerHTML = listHtml();
  }

  function listHtml() {
    var canCreate = T.can('create_order');
    var head = '' +
      '<div class="view-head">' +
        '<h2>Đơn hàng</h2>' +
        (canCreate ? '<button type="button" class="btn btn-primary" data-act="new">+ Tạo đơn hàng</button>' : '') +
      '</div>' +
      filterBarHtml();

    if (!state.orders.length) {
      var emptyText = hasActiveFilters()
        ? 'Không có đơn hàng nào khớp với bộ lọc đã chọn.'
        : (canCreate ? 'Chưa có đơn hàng nào. Bấm “Tạo đơn hàng” để bắt đầu.'
                     : 'Chưa có đơn hàng nào.');
      return head + '<section class="card"><p class="empty">' + emptyText + '</p></section>';
    }

    var meta = state.ordersMeta || { shown: state.orders.length, total: state.orders.length };
    var count = '' +
      '<p class="list-count">' +
        'Hiển thị ' + meta.shown + ' / ' + meta.total + ' đơn' +
        (updatedLabel() ? ' · ' + updatedLabel() : '') + ' · ' +
        '<button type="button" class="link-btn" data-act="refresh-list"' +
          (state.refreshing ? ' disabled' : '') + '>' +
          (state.refreshing ? 'Đang làm mới…' : 'Làm mới') +
        '</button>' +
      '</p>';

    var loadMoreBtn = state.ordersHasMore
      ? '<button type="button" class="btn btn-block" data-act="load-more"' +
          (state.loadingMore ? ' disabled' : '') + '>' +
          (state.loadingMore ? 'Đang tải thêm…' : 'Xem thêm') +
        '</button>'
      : '';

    return head + count + '<div class="order-list">' +
      state.orders.map(orderCardHtml).join('') + '</div>' + loadMoreBtn;
  }

  /**
   * Milestone 3 / 3.2-3.4 — "Bảng lọc thu gọn" + "Thẻ đang áp dụng" (Phong's
   * choice, 2026-08-31, over 4 sketched options): search box always visible;
   * a "Bộ lọc" toggle (state.filterPanelOpen, UI-only — never triggers a
   * fetch by itself) expands a stacked panel of dropdowns instead of
   * cramming everything into one wrapping row; once filters are applied
   * they show as removable chips under the search box, so clearing just
   * "Yamato" doesn't require reopening the panel to hunt for its dropdown.
   *
   * A native <input type="month"> opens a full DATE calendar on most
   * browsers/phones (day grid, just no day picked) for a filter that is only
   * ever a month — two plain dropdowns (month + year) read as "pick a
   * month" immediately and never show a day grid.
   */
  function filterBarHtml() {
    var month = state.filters.month || '';
    var parts = month.split('-');
    var selMonth = parts[0] ? parts[1] : '';
    var selYear = parts[0] ? parts[0] : '';
    var active = hasActiveFilters();

    return '' +
      '<div class="list-filter">' +
        '<div class="list-filter-row">' +
          '<input type="search" id="f-filter-q" class="list-filter-q" placeholder="Tìm mã đơn, PO, khách hàng, mô tả…" ' +
            'value="' + T.esc(state.searchDraft || '') + '">' +
          '<button type="button" class="btn-icon" data-act="submit-search" aria-label="Tìm kiếm"' +
            (canSubmitSearch() ? '' : ' disabled') + '>' + SEARCH_ICON_SVG + '</button>' +
          '<button type="button" class="filter-toggle' + (active ? ' has-active' : '') + '" data-act="toggle-filter-panel">' +
            (active ? '<span class="filter-dot"></span>' : '') + 'Bộ lọc' +
          '</button>' +
        '</div>' +
        chipsHtml() +
        (state.filterPanelOpen ? '' +
          '<div class="filter-panel">' +
            '<div class="filter-panel-pair">' +
              '<select id="f-filter-month">' + monthOptionsHtml(selMonth) + '</select>' +
              '<select id="f-filter-year">' + yearOptionsHtml(selYear) + '</select>' +
            '</div>' +
            (fieldAllowed_('customer') ? '<select id="f-filter-customer">' + customerOptionsHtml(state.filters.customer) + '</select>' : '') +
            (fieldAllowed_('status') ? '<select id="f-filter-status">' + statusOptionsHtml(state.filters.status) + '</select>' : '') +
            creatorFilterHtml() +
            '<div class="filter-panel-actions">' +
              '<button type="button" class="link-btn" data-act="clear-filter">Xóa lọc</button>' +
              '<button type="button" class="btn btn-filter" data-act="apply-filter">Áp dụng</button>' +
            '</div>' +
          '</div>'
        : '') +
      '</div>';
  }

  /**
   * One removable chip per active filter. `data-key` says which
   * `state.filters` field(s) to blank when its ✕ is clicked — month/year are
   * one filter (`month`) even though they're two dropdowns.
   */
  function chipsHtml() {
    var chips = [];
    if (state.filters.month) {
      var parts = state.filters.month.split('-');
      chips.push({ key: 'month', label: 'Tháng ' + parseInt(parts[1], 10) + '/' + parts[0] });
    }
    if (state.filters.customer) {
      chips.push({ key: 'customer', label: state.filters.customer });
    }
    if (state.filters.status) {
      chips.push({ key: 'status', label: statusLabel(state.filters.status) });
    }
    if (state.filters.createdBy) {
      var creator = (state.creators || []).filter(function (c) { return c.email === state.filters.createdBy; })[0];
      chips.push({ key: 'createdBy', label: creator ? creator.displayName : state.filters.createdBy });
    }
    if (state.filters.q) {
      chips.push({ key: 'q', label: 'Tìm: "' + state.filters.q + '"' });
    }
    if (!chips.length) return '';
    return '<div class="chip-row">' + chips.map(function (c) {
      return '<span class="chip">' + T.esc(c.label) +
        '<button type="button" data-act="remove-filter" data-key="' + c.key + '" aria-label="Bỏ lọc ' + T.esc(c.label) + '">✕</button>' +
      '</span>';
    }).join('') + '</div>';
  }

  /** Milestone 3 / 3.3. Empty option is always "Tất cả khách hàng" — unlike
   *  month, "no customer selected" is a real, common state, not an error. */
  function customerOptionsHtml(selected) {
    var out = '<option value="">Tất cả khách hàng</option>';
    customerList().forEach(function (c) {
      out += '<option value="' + T.esc(c) + '"' + (c === selected ? ' selected' : '') + '>' +
             T.esc(c) + '</option>';
    });
    return out;
  }

  function statusOptionsHtml(selected) {
    var out = '<option value="">Tất cả trạng thái</option>';
    statusList().forEach(function (s) {
      out += '<option value="' + T.esc(s.key) + '"' + (s.key === selected ? ' selected' : '') + '>' +
             T.esc(s.label) + '</option>';
    });
    return out;
  }

  /**
   * Milestone 3 / 3.3 — createdBy dropdown. Only drawn for a caller who can
   * see everyone's orders (see actionListOrderCreators_'s own gate); while
   * the list is still loading it degrades to a disabled placeholder rather
   * than not being there at all, so the filter bar's layout doesn't jump
   * once it arrives.
   */
  function creatorFilterHtml() {
    if (!T.can('view_all_orders')) return '';
    if (state.creators === null) {
      return '<select id="f-filter-createdBy" disabled><option>Đang tải người tạo…</option></select>';
    }
    var out = '<option value="">Tất cả người tạo</option>';
    state.creators.forEach(function (c) {
      out += '<option value="' + T.esc(c.email) + '"' + (c.email === state.filters.createdBy ? ' selected' : '') + '>' +
             T.esc(c.displayName) + '</option>';
    });
    return '<select id="f-filter-createdBy">' + out + '</select>';
  }

  function monthOptionsHtml(selected) {
    var out = '<option value="">Tháng</option>';
    for (var m = 1; m <= 12; m++) {
      var v = (m < 10 ? '0' : '') + m;
      out += '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>Tháng ' + m + '</option>';
    }
    return out;
  }

  /** Current year, plus a couple back and one ahead — plenty for a ≤100
   *  orders/month shop that has been running since 2026 (Q7, OPEN_QUESTIONS.md). */
  function yearOptionsHtml(selected) {
    var current = new Date().getFullYear();
    var out = '<option value="">Năm</option>';
    for (var y = current + 1; y >= current - 3; y--) {
      out += '<option value="' + y + '"' + (String(y) === selected ? ' selected' : '') + '>' + y + '</option>';
    }
    return out;
  }

  function updatedLabel() {
    if (!state.ordersLoadedAt) return '';
    var d = new Date(state.ordersLoadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'cập nhật lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** Milestone 2.5 / P3 — placeholder cards for a genuine first load, so it
   *  reads as "loading" instead of a frozen blank screen. */
  function skeletonHtml() {
    var card = '' +
      '<div class="order-card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</div>';
    return '' +
      '<div class="view-head"><h2>Đơn hàng</h2></div>' +
      '<div class="order-list">' + card + card + card + '</div>';
  }

  /** Milestone 2.5c / D1 — same idea as skeletonHtml() (P3), for a genuine
   *  first open of one order instead of a blocking "Đang mở đơn hàng..." line. */
  function detailSkeletonHtml() {
    return '' +
      '<div class="view-head"><h2>Đang mở đơn hàng...</h2></div>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w40"></div>' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w50"></div>' +
      '</section>' +
      '<section class="card skeleton" aria-hidden="true">' +
        '<div class="sk-line sk-w70"></div>' +
        '<div class="sk-line sk-w40"></div>' +
      '</section>';
  }

  /**
   * Milestone 2.5 / P2 — write-through cache update after a create/edit, so
   * the next "← Danh sách" is instant AND already correct: no waiting on a
   * network round trip just to see your own save. A no-op before any list
   * has ever loaded — nothing cached yet to keep in sync.
   */
  function upsertCachedOrder(order, lineCount) {
    if (!state.ordersLoadedAt) return;
    var card = {};
    Object.keys(order).forEach(function (k) { card[k] = order[k]; });
    card.lineCount = lineCount;

    var i = -1;
    for (var j = 0; j < state.orders.length; j++) {
      if (state.orders[j].orderId === order.orderId) { i = j; break; }
    }
    if (i >= 0) state.orders[i] = card;
    else state.orders.unshift(card);

    if (state.ordersMeta) {
      if (i < 0) state.ordersMeta.total += 1;
      state.ordersMeta.shown = state.orders.length;
    }
    // L1: own write keeps the cache "fresh" so the next back-navigation
    // does not immediately trigger a silentRefresh.
    state.ordersLoadedAt = Date.now();
  }

  /** Milestone 2.5 / P2 — same idea, for delete. */
  function removeCachedOrder(orderId) {
    var before = state.orders.length;
    state.orders = state.orders.filter(function (o) { return o.orderId !== orderId; });
    if (state.ordersMeta && state.orders.length !== before) {
      state.ordersMeta.total = Math.max(0, state.ordersMeta.total - 1);
      state.ordersMeta.shown = state.orders.length;
    }
    if (state.ordersLoadedAt) state.ordersLoadedAt = Date.now();
  }

  function orderCardHtml(o) {
    var money = has(o, 'totalExVat')
      ? '<div class="oc-money">' +
          '<span>' + T.formatVnd(o.totalExVat) + '<em> chưa VAT</em></span>' +
          '<span>' + T.formatVnd(o.totalIncVat) + '<em> có VAT</em></span>' +
        '</div>'
      : '';

    var meta = [
      T.formatDate(o.orderDate),
      o.po ? 'PO ' + T.esc(o.po) : ''
    ].filter(Boolean).join(' · ');

    // UI request, 2026-08-26: line count is a key at-a-glance number — a
    // filled circle badge (style A), grouped with the order id on the left
    // (position 3, chosen after seeing it live) — "this order, N lines"
    // reads before status/customer. Just the number, no unit word (the
    // badge shape + position already say "this is a count"); the title
    // attribute still spells it out for anyone who hovers/long-presses.
    var linesChip = '<span class="oc-lines" title="' + o.lineCount + ' dòng">' + o.lineCount + '</span>';

    return '' +
      '<button type="button" class="order-card" data-open="' + T.esc(o.orderId) + '">' +
        '<div class="oc-top">' +
          '<span class="oc-top-left">' +
            '<span class="oc-id">' + T.esc(o.orderId) + '</span>' +
            linesChip +
          '</span>' +
          '<span class="' + statusPillClass(o.status) + '">' + T.esc(statusLabel(o.status)) + '</span>' +
        '</div>' +
        '<div class="oc-customer">' + T.esc(o.customer) + '</div>' +
        '<div class="oc-meta">' + meta + '</div>' +
        money +
      '</button>';
  }

  /* =====================================================================
     Form — create and edit share one screen
     ===================================================================== */

  function openForm(orderId) {
    // L2: any in-flight list response must not yank the user back to the list.
    var seq = ++viewSeq;

    if (!orderId) {
      var money = seesMoney();
      // customer / orderDate / status are the minimum needed to identify and
      // save an order at all, so they're always present regardless of
      // visible_fields (same as the server's validateOrderPayload_, which
      // always requires them). Everything else here is optional and gated
      // by fieldAllowed_ — a role missing e.g. po from visible_fields must
      // not even see a blank PO box on a brand new order.
      state.order = {
        orderId: '', customer: '', orderDate: today(),
        status: statusList()[0].key,
        canEdit: true, canDelete: false, canChangeStatus: true
      };
      if (fieldAllowed_('po')) state.order.po = '';
      if (fieldAllowed_('poNote')) state.order.poNote = '';
      if (fieldAllowed_('statusNote')) state.order.statusNote = '';
      if (fieldAllowed_('supplierName')) state.order.supplierName = '';
      if (money) {
        state.order.customerDeposit = '';
        state.order.supplierPaid = '';
      }
      state.lines = [blankLine()];
      state.editing = true;
      state.hiddenMoney = !money;
      paintForm();
      return;
    }

    var cached = orderCache[orderId];
    if (cached) {
      // D1: paint the cached order immediately — instant reopen.
      applyOrderData(cached.data);
      paintForm();
      if (Date.now() - cached.loadedAt < DETAIL_CACHE_TTL_MS) return; // still fresh, no API call
      fetchOrder(orderId)
        .then(function (data) {
          if (seq !== viewSeq) return; // user left this order while we revalidated
          applyOrderData(data);
          paintForm();
        })
        .catch(function () {}); // silent: the cached (if stale) data stays on screen
      return;
    }

    root.innerHTML = detailSkeletonHtml();
    fetchOrder(orderId)
      .then(function (data) {
        if (seq !== viewSeq) return; // user went back or opened another order
        applyOrderData(data);
        paintForm();
      })
      .catch(function (err) {
        if (seq !== viewSeq) return;
        T.toast(err.message, true);
        showList();
      });
  }

  /** The one place apiGetOrder is called. Always refreshes orderCache on
   *  success so the next open of this order — and any write's response —
   *  stays in sync. */
  function fetchOrder(orderId) {
    return T.call('apiGetOrder', orderId).then(function (data) {
      orderCache[orderId] = { data: data, loadedAt: Date.now() };
      return data;
    });
  }

  /**
   * Bug fix, Milestone 2.5c follow-up: this used to assign `data.order`
   * directly into state, which meant state.order and the object cached in
   * orderCache[orderId].data.order were the SAME object. Since collect()
   * mutates state.order in place (`o.po = get('#f-po')`, etc.) on every
   * add-line / del-line / save, that mutation silently corrupted the cache
   * entry too — including for fields the DOM stub or a render race left
   * empty for a moment. A shallow copy here is what actually makes the
   * cache read-only from the form's point of view.
   */
  function applyOrderData(data) {
    state.order = shallowCopy(data.order);
    state.lines = (data.lines || []).map(normalizeLine);
    if (!state.lines.length) state.lines = [blankLine()];
    state.hiddenMoney = !!data.hiddenMoney;
    state.editing = !!data.order.canEdit;
  }

  function shallowCopy(obj) {
    var out = {};
    if (obj) Object.keys(obj).forEach(function (k) { out[k] = obj[k]; });
    return out;
  }

  // description / qty are always required (validateLine_ rejects a line
  // without them), so they're unconditional here, same reasoning as
  // customer/orderDate/status on the order itself. Everything else is
  // optional and gated by fieldAllowed_ so a role missing e.g. productCode
  // from visible_fields never sees a blank "Mã hàng" box on a new line.
  function blankLine() {
    var l = { lineId: '', description: '', qty: '' };
    if (fieldAllowed_('productCode')) l.productCode = '';
    if (fieldAllowed_('uom')) l.uom = uomList()[0] || '';
    if (!state.hiddenMoney) { l.unitPrice = ''; l.vatRate = vatRates()[0]; }
    if (fieldAllowed_('invoiceNo')) { l.invoiceNo = ''; l.invoiceDate = ''; }
    if (fieldAllowed_('note')) l.note = '';
    return l;
  }

  /**
   * Preserves whether the SERVER included a field at all (has(line, field)),
   * rather than always manufacturing every key with a '' fallback — the old
   * version did that, which erased the difference between "blank" and
   * "this role never received this field", so lineHtml() had nothing to
   * gate visibility on. Only lineId/description/qty/unitPrice/vatRate are
   * unconditional (required, or already governed by state.hiddenMoney).
   */
  function normalizeLine(line) {
    var out = {
      lineId: line.lineId || '',
      description: line.description || '',
      qty: has(line, 'qty') ? line.qty : ''
    };
    if (has(line, 'productCode')) out.productCode = line.productCode || '';
    if (has(line, 'uom')) out.uom = line.uom || '';
    if (has(line, 'unitPrice')) out.unitPrice = line.unitPrice;
    if (has(line, 'vatRate')) out.vatRate = line.vatRate;
    else if (!state.hiddenMoney) out.vatRate = vatRates()[0];
    if (has(line, 'invoiceNo')) {
      out.invoiceNo = line.invoiceNo || '';
      out.invoiceDate = dateInputValue(line.invoiceDate);
    }
    if (has(line, 'note')) out.note = line.note || '';
    return out;
  }

  function paintForm() {
    var o = state.order;
    var isNew = !o.orderId;
    var permRo = !state.editing;          // server says: this user cannot edit at all
    var busy = isBusy();                  // save/delete/reload in flight right now
    var fieldsLocked = permRo || busy;    // either reason locks every input the same way

    root.innerHTML = '' +
      '<div class="view-head">' +
        '<h2>' + (isNew ? 'Tạo đơn hàng' : 'Mã đơn ' + T.esc(o.orderId)) + '</h2>' +
        '<button type="button" class="link-btn" data-act="back"' +
          (busy ? ' disabled' : '') + '>← Danh sách</button>' +
      '</div>' +
      (isNew ? '' : detailFreshHtml(busy)) +
      (permRo ? '<p class="ro-note">Bạn chỉ có quyền xem đơn hàng này.</p>' : '') +
      headerCardHtml(o, fieldsLocked) +
      linesCardHtml(fieldsLocked) +
      totalsHtml() +
      actionsHtml(isNew, permRo, busy) +
      customerDatalistHtml();

    recalc();
  }

  /**
   * Milestone 2.5c / D1 follow-up — the detail-cache counterpart to the
   * list's "cập nhật lúc HH:mm · Làm mới" line (P2's staleness rule: cached
   * data must always say how old it is and offer a way to force a real
   * fetch). "Tải lại" bypasses the cache entirely — for when another user
   * changed this order while it sat cached or the form was left open, which
   * D1 accepted as an acceptable, bounded risk but should not leave silent.
   *
   * `busy` disables the button (and its confirm) while ANY order action is
   * in flight, not only a reload — see isBusy()/onClick()'s guard.
   */
  function detailFreshHtml(busy) {
    var reloadingNow = state.busyAction === 'reloading';
    return '' +
      '<p class="list-count">' +
        (detailFreshLabel() ? detailFreshLabel() + ' · ' : '') +
        '<button type="button" class="link-btn" data-act="reload-order"' +
          (busy ? ' disabled' : '') + '>' +
          (reloadingNow ? 'Đang tải lại…' : 'Tải lại') +
        '</button>' +
      '</p>' +
      '<span class="confirm-box hidden" data-role="confirm-reload">' +
        '<span>Bỏ thay đổi chưa lưu trên màn hình và tải bản mới nhất?</span>' +
        '<button type="button" class="btn-mini danger-link" data-act="do-reload"' +
          (busy ? ' disabled' : '') + '>Tải lại</button>' +
        '<button type="button" class="btn-mini" data-act="cancel-reload"' +
          (busy ? ' disabled' : '') + '>Không</button>' +
      '</span>';
  }

  function detailFreshLabel() {
    var entry = state.order && orderCache[state.order.orderId];
    if (!entry) return '';
    var d = new Date(entry.loadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'dữ liệu lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function headerCardHtml(o, ro) {
    var d = ro ? ' disabled' : '';
    // Status is locked on an existing order for someone without change_status:
    // the server refuses it anyway, and a control that always errors is a trap.
    var statusDisabled = (ro || (o.orderId && !o.canChangeStatus)) ? ' disabled' : '';

    return '' +
      '<section class="card">' +
        '<h3>Thông tin đơn</h3>' +
        '<div class="form-grid">' +
          field('Khách hàng *',
            '<input id="f-customer" list="customer-options" autocomplete="off" value="' +
            T.esc(o.customer) + '"' + d + '>') +
          field('Ngày đặt hàng *',
            '<input id="f-orderDate" type="date" value="' +
            T.esc(dateInputValue(o.orderDate) || today()) + '"' + d + '>') +
          (has(o, 'po')
            ? field('Số PO',
                // One free-text value, not a split field (Q3). It may hold
                // several numbers stacked on separate lines, as the reference
                // workbook does.
                '<textarea id="f-po" rows="2" placeholder="Ví dụ: 4600041936"' + d + '>' +
                T.esc(o.po) + '</textarea>') : '') +
          (has(o, 'poNote')
            ? field('Ghi chú về PO',
                '<input id="f-poNote" value="' + T.esc(o.poNote) +
                '" placeholder="PO tạm, chờ PO thật..."' + d + '>') : '') +
          field('Trạng thái',
            '<select id="f-status"' + statusDisabled + '>' +
              statusList().map(function (s) {
                return '<option value="' + T.esc(s.key) + '"' +
                  (s.key === o.status ? ' selected' : '') + '>' + T.esc(s.label) + '</option>';
              }).join('') +
            '</select>') +
          (has(o, 'statusNote')
            ? field('Ghi chú trạng thái',
                '<input id="f-statusNote" value="' + T.esc(o.statusNote) +
                '" placeholder="Hẹn giao 22/09..."' + d + '>') : '') +
          (has(o, 'customerDeposit')
            ? field('Khách đã cọc (VNĐ)',
                '<input id="f-customerDeposit" inputmode="numeric" class="money" value="' +
                T.esc(groupDigits(o.customerDeposit)) + '"' + d + '>') : '') +
          (has(o, 'supplierName')
            ? field('Nhà cung cấp',
                '<input id="f-supplierName" value="' + T.esc(o.supplierName) + '"' + d + '>') : '') +
          (has(o, 'supplierPaid')
            ? field('Đã trả nhà cung cấp (VNĐ)',
                '<input id="f-supplierPaid" inputmode="numeric" class="money" value="' +
                T.esc(groupDigits(o.supplierPaid)) + '"' + d + '>') : '') +
        '</div>' +
      '</section>';
  }

  function field(label, control) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
           control + '</label>';
  }

  function linesCardHtml(ro) {
    return '' +
      '<section class="card">' +
        '<div class="lines-head">' +
          '<h3>Dòng hàng</h3>' +
          (ro ? '' : '<button type="button" class="btn-mini" data-act="add-line">+ Thêm dòng</button>') +
        '</div>' +
        '<div id="lines">' + state.lines.map(function (line, i) {
          return lineHtml(line, i, ro);
        }).join('') + '</div>' +
        (ro ? '' : '<button type="button" class="btn-mini add-bottom" data-act="add-line">+ Thêm dòng</button>') +
      '</section>';
  }

  function lineHtml(line, index, ro) {
    var d = ro ? ' disabled' : '';
    var showMoney = !state.hiddenMoney;

    var money = showMoney
      ? field('Đơn giá (VNĐ)',
          '<input class="money l-unitPrice" inputmode="numeric" value="' +
          T.esc(groupDigits(line.unitPrice)) + '"' + d + '>') +
        field('VAT',
          '<select class="l-vatRate"' + d + '>' +
            vatRates().map(function (r) {
              return '<option value="' + r + '"' +
                (Number(line.vatRate) === Number(r) ? ' selected' : '') + '>' +
                Math.round(r * 100) + '%</option>';
            }).join('') +
          '</select>')
      : '';

    var invoiceFields = has(line, 'invoiceNo')
      ? field('Số hoá đơn',
          '<input class="l-invoiceNo" value="' + T.esc(line.invoiceNo) + '" placeholder="98"' + d + '>') +
        field('Ngày hoá đơn',
          '<input class="l-invoiceDate" type="date" value="' + T.esc(line.invoiceDate) + '"' + d + '>')
      : '';

    return '' +
      '<div class="line-card" data-index="' + index + '">' +
        '<div class="line-top">' +
          '<span class="line-no">Dòng ' + (index + 1) + '</span>' +
          (ro ? '' : '<button type="button" class="link-btn danger-link" data-act="del-line">Xoá dòng</button>') +
        '</div>' +
        '<label class="field field-wide"><span class="field-label">Nội dung hàng hoá *</span>' +
          '<textarea class="l-description" rows="2"' + d + '>' + T.esc(line.description) +
          '</textarea></label>' +
        '<div class="form-grid">' +
          (has(line, 'productCode')
            ? field('Mã hàng', '<input class="l-productCode" value="' + T.esc(line.productCode) + '"' + d + '>')
            : '') +
          field('Số lượng *', '<input class="l-qty" inputmode="decimal" value="' + T.esc(line.qty) + '"' + d + '>') +
          (has(line, 'uom')
            ? field('ĐVT',
                '<select class="l-uom"' + d + '>' +
                  ['<option value=""></option>'].concat(uomList().map(function (u) {
                    return '<option value="' + T.esc(u) + '"' +
                      (u === line.uom ? ' selected' : '') + '>' + T.esc(u) + '</option>';
                  })).join('') +
                '</select>')
            : '') +
          money +
          invoiceFields +
        '</div>' +
        (has(line, 'note')
          ? '<label class="field field-wide"><span class="field-label">Ghi chú dòng</span>' +
            '<input class="l-note" value="' + T.esc(line.note) + '"' + d + '></label>'
          : '') +
        (showMoney ? '<div class="line-amount" data-role="amount"></div>' : '') +
      '</div>';
  }

  function totalsHtml() {
    if (state.hiddenMoney) return '';
    return '' +
      '<section class="card totals">' +
        '<div><span>Tổng chưa VAT</span><strong id="t-ex">0 ₫</strong></div>' +
        '<div><span>Tổng có VAT</span><strong id="t-inc">0 ₫</strong></div>' +
      '</section>';
  }

  /**
   * `permRo` = the server says this user cannot edit at all (no buttons,
   * unchanged from before). `busy` = a save/delete/reload is in flight for
   * THIS order right now: the buttons stay on screen (so the one driving
   * the action can show its progress label) but every one of them is
   * disabled — save while deleting, delete while saving, and a second click
   * on the same button are all blocked the same way. See isBusy() and the
   * guard at the top of onClick().
   */
  function actionsHtml(isNew, permRo, busy) {
    if (permRo) return '';

    var savingNow = state.busyAction === 'saving';
    var save = (isNew && !T.can('create_order')) ? '' :
      '<button type="button" class="btn btn-primary" data-act="save"' +
      (busy ? ' disabled' : '') + '>' +
      (savingNow ? 'Đang lưu...' : (isNew ? 'Lưu đơn hàng' : 'Lưu thay đổi')) + '</button>';

    var deletingNow = state.busyAction === 'deleting';
    var del = (!isNew && state.order.canDelete)
      ? '<button type="button" class="btn btn-danger" data-act="ask-delete"' +
          (busy ? ' disabled' : '') + '>' +
          (deletingNow ? 'Đang xoá...' : 'Xoá đơn hàng') + '</button>' +
        '<span class="confirm-box hidden" data-role="confirm">' +
          '<span>Xoá hẳn đơn này?</span>' +
          '<button type="button" class="btn-mini danger-link" data-act="do-delete"' +
            (busy ? ' disabled' : '') + '>Xoá</button>' +
          '<button type="button" class="btn-mini" data-act="cancel-delete"' +
            (busy ? ' disabled' : '') + '>Không</button>' +
        '</span>'
      : '';

    return '<div class="form-actions">' + save +
      '<button type="button" class="btn" data-act="back"' +
      (busy ? ' disabled' : '') + '>Huỷ</button>' + del + '</div>';
  }

  function customerDatalistHtml() {
    return '<datalist id="customer-options">' +
      customerList().map(function (c) {
        return '<option value="' + T.esc(c) + '"></option>';
      }).join('') + '</datalist>';
  }

  /* =====================================================================
     Behaviour — one delegated listener per event, bound once in render()
     ===================================================================== */

  function onClick(e) {
    var target = e.target.closest ? e.target.closest('[data-act], [data-open]') : null;
    if (!target) return;
    // Milestone 2.5c follow-up: one order-detail action (save/delete/reload)
    // at a time. The disabled attribute already stops most clicks; this is
    // the second layer for anything that slips through (double-click before
    // the disabled repaint lands, Enter-to-submit, etc).
    if (isBusy()) return;

    var open = target.getAttribute('data-open');
    if (open) { openForm(open); return; }

    switch (target.getAttribute('data-act')) {
      case 'new':
        openForm(null);
        break;
      case 'back':
        showList();
        break;
      case 'add-line':
        collect();
        state.lines.push(blankLine());
        paintForm();
        focusLast();
        break;
      case 'del-line':
        collect();
        state.lines.splice(Number(target.closest('.line-card').getAttribute('data-index')), 1);
        if (!state.lines.length) state.lines = [blankLine()];
        paintForm();
        break;
      case 'ask-delete':
        toggleConfirm(true);
        break;
      case 'cancel-delete':
        toggleConfirm(false);
        break;
      case 'do-delete':
        doDelete();
        break;
      case 'save':
        save();
        break;
      case 'reload-order':
        // Read-only view has nothing to lose; an editable form might have
        // unsaved typing, so confirm before discarding it.
        if (state.editing) toggleReloadConfirm(true);
        else reloadOrder();
        break;
      case 'cancel-reload':
        toggleReloadConfirm(false);
        break;
      case 'do-reload':
        reloadOrder();
        break;
      case 'refresh-list':
        manualRefresh();
        break;
      case 'load-more':
        loadMore();
        break;
      case 'apply-filter': {
        var mSel = root.querySelector('#f-filter-month');
        var ySel = root.querySelector('#f-filter-year');
        var mv = mSel ? mSel.value : '';
        var yv = ySel ? ySel.value : '';
        // Month/year are a pair: either both chosen (a real month filter) or
        // neither (no date filter at all) — one alone is not a valid filter.
        if ((mv && !yv) || (!mv && yv)) {
          T.toast('Chọn cả tháng và năm để lọc theo tháng.', true);
          break;
        }
        var customerSel = root.querySelector('#f-filter-customer');
        var statusSel = root.querySelector('#f-filter-status');
        var createdBySel = root.querySelector('#f-filter-createdBy');
        // Phong's spec 2026-08-31 (2d): the dropdown panel's "Áp dụng" is
        // independent of the search box. A query typed but never submitted
        // via the 🔍 button/Enter is discarded here, not silently applied —
        // revert the visible text to whatever was last actually searched.
        state.searchDraft = state.filters.q;
        state.filterPanelOpen = false;
        paintList(); // close the panel immediately even if applyFilters below is a no-op
        applyFilters({
          month: (mv && yv) ? (yv + '-' + mv) : '',
          customer: customerSel ? customerSel.value : '',
          status: statusSel ? statusSel.value : '',
          createdBy: createdBySel ? createdBySel.value : ''
        });
        break;
      }
      case 'submit-search':
        if (canSubmitSearch()) submitSearch();
        break;
      case 'clear-filter':
        state.searchDraft = '';
        state.filterPanelOpen = false;
        paintList();
        clearFilters();
        break;
      case 'toggle-filter-panel':
        // Toggling the panel is display-only — it must never touch
        // state.filters or state.searchDraft, only how they're rendered.
        state.filterPanelOpen = !state.filterPanelOpen;
        paintList();
        break;
      case 'remove-filter': {
        // The month chip clears both dropdowns even though only `month` is
        // one state.filters key; every other chip maps 1:1.
        var key = target.getAttribute('data-key');
        if (key === 'q') state.searchDraft = '';
        var patch = {};
        patch[key] = '';
        applyFilters(patch);
        break;
      }
    }
  }

  /** No window.confirm: a native dialog blocks the whole Apps Script iframe. */
  function toggleConfirm(show) {
    var box = root.querySelector('[data-role="confirm"]');
    if (box) box.classList.toggle('hidden', !show);
  }

  function toggleReloadConfirm(show) {
    var box = root.querySelector('[data-role="confirm-reload"]');
    if (box) box.classList.toggle('hidden', !show);
  }

  /**
   * Milestone 2.5c / D1 follow-up — force-refresh the order on screen,
   * bypassing orderCache entirely (fetchOrder() always overwrites the cache
   * entry on success, so this doubles as "reset the cache for this order").
   * The escape hatch for D1's accepted risk: someone else edited this order
   * while it sat cached, or this form has just been open a while.
   */
  function reloadOrder() {
    if (isBusy() || !state.order || !state.order.orderId) return;
    toggleReloadConfirm(false);
    var orderId = state.order.orderId;
    var seq = viewSeq; // still viewing this order; ignore only if navigated away
    state.busyAction = 'reloading';
    paintForm();
    fetchOrder(orderId)
      .then(function (data) {
        state.busyAction = null;
        if (seq !== viewSeq) return; // left this order while reloading
        applyOrderData(data);
        paintForm();
        T.toast('Đã tải dữ liệu mới nhất.');
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  function focusLast() {
    var cards = root.querySelectorAll('.line-card');
    var last = cards[cards.length - 1];
    if (last) {
      var input = last.querySelector('.l-description');
      if (input) input.focus();
    }
  }

  function onInput(e) {
    // Milestone 3 / 3.4 fix — keep the live search text so any unrelated
    // repaint (toggling the filter panel, "Làm mới"...) doesn't wipe it;
    // see state.searchDraft's own comment. This does NOT search — only
    // submitSearch() (Enter or the 🔍 button) does that. The button's
    // enabled state is toggled directly on the element (NOT via paintList(),
    // which would tear down and rebuild the input on every keystroke and
    // throw away focus/cursor position mid-typing).
    if (e.target && e.target.id === 'f-filter-q') {
      state.searchDraft = e.target.value;
      var searchBtn = root.querySelector('[data-act="submit-search"]');
      if (searchBtn) searchBtn.disabled = !canSubmitSearch();
      return;
    }
    var cls = e.target.classList;
    if (!cls) return;
    if (cls.contains('money') || cls.contains('l-qty') || cls.contains('l-vatRate')) recalc();
  }

  /** Milestone 3 / 3.4 — Enter in the search box applies filters, same as
   *  clicking "Lọc", without needing a separate keyup/debounce dance. */
  function onKeydown(e) {
    // Fix, found live 2026-08-31: Enter used to click "Áp dụng", a button
    // that only exists in the DOM while the filter panel is open — with the
    // panel closed (the default state) Enter did nothing at all. Search must
    // work on its own, panel open or not.
    if (e.key === 'Enter' && e.target && e.target.id === 'f-filter-q') {
      e.preventDefault();
      if (canSubmitSearch()) submitSearch();
    }
  }

  /**
   * Milestone 3 / 3.4 fix — the one place that actually commits a search.
   * Reads the input directly (freshest value) rather than state.searchDraft,
   * which onInput keeps in sync but could theoretically lag a fast Enter.
   */
  function submitSearch() {
    var input = root.querySelector('#f-filter-q');
    var q = (input ? input.value : state.searchDraft || '').trim();
    state.searchDraft = q;
    applyFilters({ q: q });
  }

  /** Reformat money on the way out of a field, so 1200000 reads as 1.200.000. */
  function onBlur(e) {
    if (e.target.classList && e.target.classList.contains('money')) {
      e.target.value = groupDigits(e.target.value);
      recalc();
    }
  }

  /** Read the DOM back into state, so a repaint never loses what was typed. */
  function collect() {
    if (!state.order) return;
    var o = state.order;
    var get = function (sel) { var n = root.querySelector(sel); return n ? n.value : ''; };

    // Required, always rendered, always collected.
    o.customer = get('#f-customer');
    o.orderDate = get('#f-orderDate');
    o.status = get('#f-status') || o.status;
    // Everything below is optional and only exists on `o` (and therefore
    // only rendered by headerCardHtml) when has(o, field) was true — i.e.
    // this role's visible_fields includes it. Only touch what was actually
    // drawn, so a field this role can't see is never even attempted; the
    // server preserves it either way (fieldVisible_), but there is no
    // reason for the client to send a value for an input that was never on
    // screen.
    if (has(o, 'po')) o.po = get('#f-po');
    if (has(o, 'poNote')) o.poNote = get('#f-poNote');
    if (has(o, 'statusNote')) o.statusNote = get('#f-statusNote');
    if (has(o, 'supplierName')) o.supplierName = get('#f-supplierName');
    if (has(o, 'customerDeposit')) o.customerDeposit = get('#f-customerDeposit');
    if (has(o, 'supplierPaid')) o.supplierPaid = get('#f-supplierPaid');

    state.lines = Array.prototype.map.call(root.querySelectorAll('.line-card'),
      function (card, i) {
        var pick = function (sel) { var n = card.querySelector(sel); return n ? n.value : ''; };
        var previous = state.lines[i] || blankLine();
        var line = {
          // lineId comes from what the server sent, never from the DOM.
          lineId: previous.lineId || '',
          description: pick('.l-description'),
          qty: pick('.l-qty')
        };
        if (has(previous, 'productCode')) line.productCode = pick('.l-productCode');
        if (has(previous, 'uom')) line.uom = pick('.l-uom');
        line.unitPrice = state.hiddenMoney ? previous.unitPrice : pick('.l-unitPrice');
        line.vatRate = state.hiddenMoney ? previous.vatRate : pick('.l-vatRate');
        if (has(previous, 'invoiceNo')) {
          line.invoiceNo = pick('.l-invoiceNo');
          line.invoiceDate = pick('.l-invoiceDate');
        }
        if (has(previous, 'note')) line.note = pick('.l-note');
        return line;
      });
  }

  /**
   * Live totals, for reassurance while typing. The saved figures are the ones
   * the API computes from the same formula; these are never sent anywhere.
   */
  function recalc() {
    if (state.hiddenMoney || !state.order) return;
    var totalEx = 0, totalInc = 0;

    Array.prototype.forEach.call(root.querySelectorAll('.line-card'), function (card) {
      var priceInput = card.querySelector('.l-unitPrice');
      var qtyInput = card.querySelector('.l-qty');
      var vatInput = card.querySelector('.l-vatRate');

      var ex = Math.round(moneyValue(priceInput ? priceInput.value : 0) *
                          qtyValue(qtyInput ? qtyInput.value : 0));
      var inc = Math.round(ex * (1 + Number(vatInput ? vatInput.value : 0)));
      totalEx += ex;
      totalInc += inc;

      var slot = card.querySelector('[data-role="amount"]');
      if (slot) {
        slot.innerHTML = ex
          ? 'Thành tiền: <strong>' + T.formatVnd(ex) + '</strong> · có VAT: <strong>' +
            T.formatVnd(inc) + '</strong>'
          : '';
      }
    });

    var ex = root.querySelector('#t-ex');
    var inc = root.querySelector('#t-inc');
    if (ex) ex.textContent = T.formatVnd(totalEx);
    if (inc) inc.textContent = T.formatVnd(totalInc);
  }

  /* ---------------- save / delete ---------------- */

  function save() {
    if (isBusy()) return;
    collect();

    var isNew = !state.order.orderId;
    var payload = { order: state.order, lines: state.lines };
    if (!isNew) payload.orderId = state.order.orderId;
    var seq = viewSeq;

    state.busyAction = 'saving';
    paintForm(); // locks every field + button until this resolves (issue: "disable all while saving")
    T.call(isNew ? 'apiCreateOrder' : 'apiUpdateOrder', payload)
      .then(function (data) {
        // Always keep the list cache in sync — even if the user left the form.
        upsertCachedOrder(data.order, (data.lines || []).length);
        // D1: and the detail cache, so reopening this order right after saving
        // doesn't pay a network round trip for what the server just returned.
        // Cloned (not the raw response object) so nothing else that later
        // holds a reference to `data.order` can mutate this cache entry —
        // same reasoning as applyOrderData's shallowCopy.
        orderCache[data.order.orderId] = {
          data: { order: shallowCopy(data.order), lines: data.lines, hiddenMoney: data.hiddenMoney },
          loadedAt: Date.now()
        };
        state.busyAction = null; // reset unconditionally — a stale busyAction would lock every future save
        if (seq !== viewSeq) return;
        applyOrderData(data);
        T.toast(isNew ? 'Đã tạo đơn ' + data.order.orderId : 'Đã lưu thay đổi.');
        paintForm();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  function doDelete() {
    if (isBusy()) return;
    var seq = viewSeq;
    var deletedId = state.order.orderId;
    state.busyAction = 'deleting';
    paintForm();
    T.call('apiDeleteOrder', deletedId)
      .then(function () {
        removeCachedOrder(deletedId);
        delete orderCache[deletedId];
        state.busyAction = null;
        if (seq !== viewSeq) return;
        T.toast('Đã xoá đơn hàng.');
        showList();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  window.TTOrders = { render: render, prefetch: prefetch };
})();
</script>
