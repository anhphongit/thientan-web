    if (has(line, 'note')) out.note = line.note || '';
    return out;
  }

  function paintForm() {
    var o = state.order;
    var isNew = !o.orderId;
    var permRo = !state.editing;          // server says: this user cannot edit at all
    var busy = isBusy();                  // save/delete/reload in flight right now
    var fieldsLocked = permRo || busy;    // either reason locks every input the same way

    // UI revision (2026-09-02, "Option N"; 2026-09-03, "Option A") — the
    // detail title fuses the same colour+icon marker onto "Mã đơn {id}"
    // (same component as the list card, see fusedOrderIdHtml), and it is
    // now ALSO the trigger for the approve actions themselves — the
    // separate Gửi duyệt/Duyệt/Từ chối/Về Nháp button row that used to sit
    // in actionsHtml() is gone; see the doc comment there. The full text
    // label still appears separately in approveStatusBannerHtml just below
    // — spec point 3 (text in detail) is satisfied there, not by the title
    // icon. 'detail' is this marker's fixed menu key (there is only ever
    // one detail title open at a time, unlike list cards).
    var titleHtml = isNew
      ? 'Tạo đơn hàng'
      : (approveStatusEnabled() && has(o, 'approveStatus'))
        ? 'Mã đơn ' + fusedOrderIdHtml(T.esc(o.orderId), o.approveStatus, 'oc-id',
                                       approveActionsFor(o), 'detail', state.approveMenuOpenFor === 'detail',
                                       APPROVE_BUSY_LABELS.indexOf(state.busyAction) >= 0)
        : 'Mã đơn ' + T.esc(o.orderId);

    root.innerHTML = '' +
      '<div class="view-head">' +
        '<h2>' + titleHtml + '</h2>' +
        '<button type="button" class="link-btn" data-act="back"' +
          (busy ? ' disabled' : '') + '>← Danh sách</button>' +
      '</div>' +
      (isNew ? '' : detailFreshHtml(busy)) +
      (permRo ? '<p class="ro-note">Bạn chỉ có quyền xem đơn hàng này.</p>' : '') +
      approveStatusBannerHtml(o) +
      headerCardHtml(o, fieldsLocked) +
      linesCardHtml(fieldsLocked) +
      totalsHtml() +
      actionsHtml(isNew, permRo, busy) +
      customerDatalistHtml();

    recalc();
  }

  /**
   * Milestone 2.5c / D1 follow-up — the detail-cache counterpart to the
   * list's "cập nhật lúc HH:mm · Làm mới" line (P2's staleness rule: cached
   * data must always say how old it is and offer a way to force a real
   * fetch). "Tải lại" bypasses the cache entirely — for when another user
   * changed this order while it sat cached or the form was left open, which
   * D1 accepted as an acceptable, bounded risk but should not leave silent.
   *
   * `busy` disables the button (and its confirm) while ANY order action is
   * in flight, not only a reload — see isBusy()/onClick()'s guard.
   */
  function detailFreshHtml(busy) {
    var reloadingNow = state.busyAction === 'reloading';
    return '' +
      '<p class="list-count">' +
        (detailFreshLabel() ? detailFreshLabel() + ' · ' : '') +
        '<button type="button" class="link-btn" data-act="reload-order"' +
          (busy ? ' disabled' : '') + '>' +
          (reloadingNow ? 'Đang tải lại…' : 'Tải lại') +
        '</button>' +
      '</p>';
  }

  /**
   * Milestone 3 / 3.8 — REPLACES the 3.6 approvedNoteHtml() outright (same
   * "Replace outright" decision as the server side): approve status is now
   * a first-class badge shown for every order regardless of state (not just
   * "say so once approved"), plus the last-updated-by line the spec asks
   * for (point 4). Both pieces are independent of approveStatusEnabled()
   * for the "last updated by" half — that's just plain audit info, useful
   * whether or not the approval workflow itself is turned on; the approve
   * badge itself is still gated, same as the list card.
   */
  function approveStatusBannerHtml(o) {
    var badge = (approveStatusEnabled() && has(o, 'approveStatus'))
      ? '<p class="approve-status-banner">' + approveStatusPillHtml(o.approveStatus) + '</p>'
      : '';
    var updated = (has(o, 'updatedBy') && o.updatedBy)
      ? '<p class="updated-note">Cập nhật lần cuối bởi ' + T.esc(o.updatedBy) +
        (o.updatedAt ? ' · ' + T.formatDate(o.updatedAt) : '') + '</p>'
      : '';
    return badge + rejectReasonHtml(o) + updated;
  }

  // Revision 2026-09-03b — "B2" compact reject-reason line. StatusHistory
  // captures the note on reject (see actionRejectOrder_) but nothing ever
  // showed it; buildOrderResponse_ now attaches rejectReason/rejectedBy/
  // rejectedAt to the order payload only when approveStatus is 'rejected'.
  function rejectReasonHtml(o) {
    if (o.approveStatus !== 'rejected' || !has(o, 'rejectReason') || !o.rejectReason) return '';
    var who = (has(o, 'rejectedBy') && o.rejectedBy) ? '— ' + T.esc(o.rejectedBy) : '';
    var when = (has(o, 'rejectedAt') && o.rejectedAt) ? ', ' + T.formatDate(o.rejectedAt) : '';
    return '' +
      '<p class="reject-reason-line">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
          '<path d="M6 6l12 12M18 6L6 18"/>' +
        '</svg>' +
        '<span>"' + T.esc(o.rejectReason) + '"' +
          (who || when ? '<span class="reject-reason-who">' + who + when + '</span>' : '') +
        '</span>' +
      '</p>';
  }

  function detailFreshLabel() {
    var entry = state.order && orderCache[state.order.orderId];
    if (!entry) return '';
    var d = new Date(entry.loadedAt);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return 'dữ liệu lúc ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function headerCardHtml(o, ro) {
    var d = ro ? ' disabled' : '';
    // Status is locked on an existing order for someone without change_status:
    // the server refuses it anyway, and a control that always errors is a trap.
    var statusDisabled = (ro || (o.orderId && !o.canChangeStatus)) ? ' disabled' : '';

    return '' +
      '<section class="card">' +
        '<h3>Thông tin đơn</h3>' +
        '<div class="form-grid">' +
          field('Khách hàng *',
            '<input id="f-customer" list="customer-options" autocomplete="off" value="' +
            T.esc(o.customer) + '"' + d + '>') +
          field('Ngày đặt hàng *',
            '<input id="f-orderDate" type="date" value="' +
            T.esc(dateInputValue(o.orderDate) || today()) + '"' + d + '>') +
          (has(o, 'po')
            ? field('Số PO',
                // One free-text value, not a split field (Q3). It may hold
                // several numbers stacked on separate lines, as the reference
                // workbook does.
                '<textarea id="f-po" rows="2" placeholder="Ví dụ: 4600041936"' + d + '>' +
                T.esc(o.po) + '</textarea>') : '') +
          (has(o, 'poNote')
            ? field('Ghi chú về PO',
                '<input id="f-poNote" value="' + T.esc(o.poNote) +
                '" placeholder="PO tạm, chờ PO thật..."' + d + '>') : '') +
          field('Trạng thái',
            '<select id="f-status"' + statusDisabled + '>' +
              statusList().map(function (s) {
                return '<option value="' + T.esc(s.key) + '"' +
                  (s.key === o.status ? ' selected' : '') + '>' + T.esc(s.label) + '</option>';
              }).join('') +
            '</select>') +
          (has(o, 'statusNote')
            ? field('Ghi chú trạng thái',
                '<input id="f-statusNote" value="' + T.esc(o.statusNote) +
                '" placeholder="Hẹn giao 22/09..."' + d + '>') : '') +
          (has(o, 'customerDeposit')
            ? field('Khách đã cọc (VNĐ)',
                '<input id="f-customerDeposit" inputmode="numeric" class="money" value="' +
                T.esc(groupDigits(o.customerDeposit)) + '"' + d + '>') : '') +
          (has(o, 'supplierName')
            ? field('Nhà cung cấp',
                '<input id="f-supplierName" value="' + T.esc(o.supplierName) + '"' + d + '>') : '') +
          (has(o, 'supplierPaid')
            ? field('Đã trả nhà cung cấp (VNĐ)',
                '<input id="f-supplierPaid" inputmode="numeric" class="money" value="' +
                T.esc(groupDigits(o.supplierPaid)) + '"' + d + '>') : '') +
        '</div>' +
      '</section>';
  }

  function field(label, control) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
           control + '</label>';
  }

  function linesCardHtml(ro) {
    return '' +
      '<section class="card">' +
        '<div class="lines-head">' +
          '<h3>Dòng hàng</h3>' +
          (ro ? '' : '<button type="button" class="btn-mini" data-act="add-line">+ Thêm dòng</button>') +
        '</div>' +
        '<div id="lines">' + state.lines.map(function (line, i) {
          return lineHtml(line, i, ro);
        }).join('') + '</div>' +
        (ro ? '' : '<button type="button" class="btn-mini add-bottom" data-act="add-line">+ Thêm dòng</button>') +
      '</section>';
  }

  function lineHtml(line, index, ro) {
    var d = ro ? ' disabled' : '';
    var showMoney = !state.hiddenMoney;

    var money = showMoney
      ? field('Đơn giá (VNĐ)',
          '<input class="money l-unitPrice" inputmode="numeric" value="' +
          T.esc(groupDigits(line.unitPrice)) + '"' + d + '>') +
        field('VAT',
          '<select class="l-vatRate"' + d + '>' +
            vatRates().map(function (r) {
              return '<option value="' + r + '"' +
                (Number(line.vatRate) === Number(r) ? ' selected' : '') + '>' +
                Math.round(r * 100) + '%</option>';
            }).join('') +
          '</select>')
      : '';

    var invoiceFields = has(line, 'invoiceNo')
      ? field('Số hoá đơn',
          '<input class="l-invoiceNo" value="' + T.esc(line.invoiceNo) + '" placeholder="98"' + d + '>') +
        field('Ngày hoá đơn',
          '<input class="l-invoiceDate" type="date" value="' + T.esc(line.invoiceDate) + '"' + d + '>')
      : '';

    return '' +
      '<div class="line-card" data-index="' + index + '">' +
        '<div class="line-top">' +
          '<span class="line-no">Dòng ' + (index + 1) + '</span>' +
          (ro ? '' : '<button type="button" class="link-btn danger-link" data-act="del-line">Xoá dòng</button>') +
        '</div>' +
        '<label class="field field-wide"><span class="field-label">Nội dung hàng hoá *</span>' +
          '<textarea class="l-description" rows="2"' + d + '>' + T.esc(line.description) +
          '</textarea></label>' +
        '<div class="form-grid">' +
          (has(line, 'productCode')
            ? field('Mã hàng', '<input class="l-productCode" value="' + T.esc(line.productCode) + '"' + d + '>')
            : '') +
          field('Số lượng *', '<input class="l-qty" inputmode="decimal" value="' + T.esc(line.qty) + '"' + d + '>') +
          (has(line, 'uom')
            ? field('ĐVT',
                '<select class="l-uom"' + d + '>' +
                  ['<option value=""></option>'].concat(uomList().map(function (u) {
                    return '<option value="' + T.esc(u) + '"' +
                      (u === line.uom ? ' selected' : '') + '>' + T.esc(u) + '</option>';
                  })).join('') +
                '</select>')
            : '') +
          money +
          invoiceFields +
        '</div>' +
        (has(line, 'note')
          ? '<label class="field field-wide"><span class="field-label">Ghi chú dòng</span>' +
            '<input class="l-note" value="' + T.esc(line.note) + '"' + d + '></label>'
          : '') +
        (showMoney ? '<div class="line-amount" data-role="amount"></div>' : '') +
      '</div>';
  }

  function totalsHtml() {
    if (state.hiddenMoney) return '';
    return '' +
      '<section class="card totals">' +
        '<div><span>Tổng chưa VAT</span><strong id="t-ex">0 ₫</strong></div>' +
        '<div><span>Tổng có VAT</span><strong id="t-inc">0 ₫</strong></div>' +
      '</section>';
  }

  /**
   * `permRo` = the server says this user cannot edit at all (no buttons,
   * unchanged from before). `busy` = a save/delete/reload is in flight for
   * THIS order right now: the buttons stay on screen (so the one driving
   * the action can show its progress label) but every one of them is
   * disabled — save while deleting, delete while saving, and a second click
   * on the same button are all blocked the same way. See isBusy() and the
   * guard at the top of onClick().
   *
   * UI revision (2026-09-03, "Option A") — REPLACES the 3.8 request-
   * approve/approve/reject/set-draft button row entirely: those four
   * actions now live behind the fused id+status marker in the title
   * itself (fusedOrderIdHtml, approveActionsFor — see paintForm()), the
   * same trigger the list card uses. This function is left with only
   * save/Huỷ/Xoá — permRo can still suppress it completely, since those
   * three really do require canEdit/canDelete, and there is nothing left
   * here that a read-only-but-approving user needs (their approve actions
   * are reachable through the title marker regardless of permRo, exactly
   * as the old approve/reject buttons were).
   */
  function actionsHtml(isNew, permRo, busy) {
    if (permRo) return '';

    var savingNow = state.busyAction === 'saving';
    var save = (isNew && !T.can('create_order')) ? '' :
      '<button type="button" class="btn btn-primary" data-act="save"' +
      (busy ? ' disabled' : '') + '>' +
      (savingNow ? 'Đang lưu...' : (isNew ? 'Lưu đơn hàng' : 'Lưu thay đổi')) + '</button>';

    var deletingNow = state.busyAction === 'deleting';
    var del = (!isNew && state.order.canDelete)
      ? '<button type="button" class="btn btn-danger" data-act="ask-delete"' +
          (busy ? ' disabled' : '') + '>' +
          (deletingNow ? 'Đang xoá...' : 'Xoá đơn hàng') + '</button>'
      : '';

    return '<div class="form-actions">' + save +
      '<button type="button" class="btn" data-act="back"' +
      (busy ? ' disabled' : '') + '>Huỷ</button>' +
      del + '</div>';
  }

  function customerDatalistHtml() {
    return '<datalist id="customer-options">' +
      customerList().map(function (c) {
        return '<option value="' + T.esc(c) + '"></option>';
      }).join('') + '</datalist>';
  }

  /* =====================================================================
     Behaviour — one delegated listener per event, bound once in render()
     ===================================================================== */

  /**
   * Repaint whichever screen is currently showing after the approve-menu
   * open/close state changes. state.order is the existing discriminator
   * the rest of this module already relies on (showList() clears it,
   * openForm()/applyOrderData() set it) — NOT root.querySelector('.view-
   * head'), which depended on a DOM query the harness's DOM stub can't
   * answer and real browsers would too, just less obviously (a detail
   * view mid-transition has no .view-head for one paint cycle either).
   */
  function repaintAfterApproveMenuChange() {
    if (state.order) paintForm(); else paintList();
  }

  function onClick(e) {
    var target = e.target.closest ? e.target.closest('[data-act], [data-open]') : null;

    // UI revision (2026-09-03, "Option A") — close any open approve-menu on
    // a click outside its own wrapper (the usual "click outside to
    // dismiss" contract for a dropdown). A click on the wrapper's own
    // toggle button, or on one of its menu items, is handled below instead
    // — both close the menu themselves as part of handling the click, so
    // skip the repaint here to avoid doing it twice.
    if (state.approveMenuOpenFor !== null) {
      var insideOpenMenu = e.target.closest &&
        e.target.closest('[data-menu-key="' + state.approveMenuOpenFor + '"]');
      if (!insideOpenMenu) {
        state.approveMenuOpenFor = null;
        repaintAfterApproveMenuChange();
      }
    }

    if (!target) return;
    // Milestone 2.5c follow-up: one order-detail action (save/delete/reload)
    // at a time. The disabled attribute already stops most clicks; this is
    // the second layer for anything that slips through (double-click before
    // the disabled repaint lands, Enter-to-submit, etc).
    if (isBusy()) return;

    if (target.getAttribute('data-act') === 'toggle-approve-menu') {
      var key = target.getAttribute('data-menu-key');
      // A list card whose approve action is already in flight shows the
      // pending spinner instead of this button at all (fusedOrderIdHtml),
      // but guard here too in case a click landed a moment before that
      // repaint — same belt-and-suspenders as the data-open guard below.
      // Locking, point 1 (2026-09-03 feedback) — also refuse to open the
      // menu while THIS order's status quick-change is in flight (the
      // marker isn't even drawn as a button in that case; this is the same
      // belt-and-suspenders layer as the line above, for the same reason).
      if (state.approveUpdatingIds[key] || state.statusUpdatingIds[key]) return;
      state.approveMenuOpenFor = (state.approveMenuOpenFor === key) ? null : key;
      repaintAfterApproveMenuChange();
      return;
    }

    var open = target.getAttribute('data-open');
    if (open) {
      // Milestone 3 / 3.5 — don't let the user open an order whose status
      // change is still in flight: the server hasn't confirmed it yet, and
      // opening the (possibly stale) detail form invites acting on it
      // before the change actually lands.
      if (state.statusUpdatingIds[open] || state.approveUpdatingIds[open]) return;
      openForm(open);
      return;
    }

    switch (target.getAttribute('data-act')) {
      case 'new':
        openForm(null);
        break;
      case 'back':
        showList();
        break;
      case 'add-line':
        collect();
        state.lines.push(blankLine());
        paintForm();
        focusLast();
        break;
      case 'del-line':
        collect();
        state.lines.splice(Number(target.closest('.line-card').getAttribute('data-index')), 1);
        if (!state.lines.length) state.lines = [blankLine()];
        paintForm();
        break;
      case 'ask-delete':
        confirmDelete();
        break;
      // UI revision (2026-09-03, "Option A") — these four now fire from a
      // menu item under the fused marker, on either the detail title
      // (data-menu-key="detail") or a list card (data-menu-key=<orderId>).
      // Resolve which order + which driver (doApproveStatusAction for the
      // detail title, doApproveStatusActionQuick for a list card) applies
      // before calling the SAME confirm* function either way — see the doc
      // comment on confirmRequestApprove and friends above.
      case 'ask-request-approve':
      case 'ask-approve':
      case 'ask-reject':
      case 'ask-set-draft': {
        var menuKeyForAsk = target.getAttribute('data-menu-key');
        var askOrder, askRun;
        if (menuKeyForAsk === 'detail') {
          askOrder = state.order;
          askRun = doApproveStatusAction;
        } else {
          askOrder = state.orders.filter(function (o) { return o.orderId === menuKeyForAsk; })[0];
          if (!askOrder) break;
          askRun = function (apiFn, busyLabel, newApproveStatus, successToast, note) {
            doApproveStatusActionQuick(askOrder, apiFn, busyLabel, newApproveStatus, successToast, note);
          };
        }
        var askActCase = target.getAttribute('data-act');
        if (askActCase === 'ask-request-approve') confirmRequestApprove(askOrder, askRun);
        else if (askActCase === 'ask-approve') confirmApprove(askOrder, askRun);
        else if (askActCase === 'ask-reject') confirmReject(askOrder, askRun);
        else confirmSetDraft(askOrder, askRun);
        break;
      }
      case 'save':
        save();
        break;
      case 'reload-order':
        // Read-only view has nothing to lose; an editable form might have
        // unsaved typing, so confirm before discarding it.
        if (state.editing) confirmReload();
        else reloadOrder();
        break;
      case 'refresh-list':
        manualRefresh();
        break;
      case 'export-csv':
        doExportCsv();
        break;
      case 'load-more':
        loadMore();
        break;
      case 'apply-filter': {
        var mSel = root.querySelector('#f-filter-month');
        var ySel = root.querySelector('#f-filter-year');
        var mv = mSel ? mSel.value : '';
        var yv = ySel ? ySel.value : '';
        // Month/year are a pair: either both chosen (a real month filter) or
        // neither (no date filter at all) — one alone is not a valid filter.
        if ((mv && !yv) || (!mv && yv)) {
          T.toast('Chọn cả tháng và năm để lọc theo tháng.', true);
          break;
        }
        var customerSel = root.querySelector('#f-filter-customer');
        var statusSel = root.querySelector('#f-filter-status');
        var createdBySel = root.querySelector('#f-filter-createdBy');
        var approveStatusSel = root.querySelector('#f-filter-approveStatus');
        // Phong's spec 2026-08-31 (2d): the dropdown panel's "Áp dụng" is
        // independent of the search box. A query typed but never submitted
        // via the 🔍 button/Enter is discarded here, not silently applied —
        // revert the visible text to whatever was last actually searched.
        state.searchDraft = state.filters.q;
        state.filterPanelOpen = false;
        paintList(); // close the panel immediately even if applyFilters below is a no-op
        applyFilters({
          month: (mv && yv) ? (yv + '-' + mv) : '',
          customer: customerSel ? customerSel.value : '',
          status: statusSel ? statusSel.value : '',
          createdBy: createdBySel ? createdBySel.value : '',
          approveStatus: approveStatusSel ? approveStatusSel.value : ''
        });
        break;
      }
      case 'submit-search':
        if (canSubmitSearch()) submitSearch();
        break;
      case 'clear-filter':
        state.searchDraft = '';
        state.filterPanelOpen = false;
        paintList();
        clearFilters();
        break;
      case 'toggle-filter-panel':
        // Toggling the panel is display-only — it must never touch
        // state.filters or state.searchDraft, only how they're rendered.
        state.filterPanelOpen = !state.filterPanelOpen;
        paintList();
        break;
      case 'remove-filter': {
        // The month chip clears both dropdowns even though only `month` is
        // one state.filters key; every other chip maps 1:1.
        var key = target.getAttribute('data-key');
        if (key === 'q') state.searchDraft = '';
        var patch = {};
        patch[key] = '';
        applyFilters(patch);
        break;
      }
    }
  }

  /**
   * Milestone 3, migrated to the T.confirm() popup — was an inline
   * confirm-box. No window.confirm: a native dialog blocks the whole Apps
   * Script iframe (see T.confirm's own doc comment in ui/App.html).
   */
  function confirmDelete() {
    T.confirm({
      title: 'Xoá đơn hàng?',
      message: 'Xoá vĩnh viễn đơn này và toàn bộ dòng hàng. Không thể hoàn tác.',
      summary: orderSummaryFor(state.order),
      okLabel: 'Xoá đơn hàng', cancelLabel: 'Không', danger: true
    }).then(function (ok) { if (ok) doDelete(); });
  }

  /**
   * Milestone 3 — builds the record-summary block T.confirm() shows inside
   * the popup ("S2": a mini order-card — id, status pill, customer, meta,
   * total — same look as a real list card, so the user recognizes exactly
   * which order they're about to act on). Respects the same visibility
   * rules as the rest of this screen: a field simply isn't included when
   * the order object doesn't carry it (has()) or the user can't see money
   * (state.hiddenMoney) — T.confirm()'s summary renderer already treats
   * every field as optional, so omitting one here just leaves that line
   * out of the card, nothing breaks.
   */
  function orderSummaryFor(o) {
    if (!o) return null;
    var meta = [T.formatDate(o.orderDate), o.po ? 'PO ' + o.po : ''].filter(Boolean).join(' · ');
    return {
      id: o.orderId,
      statusLabel: statusLabel(o.status),
      statusClass: statusPillClass(o.status),
      customer: o.customer,
      meta: meta,
      money: (!state.hiddenMoney && has(o, 'totalIncVat'))
        ? T.formatVnd(o.totalIncVat) + ' (có VAT)' : ''
    };
  }

  /**
   * Milestone 2.5c / D1 follow-up — force-refresh the order on screen,
   * bypassing orderCache entirely (fetchOrder() always overwrites the cache
   * entry on success, so this doubles as "reset the cache for this order").
   * The escape hatch for D1's accepted risk: someone else edited this order
   * while it sat cached, or this form has just been open a while.
   */
  function confirmReload() {
    T.confirm({
      title: 'Tải lại đơn hàng?',
      message: 'Bỏ thay đổi chưa lưu trên màn hình và tải bản mới nhất.',
      summary: orderSummaryFor(state.order),
      okLabel: 'Tải lại', cancelLabel: 'Không', danger: true
    }).then(function (ok) { if (ok) reloadOrder(); });
  }

  function reloadOrder() {
    if (isBusy() || !state.order || !state.order.orderId) return;
    var orderId = state.order.orderId;
    var seq = viewSeq; // still viewing this order; ignore only if navigated away
    state.busyAction = 'reloading';
    paintForm();
    fetchOrder(orderId)
      .then(function (data) {
        state.busyAction = null;
        if (seq !== viewSeq) return; // left this order while reloading
        applyOrderData(data);
        paintForm();
        T.toast('Đã tải dữ liệu mới nhất.');
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  function focusLast() {
    var cards = root.querySelectorAll('.line-card');
    var last = cards[cards.length - 1];
    if (last) {
      var input = last.querySelector('.l-description');
      if (input) input.focus();
    }
  }

  function onInput(e) {
    // Milestone 3 / 3.4 fix — keep the live search text so any unrelated
    // repaint (toggling the filter panel, "Làm mới"...) doesn't wipe it;
    // see state.searchDraft's own comment. This does NOT search — only
    // submitSearch() (Enter or the 🔍 button) does that. The button's
    // enabled state is toggled directly on the element (NOT via paintList(),
    // which would tear down and rebuild the input on every keystroke and
    // throw away focus/cursor position mid-typing).
    if (e.target && e.target.id === 'f-filter-q') {
      state.searchDraft = e.target.value;
      var searchBtn = root.querySelector('[data-act="submit-search"]');
      if (searchBtn) searchBtn.disabled = !canSubmitSearch();
      return;
    }
    var cls = e.target.classList;
    if (!cls) return;
    if (cls.contains('money') || cls.contains('l-qty') || cls.contains('l-vatRate')) recalc();
  }

  /** Milestone 3 / 3.4 — Enter in the search box applies filters, same as
   *  clicking "Lọc", without needing a separate keyup/debounce dance. */
  function onKeydown(e) {
    // Fix, found live 2026-08-31: Enter used to click "Áp dụng", a button
    // that only exists in the DOM while the filter panel is open — with the
    // panel closed (the default state) Enter did nothing at all. Search must
    // work on its own, panel open or not.
    if (e.key === 'Enter' && e.target && e.target.id === 'f-filter-q') {
      e.preventDefault();
      if (canSubmitSearch()) submitSearch();
    }
  }

  /**
   * Milestone 3 / 3.4 fix — the one place that actually commits a search.
   * Reads the input directly (freshest value) rather than state.searchDraft,
   * which onInput keeps in sync but could theoretically lag a fast Enter.
   */
  function submitSearch() {
    var input = root.querySelector('#f-filter-q');
    var q = (input ? input.value : state.searchDraft || '').trim();
    state.searchDraft = q;
    applyFilters({ q: q });
  }

  /**
   * Milestone 3 / 3.5 — the quick-status <select> on a list card. Uses
   * 'change', not 'input': 'change' is the event a <select> is guaranteed to
   * fire on every browser/webview when its value commits, where 'input' on
   * a <select> is a newer addition some older mobile webviews still miss —
   * and these are the employees' own phones, not a controlled desktop.
   */
  function onChange(e) {
    if (e.target && e.target.matches && e.target.matches('[data-act="quick-status"]')) {
      changeStatusQuick(e.target);
    }
  }

  /**
   * Not optimistic: the status only changes in state.orders once the server
   * confirms it. While the round trip is in flight, orderId sits in
   * state.statusUpdatingIds — paintList() (called immediately, before the
   * request even goes out) then renders that card's pill as a pending
   * "Đang cập nhật…" state with no select, and disables both of the card's
   * "open detail" buttons (see orderCardHtml/statusQuickPillHtml), so the
   * user can't navigate into this order or queue a second status change
   * until the current one has actually landed. onClick's data-open handler
   * enforces the same block server-round-trip-side, in case a click slips
   * in before the repaint above lands.
   */
  function changeStatusQuick(selectEl) {
    var orderId = selectEl.getAttribute('data-order');
    var newStatus = selectEl.value;
    var order = state.orders.filter(function (o) { return o.orderId === orderId; })[0];
    if (!order || order.status === newStatus) return;
    var previousStatus = order.status;

    // Milestone 3 — a quick confirm before firing, closing gap #4 found in
    // the confirm-popup review: this was a one-click <select> with no undo
    // and no confirm at all. Deliberately lightweight (no order-summary
    // card, unlike delete/approve/reload) — it's meant to stay a QUICK
    // action (task 3.5's original design goal), just no longer a single
    // click with zero friction. The <select>'s value already changed to
    // newStatus the instant the browser fired 'change' — on Không, put it
    // back without a full paintList() (nothing else in state changed, no
    // need to touch the rest of the list).
    T.confirm({
      title: 'Đổi trạng thái?',
      message: statusLabel(previousStatus) + ' → ' + statusLabel(newStatus) + ' cho đơn ' + orderId + '.',
      okLabel: 'Đổi trạng thái', cancelLabel: 'Không', danger: false
    }).then(function (ok) {
      if (!ok) { selectEl.value = previousStatus; return; }
      doChangeStatusQuick(orderId, newStatus, order);
    });
  }

  function doChangeStatusQuick(orderId, newStatus, order) {
    state.statusUpdatingIds[orderId] = true;
    paintList();
    T.call('apiChangeStatus', { orderId: orderId, status: newStatus })
      .then(function () {
        order.status = newStatus;
        if (state.ordersLoadedAt) state.ordersLoadedAt = Date.now(); // own write keeps the list cache fresh, same as upsertCachedOrder
        // Bug fix, 2026-08-31: orderCache (the detail-view cache keyed by
        // orderId, see openForm/fetchOrder) is a SEPARATE cache from
        // state.orders — updating the list card above did nothing to it.
        // A quick status change from the list left any cached detail view
        // showing the old status until its DETAIL_CACHE_TTL_MS expired.
        // Drop the cache entry entirely rather than patch it in place: the
        // detail view also holds StatusHistory and other server-computed
        // fields (canEdit/canDelete/canChangeStatus) this response doesn't
        // return, so the safe fix is "next open re-fetches", not "guess at
        // a merged object".
        delete orderCache[orderId];
        delete state.statusUpdatingIds[orderId];
        paintList();
        T.toast('Đã đổi trạng thái.');
      })
      .catch(function (err) {
        delete state.statusUpdatingIds[orderId];
        paintList();
        T.toast(err.message, true);
      });
  }

  /** Reformat money on the way out of a field, so 1200000 reads as 1.200.000. */
  function onBlur(e) {
    if (e.target.classList && e.target.classList.contains('money')) {
      e.target.value = groupDigits(e.target.value);
      recalc();
    }
  }

  /** Read the DOM back into state, so a repaint never loses what was typed. */
  function collect() {
    if (!state.order) return;
    var o = state.order;
    var get = function (sel) { var n = root.querySelector(sel); return n ? n.value : ''; };

    // Required, always rendered, always collected.
    o.customer = get('#f-customer');
    o.orderDate = get('#f-orderDate');
    o.status = get('#f-status') || o.status;
    // Everything below is optional and only exists on `o` (and therefore
    // only rendered by headerCardHtml) when has(o, field) was true — i.e.
    // this role's visible_fields includes it. Only touch what was actually
    // drawn, so a field this role can't see is never even attempted; the
    // server preserves it either way (fieldVisible_), but there is no
    // reason for the client to send a value for an input that was never on
    // screen.
    if (has(o, 'po')) o.po = get('#f-po');
    if (has(o, 'poNote')) o.poNote = get('#f-poNote');
    if (has(o, 'statusNote')) o.statusNote = get('#f-statusNote');
    if (has(o, 'supplierName')) o.supplierName = get('#f-supplierName');
    if (has(o, 'customerDeposit')) o.customerDeposit = get('#f-customerDeposit');
    if (has(o, 'supplierPaid')) o.supplierPaid = get('#f-supplierPaid');

    state.lines = Array.prototype.map.call(root.querySelectorAll('.line-card'),
      function (card, i) {
        var pick = function (sel) { var n = card.querySelector(sel); return n ? n.value : ''; };
        var previous = state.lines[i] || blankLine();
        var line = {
          // lineId comes from what the server sent, never from the DOM.
          lineId: previous.lineId || '',
          description: pick('.l-description'),
          qty: pick('.l-qty')
        };
        if (has(previous, 'productCode')) line.productCode = pick('.l-productCode');
        if (has(previous, 'uom')) line.uom = pick('.l-uom');
        line.unitPrice = state.hiddenMoney ? previous.unitPrice : pick('.l-unitPrice');
        line.vatRate = state.hiddenMoney ? previous.vatRate : pick('.l-vatRate');
        if (has(previous, 'invoiceNo')) {
          line.invoiceNo = pick('.l-invoiceNo');
          line.invoiceDate = pick('.l-invoiceDate');
        }
        if (has(previous, 'note')) line.note = pick('.l-note');
        return line;
      });
  }

  /**
   * Live totals, for reassurance while typing. The saved figures are the ones
   * the API computes from the same formula; these are never sent anywhere.
   */
  function recalc() {
    if (state.hiddenMoney || !state.order) return;
    var totalEx = 0, totalInc = 0;

    Array.prototype.forEach.call(root.querySelectorAll('.line-card'), function (card) {
      var priceInput = card.querySelector('.l-unitPrice');
      var qtyInput = card.querySelector('.l-qty');
      var vatInput = card.querySelector('.l-vatRate');

      var ex = Math.round(moneyValue(priceInput ? priceInput.value : 0) *
                          qtyValue(qtyInput ? qtyInput.value : 0));
      var inc = Math.round(ex * (1 + Number(vatInput ? vatInput.value : 0)));
      totalEx += ex;
      totalInc += inc;

      var slot = card.querySelector('[data-role="amount"]');
      if (slot) {
        slot.innerHTML = ex
          ? 'Thành tiền: <strong>' + T.formatVnd(ex) + '</strong> · có VAT: <strong>' +
            T.formatVnd(inc) + '</strong>'
          : '';
      }
    });

    var ex = root.querySelector('#t-ex');
    var inc = root.querySelector('#t-inc');
    if (ex) ex.textContent = T.formatVnd(totalEx);
    if (inc) inc.textContent = T.formatVnd(totalInc);
  }

  /* ---------------- save / delete ---------------- */

  /**
   * Milestone 3 / 3.8 (point 9), extended 2026-09-03 (point 1) — every save
   * by a user holding approve_order asks "approve this now, or go to
   * draft?" BEFORE the save call — the user's answer becomes
   * payload.confirmApprove, which actionUpdateOrder_ AND (as of this
   * revision) actionCreateOrder_ both read server-side: approved only when
   * true, draft otherwise, no exceptions. Fires on every save while
   * approvalFlowEnabled(), not only when the order is currently
   * wait_approval/approved — "Every save by an edit+approve user".
   *
   * Create used to be skipped here because a new order was always born a
   * draft; it now honours confirmApprove exactly like an update does, so an
   * approver can create an already-approved order in one step instead of
   * creating it and immediately approving it again.
   */
  function save() {
    if (isBusy()) return;
    collect();

    if (approveStatusEnabled() && T.can('approve_order')) {
      confirmSaveApprove(!state.order.orderId);
      return;
    }
    doSave(false);
  }

  function confirmSaveApprove(isNew) {
    T.confirm({
      title: isNew ? 'Tạo và duyệt luôn đơn này?' : 'Duyệt luôn đơn này?',
      message: isNew
        ? 'Xác nhận: đơn sẽ được tạo và duyệt luôn. Không xác nhận: đơn vẫn được tạo, ở trạng thái Nháp.'
        : 'Xác nhận: đơn sẽ được lưu và duyệt luôn. Không xác nhận: đơn vẫn được lưu, nhưng sẽ chuyển về trạng thái Nháp.',
      summary: orderSummaryFor(state.order),
      okLabel: isNew ? 'Tạo và duyệt' : 'Lưu và duyệt',
      cancelLabel: isNew ? 'Chỉ tạo (Nháp)' : 'Chỉ lưu (về Nháp)',
      danger: false
    }).then(function (confirmApproveOnSave) { doSave(confirmApproveOnSave); });
  }

  function doSave(confirmApproveOnSave) {
    var isNew = !state.order.orderId;
    var payload = { order: state.order, lines: state.lines };
    if (!isNew) payload.orderId = state.order.orderId;
    // 2026-09-03 (point 1) — sent on create as well as update now; both
    // server actions read it with the same "approved only when true" rule.
    if (approveStatusEnabled() && T.can('approve_order')) {
      payload.confirmApprove = !!confirmApproveOnSave;
    }
    var seq = viewSeq;

    state.busyAction = 'saving';
    paintForm(); // locks every field + button until this resolves (issue: "disable all while saving")
    T.call(isNew ? 'apiCreateOrder' : 'apiUpdateOrder', payload)
      .then(function (data) {
        // Always keep the list cache in sync — even if the user left the form.
        upsertCachedOrder(data.order, (data.lines || []).length);
        // D1: and the detail cache, so reopening this order right after saving
        // doesn't pay a network round trip for what the server just returned.
        // Cloned (not the raw response object) so nothing else that later
        // holds a reference to `data.order` can mutate this cache entry —
        // same reasoning as applyOrderData's shallowCopy.
        orderCache[data.order.orderId] = {
          data: { order: shallowCopy(data.order), lines: data.lines, hiddenMoney: data.hiddenMoney },
          loadedAt: Date.now()
        };
        state.busyAction = null; // reset unconditionally — a stale busyAction would lock every future save
        if (seq !== viewSeq) return;
        applyOrderData(data);
        T.toast(saveToast(isNew, data.order));
        paintForm();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  /**
   * Milestone 3 / 3.8 — the save toast says what actually happened to the
   * approve status when relevant, so "Chỉ lưu (về Nháp)" or an auto-approve
   * confirm doesn't leave the user guessing which one took effect.
   */
  function saveToast(isNew, order) {
    if (isNew) return 'Đã tạo đơn ' + order.orderId;
    if (approveStatusEnabled() && has(order, 'approveStatus')) {
      if (order.approveStatus === 'approved') return 'Đã lưu thay đổi và duyệt đơn.';
      if (order.approveStatus === 'draft') return 'Đã lưu thay đổi (đơn ở trạng thái Nháp).';
    }
    return 'Đã lưu thay đổi.';
  }

  function doDelete() {
    if (isBusy()) return;
    var seq = viewSeq;
    var deletedId = state.order.orderId;
    state.busyAction = 'deleting';
    paintForm();
    T.call('apiDeleteOrder', deletedId)
      .then(function () {
        removeCachedOrder(deletedId);
        delete orderCache[deletedId];
        state.busyAction = null;
        if (seq !== viewSeq) return;
        T.toast('Đã xoá đơn hàng.');
        showList();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  /** Milestone 3 / 3.8 — "Gửi duyệt": draft/rejected -> wait_approval. */
  /**
   * UI revision (2026-09-03, "Option A") — these four confirm* functions
   * now take the order they act on (and a `run` callback that actually
   * fires the request) instead of reaching for state.order directly, so
   * the SAME confirm copy/wording serves both the detail title's marker
   * (order = state.order, run = doApproveStatusAction) and a list card's
   * marker (order = that card, run = doApproveStatusActionQuick) — see
   * onClick's ask-request-approve/ask-approve/ask-reject/ask-set-draft
   * cases, which pick which pair to pass based on data-menu-key.
   */
  function confirmRequestApprove(order, run) {
    T.confirm({
      title: 'Gửi duyệt đơn hàng?',
      message: 'Đơn sẽ chuyển sang trạng thái Chờ duyệt.',
      summary: orderSummaryFor(order),
      okLabel: 'Gửi duyệt', cancelLabel: 'Không', danger: false
    }).then(function (ok) { if (ok) run('apiRequestApprove', 'requesting-approve',
                                        'wait_approval', 'Đã gửi duyệt.'); });
  }

  /** Milestone 3 / 3.8 — REPLACES the 3.6 confirmApprove/doApprove outright:
   *  wait_approval -> approved, approve_order only. */
  function confirmApprove(order, run) {
    T.confirm({
      title: 'Duyệt đơn hàng?',
      message: 'Đơn sẽ chuyển sang trạng thái Đã duyệt.',
      summary: orderSummaryFor(order),
      okLabel: 'Duyệt', cancelLabel: 'Không', danger: false
    }).then(function (ok) { if (ok) run('apiApproveOrder', 'approving',
                                        'approved', 'Đã duyệt đơn hàng.'); });
  }

  /** Milestone 3 / 3.8 — wait_approval -> rejected, with an optional note. */
  function confirmReject(order, run) {
    T.confirm({
      title: 'Từ chối đơn hàng?',
      message: 'Đơn sẽ chuyển sang trạng thái Từ chối.',
      summary: orderSummaryFor(order),
      noteField: { label: 'Lý do từ chối (không bắt buộc)', placeholder: 'Ví dụ: thiếu thông tin...' },
      okLabel: 'Từ chối', cancelLabel: 'Không', danger: true
    }).then(function (res) {
      if (res && res.ok) {
        run('apiRejectOrder', 'rejecting', 'rejected', 'Đã từ chối đơn hàng.', res.note);
      }
    });
  }

  /**
   * 2026-09-03 (point 5) — "Về Nháp": any status -> draft, self-approver
   * only. No note field (the user's explicit answer): Duyệt and Gửi duyệt
   * both confirm without one, and only Từ chối asks for a reason.
   */
  function confirmSetDraft(order, run) {
    T.confirm({
      title: 'Chuyển đơn về Nháp?',
      message: 'Đơn sẽ chuyển sang trạng thái Nháp và có thể sửa lại bình thường.',
      summary: orderSummaryFor(order),
      okLabel: 'Về Nháp', cancelLabel: 'Không', danger: false
    }).then(function (ok) { if (ok) run('apiSetDraftOrder', 'setting-draft',
                                        'draft', 'Đã chuyển đơn về Nháp.'); });
  }

  /**
   * Mirror of the server's approveActionFlags_ (Orders.gs) for the local
   * repaint right after an approve-status action lands — the server
   * re-decides for real on the next request, this only keeps the buttons
   * honest in the meantime. Kept as one function for the same reason the
   * server has one: the two copies of these rules had already drifted once.
   */
  function localApproveFlags(approveStatus) {
    var selfApprover = T.can('edit_order') && T.can('approve_order');
    if (selfApprover) {
      return {
        canRequestApprove: false,
        canApprove: approveStatus !== 'approved',
        canReject: approveStatus !== 'rejected',
        canSetDraft: approveStatus !== 'draft'
      };
    }
    return {
      canRequestApprove: (approveStatus === 'draft' || approveStatus === 'rejected'),
      canApprove: T.can('approve_order') && approveStatus === 'wait_approval',
      canReject: T.can('approve_order') && approveStatus === 'wait_approval',
      canSetDraft: false
    };
  }

  /**
   * Milestone 3 / 3.8 — shared driver for requestApprove/approveOrder/
   * rejectOrder/setDraftOrder: same shape as the old doApprove() (3.6),
   * generalized to the four actions. Not optimistic: the server is the source of truth
   * for the new approveStatus (it re-checks state inside the lock against a
   * race), so the form is repainted from the actual response rather than
   * guessed at locally. Also patches the list-card cache the same way
   * changeStatusQuick/the old doApprove did, so "← Danh sách" never shows a
   * stale approveStatus or stale canRequestApprove/canApprove/canReject.
   */
  function doApproveStatusAction(apiFn, busyLabel, newApproveStatus, successToast, note) {
    if (isBusy()) return;
    var seq = viewSeq;
    var orderId = state.order.orderId;
    var payload = { orderId: orderId };
    if (note !== undefined) payload.note = note;
    state.busyAction = busyLabel;
    state.approveMenuOpenFor = null; // the action is firing — menu closes, spinner takes over
    paintForm();
    T.call(apiFn, payload)
      .then(function () {
        state.busyAction = null;
        state.order.approveStatus = newApproveStatus;
        // Recompute every action flag from scratch rather than trust a
        // guessed patch — see localApproveFlags above.
        var flags = localApproveFlags(newApproveStatus);
        state.order.canRequestApprove = flags.canRequestApprove;
        state.order.canApprove = flags.canApprove;
        state.order.canReject = flags.canReject;
        state.order.canSetDraft = flags.canSetDraft;
        delete orderCache[orderId]; // stale otherwise, same reasoning as changeStatusQuick
        var card = state.orders.filter(function (o) { return o.orderId === orderId; })[0];
        if (card) card.approveStatus = newApproveStatus;
        if (seq !== viewSeq) return;
        T.toast(successToast);
        paintForm();
      })
      .catch(function (err) {
        state.busyAction = null;
        if (seq !== viewSeq) return;
        paintForm();
        T.toast(err.message, true);
      });
  }

  /**
   * UI revision (2026-09-03, "Option A") — list-card twin of
   * doApproveStatusAction above, for an approve action fired from a LIST
   * CARD's fused-marker menu rather than the detail title's. Same shape as
   * doChangeStatusQuick: tracks in-flight state per orderId (not a single
   * global busyAction, since more than one card exists at once), patches
   * state.orders in place on success, and drops both caches so neither the
   * list nor a later-opened detail view shows a stale approveStatus.
   */
  function doApproveStatusActionQuick(order, apiFn, busyLabel, newApproveStatus, successToast, note) {
    var orderId = order.orderId;
    if (state.approveUpdatingIds[orderId]) return;
    var payload = { orderId: orderId };
    if (note !== undefined) payload.note = note;
    state.approveUpdatingIds[orderId] = true;
    state.approveMenuOpenFor = null;
    paintList();
    T.call(apiFn, payload)
      .then(function () {
        order.approveStatus = newApproveStatus;
        var flags = localApproveFlags(newApproveStatus);
        order.canRequestApprove = flags.canRequestApprove;
        order.canApprove = flags.canApprove;
        order.canReject = flags.canReject;
        order.canSetDraft = flags.canSetDraft;
        if (state.ordersLoadedAt) state.ordersLoadedAt = Date.now(); // keep the list cache fresh, same as doChangeStatusQuick
        delete orderCache[orderId]; // stale otherwise — see doApproveStatusAction
        delete state.approveUpdatingIds[orderId];
        paintList();
        T.toast(successToast);
      })
      .catch(function (err) {
        delete state.approveUpdatingIds[orderId];
        paintList();
        T.toast(err.message, true);
      });
  }

  window.TTOrders = { render: render, prefetch: prefetch };
})();
</script>
